[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bpm"
version = "0.1.0"
description = "AI-Driven Business Process Management"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenClaw", email = "openclaw@example.com"}
]

dependencies = [
    "click>=8.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
abpm = "agentic_bpm.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_bpm*"]