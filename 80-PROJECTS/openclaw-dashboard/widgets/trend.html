<!-- OpenClaw Trend Widget -->
<!-- Usage: <div id="trend-target"></div><script src="/openclaw-dashboard/widgets/trend.html?data=1,3,2,5,4&label=Score&color=cyan"></script> -->
<template id="oc-trend-template">
  <style>
    .oc-trend {
      font-family: system-ui, sans-serif;
      padding: 12px;
      border-radius: 8px;
      background: #12141a;
      border: 1px solid #1e2330;
    }
    .oc-trend-title {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .oc-trend-canvas { display: block; width: 100%; height: 60px; }
  </style>
  <div class="oc-trend">
    <div class="oc-trend-title" id="oc-trend-title"></div>
    <canvas class="oc-trend-canvas" id="oc-trend-canvas"></canvas>
  </div>
</template>
<script>
  (function() {
    function renderTrend(targetId, data, label, color) {
      var target = document.getElementById(targetId);
      if (!target) return;
      var tmpl = document.getElementById('oc-trend-template');
      if (!tmpl) return;
      var clone = tmpl.content.cloneNode(true);
      if (label) clone.getElementById('oc-trend-title').textContent = label;
      var canvas = clone.getElementById('oc-trend-canvas');
      target.appendChild(clone);
      var ctx = canvas.getContext('2d');
      var vals = data.map(Number);
      var max = Math.max.apply(null, vals);
      var min = Math.min.apply(null, vals);
      var range = max - min || 1;
      var w = canvas.width = canvas.offsetWidth * 2;
      var h = canvas.height = canvas.offsetHeight * 2;
      ctx.strokeStyle = color || '#00d4ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      vals.forEach(function(v, i) {
        var x = (i / (vals.length - 1)) * w;
        var y = h - ((v - min) / range) * h * 0.8 - h * 0.1;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
    var script = document.currentScript;
    var src = script ? script.src : '';
    var params = new URL(src, location.href).searchParams;
    var data = (params.get('data') || '0,0').split(',').map(Number);
    var label = params.get('label') || '';
    var color = params.get('color') || '#00d4ff';
    window.renderOCTrend = renderTrend;
    window.addEventListener('DOMContentLoaded', function() {
      var targets = document.querySelectorAll('[id^="oc-trend-"]');
      // auto-render if target exists
    });
  })();
</script>
