syntax = "proto3";

package agent;

option go_package = "github.com/openclaw/multi-agent-discuss/pkg/proto";

message AgentInfo {
  string id = 1;
  string name = 2;
  repeated Capability capabilities = 3;
  int32 port = 4;
}

message Capability {
  string name = 1;
  string description = 2;
  repeated string params = 3;
}

message AgentMessage {
  string id = 1;
  int64 timestamp = 2;
  string sender_id = 3;
  repeated string receiver_ids = 4;
  MessageType type = 5;
  bytes payload = 6;
  bool should_forward = 7;
  uint32 hop_count = 8;
  uint32 max_hops = 9;
  repeated string visited = 10;
}

enum MessageType {
  TEXT = 0;
  TASK = 1;
  INVITE = 2;
  RESPONSE = 3;
  FORWARD = 4;
  HEARTBEAT = 5;
  INVOKE_TOOL = 10;  // New: request remote tool execution
  TOOL_RESULT = 11;  // New: tool execution result
  ORCHESTRATE = 12;  // New: P2P task orchestration
}

service AgentService {
  rpc SendMessage(stream AgentMessage) returns (stream AgentMessage);
  rpc Connect(AgentInfo) returns (stream AgentMessage);
}

message InvokeToolPayload {
  string invoke_id = 1;
  string tool = 2;
  map<string, string> args = 3;
}

message ToolResultPayload {
  string invoke_id = 1;
  bool success = 2;
  bytes result = 3;
  string error = 4;
}

message OrchestratePayload {
  string task = 1;  // High-level task description
}
