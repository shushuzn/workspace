# News Workflow Engine - Configuration Example

# 复制此文件为 config.yaml 并修改配置

news:
  # 新闻源配置
  sources:
    - name: sina_finance
      enabled: true
      url: "https://finance.sina.com.cn"
    - name: wallstreet_cn
      enabled: true
      url: "https://www.wallstreetcn.com"
    - name: 36kr
      enabled: true
      url: "https://36kr.com"
    - name: huxiu
      enabled: true
      url: "https://www.huxiu.com"
    - name: techcrunch
      enabled: false
      url: "https://techcrunch.com"
  
  # 抓取间隔 (秒)
  fetch_interval: 300
  
  # 每次抓取数量
  fetch_limit: 50

analysis:
  # AI 模型配置
  model: "ollama/llama3"  # 或 "openai/gpt-3.5-turbo"
  api_key: ""  # OpenAI API key (如使用 OpenAI)
  ollama_host: "http://localhost:11434"
  
  # 重要性阈值 (0-1)
  importance_threshold: 0.7
  
  # 情感分析配置
  sentiment:
    enabled: true
    categories:
      - positive
      - neutral
      - negative
  
  # 分类配置
  categories:
    - tech
    - finance
    - market
    - policy
    - company
    - product

workflows:
  # 启用的工作流模板
  enabled_templates:
    - tech_research
    - market_monitor
    - risk_alert
    - competitor_analysis
  
  # 自动执行
  auto_execute: true
  
  # 最大并发任务数
  max_concurrent_tasks: 5
  
  # 任务超时 (秒)
  task_timeout: 600

executor:
  # patrol-agent 配置
  patrol_agent_path: "D:/OpenClaw/workspace/.omc/patrol-agent"
  
  # 执行模式
  mode: "async"  # sync 或 async
  
  # 重试配置
  retry:
    enabled: true
    max_retries: 3
    delay: 10

push:
  # 推送渠道
  channels:
    feishu:
      enabled: true
      webhook_url: ""  # 飞书 webhook
    telegram:
      enabled: false
      bot_token: ""
      chat_id: ""
    email:
      enabled: false
      smtp_server: ""
      smtp_port: 587
      username: ""
      password: ""
  
  # 推送重要性阈值
  importance_threshold: 0.8
  
  # 推送频率限制 (秒)
  rate_limit: 60

feedback:
  # 反馈闭环配置
  enabled: true
  
  # 优化间隔 (秒)
  optimize_interval: 3600
  
  # 收集执行结果
  collect_results: true
  
  # 自动调整阈值
  auto_adjust_threshold: true

database:
  # 数据库配置
  path: "data/news_workflow.db"
  
  # 数据保留天数
  retention_days: 30

logging:
  # 日志配置
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  file: "logs/news_workflow.log"
  rotation: "10 MB"
  retention: "7 days"
