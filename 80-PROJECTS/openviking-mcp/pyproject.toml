[project]
name = "openviking-mcp"
version = "0.1.0"
description = "OpenViking MCP Server - Context database for AI agents"
authors = [{name = "OpenClaw"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openviking>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
openviking-mcp = "openviking_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openviking_mcp"]
