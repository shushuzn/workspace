<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Islands - 多Agent协作系统</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --border: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-cyan: #39c5cf;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, #1a2332 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 1rem;
            padding: 1rem;
            min-height: calc(100vh - 80px);
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1rem;
        }

        /* Agent List */
        .agent-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .agent-item {
            background: var(--bg-hover);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }

        .agent-item:hover {
            background: var(--border);
        }

        .agent-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .agent-info {
            flex: 1;
        }

        .agent-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .agent-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active { background: var(--accent-green); color: #000; }
        .status-idle { background: var(--accent-yellow); color: #000; }
        .status-error { background: var(--accent-red); color: #fff; }
        .status-offline { background: var(--text-secondary); color: #000; }

        /* Workflow List */
        .workflow-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .workflow-item {
            background: var(--bg-hover);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .workflow-item:hover {
            border-color: var(--accent-blue);
        }

        .workflow-item.active {
            border-color: var(--accent-green);
            background: rgba(63, 185, 80, 0.1);
        }

        .workflow-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .workflow-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .workflow-steps {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .workflow-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .run-btn {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .run-btn:hover {
            background: var(--accent-cyan);
        }

        /* Center Panel - Visualizations */
        .center-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .visual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .viz-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        .viz-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Canvas for animations */
        .viz-canvas {
            height: 200px;
            position: relative;
        }

        /* Task Flow Visualization */
        .flow-container {
            height: 300px;
            overflow: auto;
        }

        .flow-node {
            position: absolute;
            background: var(--bg-hover);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-align: center;
            min-width: 100px;
            transition: all 0.3s;
        }

        .flow-node.active {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.3);
        }

        .flow-node.completed {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.1);
        }

        .flow-node.error {
            border-color: var(--accent-red);
            background: rgba(248, 81, 73, 0.1);
        }

        /* Right Panel */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .metric-item {
            background: var(--bg-hover);
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .metric-label {
            font-size: 0.625rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Activity Log */
        .log-container {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
        }

        .log-time {
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }

        .log-success { color: var(--accent-green); }
        .log-error { color: var(--accent-red); }
        .log-info { color: var(--accent-blue); }

        /* Chat Interface */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .chat-message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .chat-message.user {
            background: var(--accent-blue);
            color: #000;
            margin-left: 2rem;
        }

        .chat-message.agent {
            background: var(--bg-hover);
            margin-right: 2rem;
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .chat-send {
            background: var(--accent-blue);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        /* Progress bar */
        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-green);
            transition: width 0.3s;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
        }

        .tooltip-content {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .tooltip:hover .tooltip-content {
            opacity: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🏝️</div>
            <div class="logo-text">Agent Islands</div>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <div class="stat-value" id="agent-count">5</div>
                <div class="stat-label">Agents</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="workflow-count">6</div>
                <div class="stat-label">Workflows</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="task-count">0</div>
                <div class="stat-label">Tasks</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="uptime">00:00:00</div>
                <div class="stat-label">Uptime</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Left Panel - Agents -->
        <div class="left-panel">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">🤖 Agent 群岛</div>
                    <button class="run-btn" onclick="refreshAgents()">刷新</button>
                </div>
                <div class="card-body">
                    <div class="agent-list" id="agent-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top: 1rem;">
                <div class="card-header">
                    <div class="card-title">📋 工作流</div>
                </div>
                <div class="card-body">
                    <div class="workflow-list" id="workflow-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Panel - Visualizations -->
        <div class="center-panel">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">🔄 任务流可视化</div>
                    <button class="run-btn" onclick="runDemo()">运行演示</button>
                </div>
                <div class="card-body">
                    <div class="flow-container" id="flow-container">
                        <canvas id="flow-canvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="visual-grid">
                <div class="viz-card">
                    <div class="viz-title">📊 Agent 活动</div>
                    <canvas id="activity-chart" height="150"></canvas>
                </div>
                <div class="viz-card">
                    <div class="viz-title">⏱️ 响应时间</div>
                    <canvas id="latency-chart" height="150"></canvas>
                </div>
                <div class="viz-card">
                    <div class="viz-title">📈 任务成功率</div>
                    <canvas id="success-chart" height="150"></canvas>
                </div>
                <div class="viz-card">
                    <div class="viz-title">🔀 任务分布</div>
                    <canvas id="distribution-chart" height="150"></canvas>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📊 实时指标</div>
                </div>
                <div class="card-body">
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-value" style="color: var(--accent-green);">98%</div>
                            <div class="metric-label">成功率</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" style="color: var(--accent-blue);">45ms</div>
                            <div class="metric-label">平均延迟</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" style="color: var(--accent-yellow);">12</div>
                            <div class="metric-label">活跃任务</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value" style="color: var(--accent-purple);">156</div>
                            <div class="metric-label">今日任务</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class
