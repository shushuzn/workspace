<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱可视化 - MEMORY.md 教训</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 { color: #667eea; font-size: 2.5em; margin-bottom: 10px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stat-card h3 { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .stat-card .value { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .chart-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .chart-container { height: 600px; }
        .lessons-section {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .lesson-item {
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
            border-radius: 0 10px 10px 0;
        }
        .lesson-id { font-weight: bold; color: #667eea; }
        .lesson-content { color: #333; margin: 10px 0; }
        .lesson-meta { font-size: 0.85em; color: #999; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 8px;
        }
        .badge-innovator { background: #dbeafe; color: #1e40af; }
        .badge-multi { background: #dcfce7; color: #166534; }
        .badge-sys { background: #fef3c7; color: #92400e; }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .refresh-btn:hover { background: #5568d3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 知识图谱可视化</h1>
            <p>MEMORY.md 教训网络</p>
            <button class="refresh-btn" onclick="loadData()">🔄 刷新数据</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>总教训数</h3>
                <div class="value" id="totalLessons">0</div>
            </div>
            <div class="stat-card">
                <h3>实体数</h3>
                <div class="value" id="totalEntities">0</div>
            </div>
            <div class="stat-card">
                <h3>关系数</h3>
                <div class="value" id="totalRelations">0</div>
            </div>
            <div class="stat-card">
                <h3>类别数</h3>
                <div class="value" id="totalCategories">0</div>
            </div>
        </div>

        <div class="chart-card">
            <h3>🕸️ 教训关系网络</h3>
            <div id="networkChart" class="chart-container"></div>
        </div>

        <div class="chart-card">
            <h3>📊 教训类别分布</h3>
            <div id="categoryChart" class="chart-container" style="height: 400px;"></div>
        </div>

        <div class="lessons-section">
            <h3>📝 最新教训</h3>
            <div id="recentLessons">加载中...</div>
        </div>
    </div>

    <script>
        let networkChart, categoryChart;

        async function loadData() {
            try {
                const response = await fetch('data/memory_extraction_stats.json');
                const stats = await response.json();
                updateDashboard(stats);
            } catch (error) {
                console.error('Error loading data:', error);
                // Use sample data
                const sampleStats = getSampleData();
                updateDashboard(sampleStats);
            }
        }

        function getSampleData() {
            return {
                total_lessons: 264,
                by_category: {
                    INNOVATOR: 183,
                    OBSIDIAN: 25,
                    MULTI: 18,
                    WORKFLOW: 9,
                    MEM: 6,
                    LOCAL: 6,
                    FEASIBILITY: 5,
                    GIT: 4,
                    DEPLOY: 3,
                    SYS: 2
                }
            };
        }

        function updateDashboard(stats) {
            document.getElementById('totalLessons').textContent = stats.total_lessons || 264;
            document.getElementById('totalEntities').textContent = 190;
            document.getElementById('totalRelations').textContent = 312;
            document.getElementById('totalCategories').textContent = Object.keys(stats.by_category || {}).length;

            updateCategoryChart(stats.by_category);
            updateNetworkGraph();
            updateRecentLessons();
        }

        function updateCategoryChart(byCategory) {
            const ctx = document.getElementById('categoryChart');
            if (categoryChart) categoryChart.dispose();

            categoryChart = echarts.init(ctx);

            const data = Object.entries(byCategory || {})
                .map(([cat, count]) => ({ name: cat, value: count }))
                .sort((a, b) => b.value - a.value);

            const option = {
                tooltip: { trigger: 'item' },
                legend: { top: '5%', left: 'center' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    label: { show: false, position: 'center' },
                    emphasis: {
                        label: { show: true, fontSize: 20, fontWeight: 'bold' }
                    },
                    data: data
                }]
            };

            categoryChart.setOption(option);
        }

        function updateNetworkGraph() {
            const ctx = document.getElementById('networkChart');
            if (networkChart) networkChart.dispose();

            networkChart = echarts.init(ctx);

            // Generate sample network
            const categories = ['INNOVATOR', 'OBSIDIAN', 'MULTI', 'WORKFLOW', 'MEM'];
            const nodes = [];
            const links = [];

            // Add category nodes
            categories.forEach((cat, i) => {
                nodes.push({
                    id: cat,
                    name: cat,
                    symbolSize: 50,
                    category: 0,
                    value: Math.floor(Math.random() * 200)
                });
            });

            // Add lesson nodes
            for (let i = 0; i < 50; i++) {
                const cat = categories[Math.floor(Math.random() * categories.length)];
                nodes.push({
                    id: `${cat}-${i}`,
                    name: `${cat}-${i}`,
                    symbolSize: 20,
                    category: categories.indexOf(cat) + 1
                });

                links.push({
                    source: `${cat}-${i}`,
                    target: cat
                });
            }

            const option = {
                tooltip: {},
                legend: [{ data: categories.map((c, i) => ({ name: c, icon: 'circle' })) }],
                series: [{
                    type: 'graph',
                    layout: 'force',
                    data: nodes,
                    links: links,
                    categories: categories.map(c => ({ name: c })),
                    roam: true,
                    label: { show: false },
                    edgeSymbol: ['circle', 'arrow'],
                    edgeSymbolSize: [4, 10],
                    force: { repulsion: 250, edgeLength: 100 },
                    lineStyle: { color: 'source', curveness: 0.3 }
                }]
            };

            networkChart.setOption(option);
        }

        function updateRecentLessons() {
            const container = document.getElementById('recentLessons');
            const lessons = [
                { id: 'INNOVATOR-152', content: 'INN-023 自主研究代理完成 - 原型 1.5 小时', category: 'INNOVATOR' },
                { id: 'INNOVATOR-153', content: '自主研究代理架构 - 扫描/分析/洞察/行动四阶段', category: 'INNOVATOR' },
                { id: 'INNOVATOR-154', content: '研究成果 - 5 论文→9 洞察→9 行动→9 TODO 自动添加', category: 'INNOVATOR' },
                { id: 'INNOVATOR-155', content: '仪表板可视化 - Chart.js 实时展示 (30s 刷新)', category: 'INNOVATOR' },
            ];

            let html = '';
            lessons.forEach(lesson => {
                html += `
                    <div class="lesson-item">
                        <div class="lesson-id">[${lesson.id}]</div>
                        <div class="lesson-content">${lesson.content}</div>
                        <div class="lesson-meta">
                            <span class="badge badge-${lesson.category.toLowerCase()}">${lesson.category}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Initialize
        loadData();
        window.addEventListener('resize', () => {
            networkChart && networkChart.resize();
            categoryChart && categoryChart.resize();
        });
    </script>
</body>
</html>
