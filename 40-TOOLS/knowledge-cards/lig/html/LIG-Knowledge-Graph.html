<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 生物医学应用知识图谱</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        .container { 
            width: 100vw; 
            height: 100vh;
            position: relative;
        }
        #graph { 
            width: 100%; 
            height: 100%; 
        }
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
            max-width: 350px;
        }
        .header h1 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .header p {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .legend h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 12px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .controls button {
            display: block;
            width: 100%;
            padding: 8px 15px;
            margin: 5px 0;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }
        .controls button:hover {
            background: #5568d3;
        }
        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 300px;
            line-height: 1.5;
        }
        .tooltip strong {
            color: #667eea;
        }
        .node {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .node:hover {
            opacity: 0.8;
        }
        .link {
            stroke-opacity: 0.6;
        }
        .label {
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            text-anchor: middle;
            fill: white;
            text-shadow: 
                -1px -1px 0 #000,  
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
        }
        .stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 12px;
        }
        .stat-value {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 LIG 生物医学应用知识图谱</h1>
            <p><strong>激光诱导石墨烯 (Laser-Induced Graphene)</strong></p>
            <p style="margin-top: 10px; font-size: 12px; color: #888;">
                基于 3 篇综述 (AdvSci 2026, RSC 2025, DOAJ 2025)<br>
                + 3 篇原创论文 (ACS 2026)
            </p>
            <div class="stats">
                <div class="stat-item">
                    <span>节点总数:</span>
                    <span class="stat-value" id="nodeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>关系总数:</span>
                    <span class="stat-value" id="linkCount">0</span>
                </div>
                <div class="stat-item">
                    <span>实体类型:</span>
                    <span class="stat-value" id="typeCount">0</span>
                </div>
            </div>
        </div>
        
        <div class="legend">
            <h3>📍 节点类型 (点击筛选)</h3>
            <div class="legend-item" onclick="toggleType('Material')" style="cursor:pointer">
                <div class="legend-color" style="background: #FF6B6B;" id="legend-Material"></div>
                <span>Material (材料)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Device')" style="cursor:pointer">
                <div class="legend-color" style="background: #4ECDC4;" id="legend-Device"></div>
                <span>Device (设备)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Signal')" style="cursor:pointer">
                <div class="legend-color" style="background: #45B7D1;" id="legend-Signal"></div>
                <span>Signal (信号/分子)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Technology')" style="cursor:pointer">
                <div class="legend-color" style="background: #FFA07A;" id="legend-Technology"></div>
                <span>Technology (技术)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Application')" style="cursor:pointer">
                <div class="legend-color" style="background: #98D8C8;" id="legend-Application"></div>
                <span>Application (应用)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Challenge')" style="cursor:pointer">
                <div class="legend-color" style="background: #F7DC6F;" id="legend-Challenge"></div>
                <span>Challenge (挑战)</span>
            </div>
            <div class="legend-item" onclick="toggleType('Pathway')" style="cursor:pointer">
                <div class="legend-color" style="background: #BB8FCE;" id="legend-Pathway"></div>
                <span>Pathway (通路/机制)</span>
            </div>
            <div style="margin-top:10px;text-align:center">
                <button onclick="showAllTypes()" style="padding:5px 10px;font-size:12px;cursor:pointer">显示全部</button>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="zoomIn()">🔍 放大</button>
            <button onclick="zoomOut()">🔎 缩小</button>
            <button onclick="resetZoom()">🔄 重置</button>
            <button onclick="toggleLabels()">🏷️ 标签</button>
            <button onclick="highlightLIG()">✨ 聚焦 LIG</button>
            <div style="margin-top:10px;border-top:1px solid #ddd;padding-top:10px">
                <label style="font-size:12px">📦 Bundling 强度</label>
                <input type="range" min="0" max="1" step="0.1" value="0.7" 
                       style="width:100%" oninput="updateBundling(this.value)">
                <span id="bundlingValue" style="font-size:11px;color:#667eea">0.7</span>
            </div>
        </div>
        
        <div id="graph"></div>
        <div class="tooltip" id="tooltip"></div>
    </div>

                // 肿瘤贴片机制
                { source: "CuO", target: "Tumor_Patch", label: "负载", value: 3 },
                { source: "Tumor_Patch", target: "Cu2+", label: "释放", value: 3 },
                { source: "Cu2+", target: "ROS", label: "产生", value: 2 },
                { source: "ROS", target: "Cuproptosis", label: "诱导", value: 2 },
                { source: "ROS", target: "Apoptosis", label: "诱导", value: 2 },
                { source: "ROS", target: "Ferroptosis", label: "诱导", value: 2 },
                { source: "Tumor_Patch", target: "Melanoma", label: "治疗", value: 3 },
                { source: "Tumor_Patch", target: "Photothermal_Therapy", label: "实现", value: 2 },
                
                // 气体传感器
                { source: "Gas_Sensor", target: "Gas_Biomarker", label: "检测", value: 2 },
                { source: "Gas_Adsorption", target: "Gas_Sensor", label: "传感机制", value: 2 },
                { source: "Encapsulation", target: "Gas_Sensor", label: "保护", value: 2 },
                
                // 生物传感器
                { source: "Three_Phase_Interface", target: "Biosensor", label: "设计", value: 2 },
                { source: "Enzyme_Reaction", target: "Biosensor", label: "传感机制", value: 2 },
                
                // 可穿戴设备
                { source: "Wearable", target: "ECG", label: "监测", value: 2 },
                { source: "Wearable", target: "EMG", label: "监测", value: 2 },
                { source: "Wireless", target: "Wearable", label: "集成", value: 2 },
                
                // 应用
                { source: "Gas_Sensor", target: "Health_Monitoring", label: "应用于", value: 2 },
                { source: "Gas_Sensor", target: "Disease_Diagnosis", label: "应用于", value: 2 },
                { source: "Neural_Probe", target: "Neural_Recording", label: "应用于", value: 2 },
                { source: "Neural_Probe", target: "Neurological_Disorder", label: "诊断", value: 2 },
                { source: "Wearable", target: "Health_Monitoring", label: "应用于", value: 2 },
                { source: "Gas_Sensor", target: "Environmental_Sensing", label: "应用于", value: 1 },
                
                // 挑战
                { source: "Stability", target: "LIG", label: "挑战", value: 2 },
                { source: "Scalability", target: "Laser_Writing", label: "挑战", value: 2 },
                { source: "Humidity", target: "Gas_Sensor", label: "挑战", value: 2 },
                { source: "Selectivity", target: "Gas_Sensor", label: "挑战", value: 2 },
                { source: "Standardization", target: "Wearable", label: "挑战", value: 1 },
                
                // 解决方案
                { source: "R2R", target: "Scalability", label: "解决", value: 2 },

        // 颜色映射
        const colorMap = {
            "Material": "#FF6B6B",
            "Device": "#4ECDC4",
            "Signal": "#45B7D1",
            "Technology": "#FFA07A",
            "Application": "#98D8C8",
            "Challenge": "#F7DC6F",
            "Pathway": "#BB8FCE"
        };
        
        // 初始化
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", [-width/2, -height/2, width, height]);
        
        // 创建箭头
        svg.append("defs").selectAll("marker")
            .data(["end"])
            .enter().append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 28)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("fill", "#999")
            .attr("d", "M0,-5L10,0L0,5");
        
        const g = svg.append("g");
        
        // 聚类布局配置
        const clusterConfig = {
            "Material": { x: -200, y: -150, label: "材料" },
            "Device": { x: 200, y: -150, label: "设备" },
            "Signal": { x: -200, y: 150, label: "信号" },
            "Technology": { x: 200, y: 150, label: "技术" },
            "Application": { x: 0, y: -250, label: "应用" },
            "Challenge": { x: 0, y: 250, label: "挑战" },
            "Pathway": { x: 300, y: 0, label: "通路" }
        };
        
        // 力导向模拟 (带聚类)
        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-600))
            .force("center", d3.forceCenter(0, 0).strength(0.05))
            .force("collide", d3.forceCollide().radius(d => d.size + 8).strength(0.5))
            .force("x", d3.forceX(d => clusterConfig[d.type].x).strength(2))
            .force("y", d3.forceY(d => clusterConfig[d.type].y).strength(2));
        
        // 绘制 FDEB 路径
        const linkPath = g.append("g")
            .selectAll("path")
            .data(edges)
            .enter().append("path")
            .attr("class", "link")
            .attr("fill", "none")
            .attr("stroke", "#999")
            .attr("stroke-width", d => Math.sqrt(d.value) * 2)
            .attr("stroke-opacity", 0.6)
            .attr("marker-end", "url(#arrowhead)");
        
        // 初始化控制点
        initControlPoints();
        const clusterBg = g.append("g").attr("class", "cluster-bg");
        Object.entries(clusterConfig).forEach(([type, config]) => {
            clusterBg.append("ellipse")
                .attr("cx", config.x)
                .attr("cy", config.y)
                .attr("rx", 140)
                .attr("ry", 100)
                .attr("fill", colorMap[type])
                .attr("opacity", 0.08)
                .attr("stroke", colorMap[type])
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "5,5");
            
            // 聚类标签
            clusterBg.append("text")
                .attr("x", config.x)
                .attr("y", config.y - 60)
                .attr("text-anchor", "middle")
                .attr("fill", colorMap[type])
                .attr("font-size", "14px")
                .attr("font-weight", "bold")
                .attr("opacity", 0.6)
                .text(config.label);
        });
        
        // FDEB 配置
        let bundlingStrength = 0.6; // bundling 强度
        const divisions = 5; // 每条边分割段数
        const compatibilityThreshold = 0.5; // 边兼容性阈值
        
        // 边数据结构 (用于 FDEB)
        const edges = graphData.links.map((link, idx) => ({
            id: idx,
            source: link.source,
            target: link.target,
            value: link.value,
            controlPoints: [] // FDEB 控制点
        }));
        
        // 初始化控制点 (均匀分布在源和目标之间)
        function initControlPoints() {
            edges.forEach(edge => {
                edge.controlPoints = [];
                const sx = typeof edge.source === 'object' ? edge.source.x : 0;
                const sy = typeof edge.source === 'object' ? edge.source.y : 0;
                const tx = typeof edge.target === 'object' ? edge.target.x : 0;
                const ty = typeof edge.target === 'object' ? edge.target.y : 0;
                
                for (let i = 1; i < divisions; i++) {
                    const t = i / divisions;
                    edge.controlPoints.push({
                        x: sx + (tx - sx) * t,
                        y: sy + (ty - sy) * t
                    });
                }
            });
        }
        
        // 计算边之间的兼容性
        function edgeCompatibility(e1, e2) {
            // 角度兼容性
            const angle1 = Math.atan2(
                e1.controlPoints[0]?.y || 0,
                e1.controlPoints[0]?.x || 1
            );
            const angle2 = Math.atan2(
                e2.controlPoints[0]?.y || 0,
                e2.controlPoints[0]?.x || 1
            );
            const angleDiff = Math.abs(angle1 - angle2);
            const angleComp = 1 - (angleDiff / Math.PI);
            
            // 长度兼容性
            const len1 = Math.hypot(
                (typeof e1.target === 'object' ? e1.target.x : 0) - (typeof e1.source === 'object' ? e1.source.x : 0),
                (typeof e1.target === 'object' ? e1.target.y : 0) - (typeof e1.source === 'object' ? e1.source.y : 0)
            );
            const len2 = Math.hypot(
                (typeof e2.target === 'object' ? e2.target.x : 0) - (typeof e2.source === 'object' ? e2.source.x : 0),
                (typeof e2.target === 'object' ? e2.target.y : 0) - (typeof e2.source === 'object' ? e2.source.y : 0)
            );
            const lenComp = 1 - Math.abs(len1 - len2) / Math.max(len1, len2, 1);
            
            // 位置兼容性 (距离)
            const mid1x = (typeof e1.source === 'object' ? e1.source.x : 0) + (typeof e1.target === 'object' ? e1.target.x : 0);
            const mid1y = (typeof e1.source === 'object' ? e1.source.y : 0) + (typeof e1.target === 'object' ? e1.target.y : 0);
            const mid2x = (typeof e2.source === 'object' ? e2.source.x : 0) + (typeof e2.target === 'object' ? e2.target.x : 0);
            const mid2y = (typeof e2.source === 'object' ? e2.source.y : 0) + (typeof e2.target === 'object' ? e2.target.y : 0);
            const dist = Math.hypot(mid1x - mid2x, mid1y - mid2y);
            const posComp = 1 / (1 + dist / 200);
            
            return (angleComp + lenComp + posComp) / 3;
        }
        
        // FDEB 迭代优化
        function applyFDEB() {
            const springStrength = 0.05;
            const attractionStrength = bundlingStrength * 0.02;
            const iterations = 10;
            
            for (let iter = 0; iter < iterations; iter++) {
                edges.forEach(edge => {
                    for (let i = 0; i < edge.controlPoints.length; i++) {
                        const cp = edge.controlPoints[i];
                        let fx = 0, fy = 0;
                        
                        // 弹性力 (保持点均匀分布)
                        if (i > 0) {
                            const prev = edge.controlPoints[i - 1];
                            fx += (prev.x - cp.x) * springStrength;
                            fy += (prev.y - cp.y) * springStrength;
                        }
                        if (i < edge.controlPoints.length - 1) {
                            const next = edge.controlPoints[i + 1];
                            fx += (next.x - cp.x) * springStrength;
                            fy += (next.y - cp.y) * springStrength;
                        }
                        
                        // 吸引力 (平行边汇聚)
                        edges.forEach(otherEdge => {
                            if (edge === otherEdge) return;
                            if (otherEdge.controlPoints.length <= i) return;
                            
                            const compat = edgeCompatibility(edge, otherEdge);
                            if (compat < compatibilityThreshold) return;
                            
                            const otherCp = otherEdge.controlPoints[i];
                            const dx = otherCp.x - cp.x;
                            const dy = otherCp.y - cp.y;
                            const dist = Math.hypot(dx, dy);
                            
                            if (dist > 0 && dist < 150) {
                                fx += dx * attractionStrength * compat / dist;
                                fy += dy * attractionStrength * compat / dist;
                            }
                        });
                        
                        cp.x += fx;
                        cp.y += fy;
                    }
                });
            }
        }
        
        // 生成 B 样条路径
        function generateBSplinePath(edge) {
            const points = [
                typeof edge.source === 'object' ? edge.source : {x: 0, y: 0},
                ...edge.controlPoints,
                typeof edge.target === 'object' ? edge.target : {x: 0, y: 0}
            ];
            
            if (points.length < 3) {
                return `M${points[0].x},${points[0].y}L${points[points.length-1].x},${points[points.length-1].y}`;
            }
            
            // 二次 B 样条
            let path = `M${points[0].x},${points[0].y}`;
            for (let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                path += ` Q${points[i].x},${points[i].y} ${xc},${yc}`;
            }
            path += `L${points[points.length-1].x},${points[points.length-1].y}`;
            
            return path;
        }
        
        // 绘制节点
        const node = g.append("g")
            .selectAll("circle")
            .data(graphData.nodes)
            .enter().append("circle")
            .attr("class", "node")
            .attr("r", d => d.size)
            .attr("fill", d => colorMap[d.type])
            .attr("stroke", "#fff")
            .attr("stroke-width", 2)
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        // 添加标签
        const labels = g.append("g")
            .selectAll("text")
            .data(graphData.nodes)
            .enter().append("text")
            .attr("class", "label")
            .attr("dy", d => d.size + 15)
            .text(d => d.label.split("\n")[0]);
        
        // 初始隐藏标签
        labels.style("display", "none");
        
        // 工具提示
        const tooltip = d3.select("#tooltip");
        
        node.on("mouseover", function(event, d) {
            tooltip.style("opacity", 1)
                .html(`<strong>${d.label.replace("\n", " ")}</strong><br/>${d.desc}<br/><br/><em>类型:</em> ${d.type}`);
        })
        .on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 10) + "px");
        })
        .on("mouseout", function() {
            tooltip.style("opacity", 0);
        });
        
        // 更新位置
        simulation.on("tick", () => {
            linkPath.attr("d", d => computeBundlePath(d.source, d.target));
            
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            labels
                .attr("x", d => d.x)
                .attr("y", d => d.y + d.size + 15);
        });
        
        // 拖拽函数
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 缩放控制
        let currentScale = 1;
        
        function zoomIn() {
            currentScale *= 1.3;
            g.transition().duration(300).attr("transform", `scale(${currentScale})`);
        }
        
        function zoomOut() {
            currentScale /= 1.3;
            g.transition().duration(300).attr("transform", `scale(${currentScale})`);
        }
        
        function resetZoom() {
            currentScale = 1;
            g.transition().duration(300).attr("transform", "scale(1)");
            simulation.alpha(0.3).restart();
        }
        
        // 标签切换
        let labelsVisible = false;
        function toggleLabels() {
            labelsVisible = !labelsVisible;
            labels.style("display", labelsVisible ? "block" : "none");
        }
        
        // 聚焦 LIG
        function highlightLIG() {
            node.transition().duration(300)
                .attr("opacity", d => d.id === "LIG" ? 1 : 0.3);
            linkPath.transition().duration(300)
                .attr("opacity", d => d.source.id === "LIG" || d.target.id === "LIG" ? 1 : 0.1);
        }
        
        // 类型筛选
        let activeTypes = new Set(Object.keys(colorMap));
        
        function toggleType(type) {
            if (activeTypes.has(type)) {
                activeTypes.delete(type);
                document.getElementById(`legend-${type}`).style.opacity = "0.3";
            } else {
                activeTypes.add(type);
                document.getElementById(`legend-${type}`).style.opacity = "1";
            }
            updateVisibility();
        }
        
        function showAllTypes() {
            activeTypes = new Set(Object.keys(colorMap));
            Object.keys(colorMap).forEach(type => {
                document.getElementById(`legend-${type}`).style.opacity = "1";
            });
            updateVisibility();
        }
        
        function updateVisibility() {
            node.transition().duration(300)
                .attr("opacity", d => activeTypes.has(d.type) ? 1 : 0.1);
            linkPath.transition().duration(300)
                .attr("opacity", d => activeTypes.has(d.source.type) && activeTypes.has(d.target.type) ? 0.6 : 0.1);
            labels.transition().duration(300)
                .attr("opacity", d => activeTypes.has(d.type) ? 1 : 0.1);
        }
        
        // 更新 bundling 强度
        function updateBundling(value) {
            bundlingStrength = parseFloat(value);
            document.getElementById("bundlingValue").textContent = value;
            // 重新计算所有路径
            linkPath.attr("d", d => computeBundlePath(d.source, d.target));
        }
        
        // 更新统计
        document.getElementById("nodeCount").textContent = graphData.nodes.length;
        document.getElementById("linkCount").textContent = graphData.links.length;
        document.getElementById("typeCount").textContent = Object.keys(colorMap).length;
        
        // 鼠标滚轮缩放
        svg.on("wheel", function(event) {
            event.preventDefault();
            const delta = event.deltaY > 0 ? 0.9 : 1.1;
            currentScale *= delta;
            currentScale = Math.max(0.3, Math.min(3, currentScale));
            g.transition().duration(100).attr("transform", `scale(${currentScale})`);
        });
        
        // 双击重置
        svg.on("dblclick.zoom", function() {
            resetZoom();
        });
    </script>
</body>
</html>
