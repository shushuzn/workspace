<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 知识图谱 - 图谱对比工具</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
        .container{max-width:1600px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        h1{font-size:24px;color:#333;margin-bottom:20px;border-bottom:3px solid #667eea;padding-bottom:10px}
        .intro{font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
        .load-panel{background:#f5f5f5;padding:20px;border-radius:8px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
        .graph-load{background:white;border:1px solid #e0e0e0;border-radius:8px;padding:15px}
        .graph-load h3{font-size:15px;margin-bottom:10px;color:#333}
        .graph-load .actions{display:flex;gap:10px;margin-top:15px}
        button{background:#667eea;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;transition:background 0.3s}
        button:hover{background:#5568d3}button:disabled{background:#ccc;cursor:not-allowed}
        button.compare{background:#4caf50}button.compare:hover{background:#45a049}
        .status{padding:10px;background:#e3f2fd;border-radius:6px;margin-bottom:15px;font-size:13px;color:#1565c0;display:none}
        .compare-panel{background:#fff3e0;padding:20px;border-radius:8px;margin-bottom:20px;text-align:center}
        .compare-panel button{padding:12px 30px;font-size:15px}
        .results-container{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        .result-card{background:white;border:2px solid #e0e0e0;border-radius:8px;padding:20px}
        .result-card h3{font-size:16px;margin-bottom:15px;color:#333;display:flex;align-items:center;gap:8px}
        .result-card .count{background:#667eea;color:white;padding:2px 10px;border-radius:10px;font-size:12px}
        .result-card.added{border-color:#4caf50}
        .result-card.removed{border-color:#f44336}
        .result-card.modified{border-color:#ff9800}
        .result-card.unchanged{border-color:#9e9e9e}
        .item-list{max-height:300px;overflow-y:auto}
        .item{padding:8px;margin-bottom:8px;background:#f8f9fa;border-radius:4px;font-size:13px}
        .item .label{font-weight:bold;color:#333}
        .item .type{color:#666;font-size:11px;margin-left:8px}
        .item .change{float:right;font-size:11px;padding:2px 6px;border-radius:3px}
        .item.added .change{background:#e8f5e9;color:#2e7d32}
        .item.removed .change{background:#ffebee;color:#c62828}
        .item.modified .change{background:#fff3e0;color:#ef6c00}
        .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
        .summary-card{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:20px;border-radius:8px;text-align:center}
        .summary-card .number{font-size:32px;font-weight:bold;margin-bottom:5px}
        .summary-card .label{font-size:13px;opacity:0.9}
        .summary-card.green{background:linear-gradient(135deg,#4caf50,#45a049)}
        .summary-card.red{background:linear-gradient(135deg,#f44336,#e53935)}
        .summary-card.orange{background:linear-gradient(135deg,#ff9800,#f57c00)}
        .diff-visual{background:white;border:1px solid #e0e0e0;border-radius:8px;padding:20px;margin-top:20px}
        .diff-visual h3{font-size:16px;margin-bottom:15px;color:#333}
        .legend{display:flex;gap:20px;justify-content:center;margin-bottom:15px}
        .legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
        .legend-color{width:16px;height:16px;border-radius:3px}
        .checkbox-group{display:flex;gap:15px;margin-top:10px}
        .checkbox-group label{display:flex;align-items:center;font-size:13px;color:#555;cursor:pointer}
        input[type="file"]{margin-bottom:10px}
        .graph-info{background:#f8f9fa;padding:10px;border-radius:4px;margin-top:10px;font-size:12px}
        .graph-info div{margin:5px 0}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 LIG 知识图谱 - 图谱对比工具</h1>
        <p class="intro">对比两个图谱的差异，显示新增、删除、修改和不变的节点与关系。</p>
        
        <div class="status" id="status"></div>
        
        <div class="load-panel">
            <div class="graph-load">
                <h3>📊 图谱 A (基准)</h3>
                <input type="file" id="fileA" accept=".json" onchange="loadGraph('A', event)">
                <div class="actions">
                    <button onclick="loadSample('A')">📋 加载示例 A</button>
                    <button onclick="clearGraph('A')">🗑️ 清除</button>
                </div>
                <div class="graph-info" id="infoA">
                    <div>状态：<span style="color:#999">未加载</span></div>
                </div>
            </div>
            <div class="graph-load">
                <h3>📊 图谱 B (对比)</h3>
                <input type="file" id="fileB" accept=".json" onchange="loadGraph('B', event)">
                <div class="actions">
                    <button onclick="loadSample('B')">📋 加载示例 B</button>
                    <button onclick="clearGraph('B')">🗑️ 清除</button>
                </div>
                <div class="graph-info" id="infoB">
                    <div>状态：<span style="color:#999">未加载</span></div>
                </div>
            </div>
        </div>
        
        <div class="compare-panel">
            <button class="compare" onclick="compareGraphs()" id="compareBtn" disabled>🔍 开始对比</button>
            <div class="checkbox-group">
                <label><input type="checkbox" id="compareNodes" checked> 对比节点</label>
                <label><input type="checkbox" id="compareLinks" checked> 对比关系</label>
                <label><input type="checkbox" id="showUnchanged"> 显示不变项</label>
            </div>
        </div>
        
        <div class="summary-grid" id="summaryGrid" style="display:none">
            <div class="summary-card">
                <div class="number" id="totalNodes">0</div>
                <div class="label">总节点数</div>
            </div>
            <div class="summary-card green">
                <div class="number" id="addedNodes">0</div>
                <div class="label">新增节点</div>
            </div>
            <div class="summary-card red">
                <div class="number" id="removedNodes">0</div>
                <div class="label">删除节点</div>
            </div>
            <div class="summary-card orange">
                <div class="number" id="modifiedNodes">0</div>
                <div class="label">修改节点</div>
            </div>
        </div>
        
        <div class="results-container" id="resultsContainer" style="display:none">
            <div class="result-card added">
                <h3>✅ 新增 <span class="count" id="addedCount">0</span></h3>
                <div class="item-list" id="addedList"></div>
            </div>
            <div class="result-card removed">
                <h3>❌ 删除 <span class="count" id="removedCount">0</span></h3>
                <div class="item-list" id="removedList"></div>
            </div>
        </div>
        
        <div class="results-container" id="modifiedContainer" style="display:none">
            <div class="result-card modified">
                <h3>🔄 修改 <span class="count" id="modifiedCount">0</span></h3>
                <div class="item-list" id="modifiedList"></div>
            </div>
            <div class="result-card unchanged">
                <h3>✔️ 不变 <span class="count" id="unchangedCount">0</span></h3>
                <div class="item-list" id="unchangedList"></div>
            </div>
        </div>
        
        <div class="diff-visual" id="diffVisual" style="display:none">
            <h3>📈 对比统计</h3>
            <div class="legend">
                <div class="legend-item"><div class="legend-color" style="background:#4caf50"></div>新增</div>
                <div class="legend-item"><div class="legend-color" style="background:#f44336"></div>删除</div>
                <div class="legend-item"><div class="legend-color" style="background:#ff9800"></div>修改</div>
                <div class="legend-item"><div class="legend-color" style="background:#9e9e9e"></div>不变</div>
            </div>
            <div style="text-align:center">
                <button onclick="exportReport()">📤 导出对比报告</button>
            </div>
        </div>
    </div>

    <script>
        let graphA = null;
        let graphB = null;
        let compareResults = null;
        
        // 示例数据
        const sampleA = {
            name: "LIG 基础图谱 v1",
            nodes: [
                {id:"LIG",label:"LIG",type:"Material",size:40},
                {id:"PI",label:"PI",type:"Material",size:20},
                {id:"PDMS",label:"PDMS",type:"Material",size:20},
                {id:"Gas_Sensor",label:"气体传感器",type:"Device",size:25},
                {id:"Neural_Probe",label:"神经探针",type:"Device",size:25}
            ],
            links: [
                {source:"PI",target:"LIG",value:3},
                {source:"PDMS",target:"LIG",value:2},
                {source:"LIG",target:"Gas_Sensor",value:3},
                {source:"LIG",target:"Neural_Probe",value:3}
            ]
        };
        
        const sampleB = {
            name: "LIG 扩展图谱 v2",
            nodes: [
                {id:"LIG",label:"LIG",type:"Material",size:45},
                {id:"PI",label:"PI",type:"Material",size:20},
                {id:"CuO",label:"CuO",type:"Material",size:22},
                {id:"Gas_Sensor",label:"气体传感器",type:"Device",size:25},
                {id:"Tumor_Patch",label:"肿瘤贴片",type:"Device",size:25},
                {id:"Cu2+",label:"Cu²⁺",type:"Signal",size:20},
                {id:"Health",label:"健康监控",type:"Application",size:24}
            ],
            links: [
                {source:"PI",target:"LIG",value:3},
                {source:"CuO",target:"LIG",value:2},
                {source:"LIG",target:"Gas_Sensor",value:3},
                {source:"LIG",target:"Tumor_Patch",value:3},
                {source:"CuO",target:"Cu2+",value:2},
                {source:"Tumor_Patch",target:"Health",value:2}
            ]
        };
        
        function loadSample(side) {
            const data = side === 'A' ? sampleA : sampleB;
            if (side === 'A') {
                graphA = JSON.parse(JSON.stringify(data));
            } else {
                graphB = JSON.parse(JSON.stringify(data));
            }
            updateGraphInfo(side);
            checkCompareReady();
            showStatus(`✅ 已加载示例${side}`);
        }
        
        function loadGraph(side, event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (side === 'A') {
                        graphA = data;
                    } else {
                        graphB = data;
                    }
                    updateGraphInfo(side);
                    checkCompareReady();
                    showStatus(`✅ 已加载 ${file.name}`);
                } catch (error) {
                    showStatus(`❌ 加载失败：${error.message}`);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function clearGraph(side) {
            if (side === 'A') {
                graphA = null;
            } else {
                graphB = null;
            }
            document.getElementById(`file${side}`).value = '';
            document.getElementById(`info${side}`).innerHTML = '<div>状态：<span style="color:#999">未加载</span></div>';
            checkCompareReady();
            showStatus('🗑️ 已清除');
        }
        
        function updateGraphInfo(side) {
            const graph = side === 'A' ? graphA : graphB;
            if (!graph) return;
            
            const nodeCount = graph.nodes?.length || 0;
            const linkCount = graph.links?.length || 0;
            const name = graph.name || `图谱${side}`;
            
            document.getElementById(`info${side}`).innerHTML = `
                <div><strong>${name}</strong></div>
                <div>节点：<strong>${nodeCount}</strong></div>
                <div>关系：<strong>${linkCount}</strong></div>
            `;
        }
        
        function checkCompareReady() {
            const btn = document.getElementById('compareBtn');
            btn.disabled = !(graphA && graphB);
        }
        
        function compareGraphs() {
            if (!graphA || !graphB) {
                showStatus('❌ 请先加载两个图谱!');
                return;
            }
            
            const compareNodes = document.getElementById('compareNodes').checked;
            const compareLinks = document.getElementById('compareLinks').checked;
            const showUnchanged = document.getElementById('showUnchanged').checked;
            
            showStatus('🔄 正在对比...');
            
            const results = {
                nodes: { added: [], removed: [], modified: [], unchanged: [] },
                links: { added: [], removed: [], modified: [], unchanged: [] }
            };
            
            // 对比节点
            if (compareNodes) {
                const nodesA = new Map(graphA.nodes.map(n => [n.id, n]));
                const nodesB = new Map(graphB.nodes.map(n => [n.id, n]));
                
                // 查找新增和修改
                graphB.nodes.forEach(nodeB => {
                    const nodeA = nodesA.get(nodeB.id);
                    if (!nodeA) {
                        results.nodes.added.push(nodeB);
                    } else {
                        const changes = findChanges(nodeA, nodeB);
                        if (changes.length > 0) {
                            results.nodes.modified.push({ ...nodeB, changes });
                        } else {
                            results.nodes.unchanged.push(nodeB);
                        }
                    }
                });
                
                // 查找删除
                graphA.nodes.forEach(nodeA => {
                    if (!nodesB.has(nodeA.id)) {
                        results.nodes.removed.push(nodeA);
                    }
                });
            }
            
            // 对比关系
            if (compareLinks) {
                const linksA = new Map(graphA.links.map(l => [`${l.source}->${l.target}`, l]));
                const linksB = new Map(graphB.links.map(l => [`${l.source}->${l.target}`, l]));
                
                graphB.links.forEach(linkB => {
                    const key = `${linkB.source}->${linkB.target}`;
                    const linkA = linksA.get(key);
                    if (!linkA) {
                        results.links.added.push(linkB);
                    } else {
                        const changes = findChanges(linkA, linkB);
                        if (changes.length > 0) {
                            results.links.modified.push({ ...linkB, changes });
                        } else {
                            results.links.unchanged.push(linkB);
                        }
                    }
                });
                
                graphA.links.forEach(linkA => {
                    const key = `${linkA.source}->${linkA.target}`;
                    if (!linksB.has(key)) {
                        results.links.removed.push(linkA);
                    }
                });
            }
            
            compareResults = results;
            displayResults(results, showUnchanged);
            showStatus('✅ 对比完成!');
        }
        
        function findChanges(objA, objB) {
            const changes = [];
            const keys = new Set([...Object.keys(objA), ...Object.keys(objB)]);
            
            keys.forEach(key => {
                if (key === 'id') return;
                if (JSON.stringify(objA[key]) !== JSON.stringify(objB[key])) {
                    changes.push({
                        field: key,
                        from: objA[key],
                        to: objB[key]
                    });
                }
            });
            
            return changes;
        }
        
        function displayResults(results, showUnchanged) {
            document.getElementById('summaryGrid').style.display = 'grid';
            document.getElementById('resultsContainer').style.display = 'grid';
            document.getElementById('modifiedContainer').style.display = 'grid';
            document.getElementById('diffVisual').style.display = 'block';
            
            const totalNodes = results.nodes.added.length + results.nodes.removed.length + 
                              results.nodes.modified.length + results.nodes.unchanged.length;
            
            document.getElementById('totalNodes').textContent = totalNodes;
            document.getElementById('addedNodes').textContent = results.nodes.added.length;
            document.getElementById('removedNodes').textContent = results.nodes.removed.length;
            document.getElementById('modifiedNodes').textContent = results.nodes.modified.length;
            
            // 新增
            document.getElementById('addedCount').textContent = results.nodes.added.length + results.links.added.length;
            document.getElementById('addedList').innerHTML = [
                ...results.nodes.added.map(n => `<div class="item added"><span class="label">${n.label}</span><span class="type">节点</span><span class="change">+新增</span></div>`),
                ...results.links.added.map(l => `<div class="item added"><span class="label">${l.source}→${l.target}</span><span class="type">关系</span><span class="change">+新增</span></div>`)
            ].join('') || '<div style="color:#999;text-align:center;padding:20px">无新增项</div>';
            
            // 删除
            document.getElementById('removedCount').textContent = results.nodes.removed.length + results.links.removed.length;
            document.getElementById('removedList').innerHTML = [
                ...results.nodes.removed.map(n => `<div class="item removed"><span class="label">${n.label}</span><span class="type">节点</span><span class="change">-删除</span></div>`),
                ...results.links.removed.map(l => `<div class="item removed"><span class="label">${l.source}→${l.target}</span><span class="type">关系</span><span class="change">-删除</span></div>`)
            ].join('') || '<div style="color:#999;text-align:center;padding:20px">无删除项</div>';
            
            // 修改
            document.getElementById('modifiedCount').textContent = results.nodes.modified.length + results.links.modified.length;
            document.getElementById('modifiedList').innerHTML = [
                ...results.nodes.modified.map(n => `
                    <div class="item modified">
                        <span class="label">${n.label}</span><span class="type">节点</span>
                        <span class="change">🔄${n.changes.length}处修改</span>
                        <div style="font-size:11px;color:#666;margin-top:5px">
                            ${n.changes.map(c => `${c.field}: ${JSON.stringify(c.from)}→${JSON.stringify(c.to)}`).join(', ')}
                        </div>
                    </div>
                `),
                ...results.links.modified.map(l => `
                    <div class="item modified">
                        <span class="label">${l.source}→${l.target}</span><span class="type">关系</span>
                        <span class="change">🔄${l.changes.length}处修改</span>
                        <div style="font-size:11px;color:#666;margin-top:5px">
                            ${l.changes.map(c => `${c.field}: ${JSON.stringify(c.from)}→${JSON.stringify(c.to)}`).join(', ')}
                        </div>
                    </div>
                `)
            ].join('') || '<div style="color:#999;text-align:center;padding:20px">无修改项</div>';
            
            // 不变
            document.getElementById('unchangedCount').textContent = results.nodes.unchanged.length + results.links.unchanged.length;
            document.getElementById('unchangedList').innerHTML = [
                ...results.nodes.unchanged.map(n => `<div class="item"><span class="label">${n.label}</span><span class="type">节点</span></div>`),
                ...results.links.unchanged.map(l => `<div class="item"><span class="label">${l.source}→${l.target}</span><span class="type">关系</span></div>`)
            ].join('') || '<div style="color:#999;text-align:center;padding:20px">无不变项</div>';
            
            if (!showUnchanged) {
                document.getElementById('unchangedContainer').style.display = 'none';
            }
        }
        
        function exportReport() {
            if (!compareResults) {
                showStatus('❌ 请先进行对比!');
                return;
            }
            
            const report = {
                exportDate: new Date().toISOString(),
                graphA: { name: graphA.name || '图谱 A', nodes: graphA.nodes?.length, links: graphA.links?.length },
                graphB: { name: graphB.name || '图谱 B', nodes: graphB.nodes?.length, links: graphB.links?.length },
                results: compareResults,
                summary: {
                    added: compareResults.nodes.added.length + compareResults.links.added.length,
                    removed: compareResults.nodes.removed.length + compareResults.links.removed.length,
                    modified: compareResults.nodes.modified.length + compareResults.links.modified.length,
                    unchanged: compareResults.nodes.unchanged.length + compareResults.links.unchanged.length
                }
            };
            
            const json = JSON.stringify(report, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LIG-Compare-Report-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showStatus('✅ 报告已导出!');
        }
        
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
