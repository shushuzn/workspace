<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多模态知识图谱 - WebGL 优化版 (todo-034)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }
    
    #container {
      display: flex;
      height: 100vh;
    }
    
    #sidebar {
      width: 320px;
      background: #16213e;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #0f3460;
    }
    
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .control-panel {
      margin-bottom: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
    }
    
    .control-panel h3 {
      margin-bottom: 10px;
      color: #e94560;
      font-size: 16px;
    }
    
    .control-group {
      margin-bottom: 12px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #aaa;
    }
    
    .control-group input[type="range"] {
      width: 100%;
    }
    
    .control-group select,
    .control-group input[type="number"] {
      width: 100%;
      padding: 8px;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #eee;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
    }
    
    .stats h4 {
      color: #e94560;
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    
    .stat-value {
      color: #4cd137;
      font-weight: bold;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #ff6b81;
    }
    
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #0f3460;
    }
    
    .btn-secondary:hover {
      background: #1a4a7a;
    }
    
    .legend {
      margin-top: 15px;
      padding: 10px;
      background: #0f3460;
      border-radius: 8px;
    }
    
    .legend h4 {
      color: #e94560;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 8px;
    }
    
    .node-info {
      margin-top: 15px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
      display: none;
    }
    
    .node-info h4 {
      color: #e94560;
      margin-bottom: 10px;
    }
    
    .node-info p {
      margin-bottom: 5px;
      font-size: 13px;
    }
    
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 46, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .loading-spinner {
      text-align: center;
    }
    
    .loading-spinner p {
      margin-top: 10px;
      color: #e94560;
    }
    
    .fps-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 52, 96, 0.8);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #4cd137;
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
      <div class="control-panel">
        <h3>🎨 渲染设置</h3>
        
        <div class="control-group">
          <label>渲染模式</label>
          <select id="render-mode">
            <option value="webgl">WebGL (Three.js)</option>
            <option value="canvas">Canvas (D3.js)</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>节点大小：<span id="node-size-value">8</span></label>
          <input type="range" id="node-size" min="3" max="20" value="8">
        </div>
        
        <div class="control-group">
          <label>连线粗细：<span id="link-width-value">1</span></label>
          <input type="range" id="link-width" min="0.5" max="5" value="1" step="0.5">
        </div>
      </div>
      
      <div class="control-panel">
        <h3>📊 性能优化</h3>
        
        <div class="control-group">
          <label>分页大小</label>
          <select id="page-size">
            <option value="100">100 节点/页</option>
            <option value="200">200 节点/页</option>
            <option value="500" selected>500 节点/页</option>
            <option value="1000">1000 节点/页</option>
            <option value="all">全部加载</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>虚拟滚动阈值</label>
          <input type="number" id="virtual-threshold" value="500" min="100" max="2000">
        </div>
      </div>
      
      <div class="control-panel">
        <h3>📈 性能统计</h3>
        <div class="stats">
          <h4>实时统计</h4>
          <div class="stat-item">
            <span>总节点数:</span>
            <span class="stat-value" id="stat-total-nodes">0</span>
          </div>
          <div class="stat-item">
            <span>可见节点:</span>
            <span class="stat-value" id="stat-visible-nodes">0</span>
          </div>
          <div class="stat-item">
            <span>总连线:</span>
            <span class="stat-value" id="stat-total-links">0</span>
          </div>
          <div class="stat-item">
            <span>FPS:</span>
            <span class="stat-value" id="stat-fps">0</span>
          </div>
          <div class="stat-item">
            <span>加载时间:</span>
            <span class="stat-value" id="stat-load-time">0ms</span>
          </div>
        </div>
      </div>
      
      <button class="btn" onclick="graph.loadTestData(100)">加载 100 节点</button>
      <button class="btn" onclick="graph.loadTestData(500)">加载 500 节点</button>
      <button class="btn" onclick="graph.loadTestData(1000)">加载 1000 节点</button>
      <button class="btn" onclick="graph.loadTestData(5000)">加载 5000 节点</button>
      
      <div class="legend">
        <h4>图例</h4>
        <div class="legend-item">
          <div class="legend-color" style="background: #e94560;"></div>
          <span>Paper (论文)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #4cd137;"></div>
          <span>Author (作者)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #00a8ff;"></div>
          <span>Concept (概念)</span>
        </div>
      </div>
      
      <div class="node-info" id="node-info">
        <h4>节点详情</h4>
        <p><strong>ID:</strong> <span id="info-id"></span></p>
        <p><strong>标签:</strong> <span id="info-label"></span></p>
        <p><strong>类型:</strong> <span id="info-type"></span></p>
      </div>
    </div>
    
    <!-- Graph Container -->
    <div id="graph-container">
      <div class="fps-counter" id="fps-counter">FPS: 0</div>
      <canvas id="webgl-canvas"></canvas>
      
      <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="loading-spinner">
          <svg width="50" height="50" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" fill="none" stroke="#e94560" stroke-width="4"
                    stroke-dasharray="80" stroke-dashoffset="0">
              <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
            </circle>
          </svg>
          <p>加载中...</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    /**
     * WebGL Graph Renderer - Three.js 优化版
     * todo-034: 多模态图谱性能优化
     */
    class WebGLGraphRenderer {
      constructor(containerId, options = {}) {
        this.container = document.getElementById(containerId);
        this.canvas = document.getElementById('webgl-canvas');
        this.options = {
          nodeSize: 8,
          linkWidth: 1,
          pageSize: 500,
          virtualThreshold: 500,
          ...options
        };
        
        // Three.js 核心对象
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.nodeMeshes = [];
        this.linkLines = [];
        
        // 数据
        this.nodes = [];
        this.links = [];
        this.visibleNodes = [];
        this.visibleLinks = [];
        
        // 状态
        this.currentPage = 0;
        this.totalPages = 0;
        this.isDragging = false;
        this.lastMousePosition = { x: 0, y: 0 };
        
        // FPS 监控
        this.frameCount = 0;
        this.lastFPSUpdate = performance.now();
        this.currentFPS = 0;
        
        this.init();
      }
      
      init() {
        // 初始化 Three.js 场景
        this.initThreeJS();
        
        // 设置事件监听
        this.setupEventListeners();
        
        // 启动渲染循环
        this.animate();
        
        console.log('✅ WebGL Graph Renderer initialized');
      }
      
      initThreeJS() {
        const width = this.container.clientWidth;
        const height = this.container.clientHeight;
        
        // 场景
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x1a1a2e);
        
        // 相机
        this.camera = new THREE.PerspectiveCamera(
          75,
          width / height,
          0.1,
          1000
        );
        this.camera.position.z = 100;
        
        // 渲染器
        this.renderer = new THREE.WebGLRenderer({ 
          canvas: this.canvas,
          antialias: true 
        });
        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        
        // 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 10);
        this.scene.add(directionalLight);
        
        // 窗口大小调整
        window.addEventListener('resize', () => this.onWindowResize());
      }
      
      setupEventListeners() {
        // 鼠标拖拽
        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
        this.canvas.addEventListener('mouseup', () => this.onMouseUp());
        
        // 滚轮缩放
        this.canvas.addEventListener('wheel', (e) => this.onWheel(e));
        
        // 控制面板
        document.getElementById('node-size').addEventListener('input', (e) => {
          this.options.nodeSize = parseFloat(e.target.value);
          document.getElementById('node-size-value').textContent = this.options.nodeSize;
          this.updateNodeSizes();
        });
        
        document.getElementById('link-width').addEventListener('input', (e) => {
          this.options.linkWidth = parseFloat(e.target.value);
          document.getElementById('link-width-value').textContent = this.options.linkWidth;
          this.updateLinkWidths();
        });
        
        document.getElementById('render-mode').addEventListener('change', (e) => {
          this.switchRenderMode(e.target.value);
        });
      }
      
      loadTestData(nodeCount) {
        const startTime = performance.now();
        
        // 显示加载动画
        document.getElementById('loading-overlay').style.display = 'flex';
        
        // 清空现有数据
        this.clearScene();
        
        // 生成测试数据
        const data = this.generateTestData(nodeCount);
        this.nodes = data.nodes;
        this.links = data.links;
        
        // 计算分页
        const pageSize = this.options.pageSize === 'all' ? nodeCount : parseInt(this.options.pageSize);
        this.totalPages = Math.ceil(nodeCount / pageSize);
        this.currentPage = 0;
        
        // 加载第一页
        this.loadPage(0);
        
        const loadTime = performance.now() - startTime;
        
        // 更新统计
        this.updateStats();
        document.getElementById('stat-load-time').textContent = `${loadTime.toFixed(2)}ms`;
        
        // 隐藏加载动画
        setTimeout(() => {
          document.getElementById('loading-overlay').style.display = 'none';
        }, 100);
        
        console.log(`✅ Loaded ${nodeCount} nodes in ${loadTime.toFixed(2)}ms`);
      }
      
      generateTestData(count) {
        const nodes = [];
        const links = [];
        const types = ['paper', 'author', 'concept'];
        const colors = {
          paper: 0xe94560,
          author: 0x4cd137,
          concept: 0x00a8ff
        };
        
        for (let i = 0; i < count; i++) {
          const type = types[Math.floor(Math.random() * types.length)];
          nodes.push({
            id: i,
            label: `Node ${i}`,
            type: type,
            color: colors[type],
            x: (Math.random() - 0.5) * 80,
            y: (Math.random() - 0.5) * 80,
            z: 0
          });
        }
        
        // 生成连接（每个节点平均 2 条边）
        for (let i = 0; i < count * 2; i++) {
          links.push({
            source: Math.floor(Math.random() * count),
            target: Math.floor(Math.random() * count),
            type: ['cites', 'author', 'related'][Math.floor(Math.random() * 3)]
          });
        }
        
        return { nodes, links };
      }
      
      loadPage(pageNum) {
        if (pageNum < 0 || pageNum >= this.totalPages) return;
        
        this.clearScene();
        
        const pageSize = this.options.pageSize === 'all' ? this.nodes.length : parseInt(this.options.pageSize);
        const start = pageNum * pageSize;
        const end = Math.min(start + pageSize, this.nodes.length);
        
        this.visibleNodes = this.nodes.slice(start, end);
        const visibleIds = new Set(this.visibleNodes.map(n => n.id));
        this.visibleLinks = this.links.filter(l => 
          visibleIds.has(l.source) && visibleIds.has(l.target)
        );
        
        this.createNodes();
        this.createLinks();
        
        this.currentPage = pageNum;
        this.updateStats();
      }
      
      createNodes() {
        const geometry = new THREE.SphereGeometry(this.options.nodeSize / 2, 16, 16);
        
        for (const node of this.visibleNodes) {
          const material = new THREE.MeshBasicMaterial({ 
            color: node.color,
            transparent: true,
            opacity: 0.9
          });
          
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(node.x, node.y, node.z || 0);
          mesh.userData = { nodeId: node.id, nodeData: node };
          
          this.scene.add(mesh);
          this.nodeMeshes.push(mesh);
        }
      }
      
      createLinks() {
        const material = new THREE.LineBasicMaterial({ 
          color: 0x666666,
          transparent: true,
          opacity: 0.4,
          linewidth: this.options.linkWidth
        });
        
        for (const link of this.visibleLinks) {
          const sourceNode = this.visibleNodes.find(n => n.id === link.source);
          const targetNode = this.visibleNodes.find(n => n.id === link.target);
          
          if (!sourceNode || !targetNode) continue;
          
          const points = [
            new THREE.Vector3(sourceNode.x, sourceNode.y, sourceNode.z || 0),
            new THREE.Vector3(targetNode.x, targetNode.y, targetNode.z || 0)
          ];
          
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const line = new THREE.Line(geometry, material);
          
          this.scene.add(line);
          this.linkLines.push(line);
        }
      }
      
      clearScene() {
        // 移除节点
        for (const mesh of this.nodeMeshes) {
          this.scene.remove(mesh);
          mesh.geometry.dispose();
          mesh.material.dispose();
        }
        this.nodeMeshes = [];
        
        // 移除连线
        for (const line of this.linkLines) {
          this.scene.remove(line);
          line.geometry.dispose();
          line.material.dispose();
        }
        this.linkLines = [];
      }
      
      updateNodeSizes() {
        const newGeometry = new THREE.SphereGeometry(this.options.nodeSize / 2, 16, 16);
        
        for (const mesh of this.nodeMeshes) {
          mesh.geometry.dispose();
          mesh.geometry = newGeometry;
        }
      }
      
      updateLinkWidths() {
        for (const line of this.linkLines) {
          line.material.linewidth = this.options.linkWidth;
        }
      }
      
      switchRenderMode(mode) {
        console.log(`Switching to ${mode} mode (not implemented)`);
        // TODO: 实现 Canvas 模式切换
      }
      
      onWindowResize() {
        const width = this.container.clientWidth;
        const height = this.container.clientHeight;
        
        this.camera.aspect = width / height;
        this.camera.updateProjectionMatrix();
        
        this.renderer.setSize(width, height);
      }
      
      onMouseDown(event) {
        this.isDragging = true;
        this.lastMousePosition = {
          x: event.clientX,
          y: event.clientY
        };
      }
      
      onMouseMove(event) {
        if (!this.isDragging) return;
        
        const deltaX = event.clientX - this.lastMousePosition.x;
        const deltaY = event.clientY - this.lastMousePosition.y;
        
        // 旋转场景
        this.scene.rotation.y += deltaX * 0.01;
        this.scene.rotation.x += deltaY * 0.01;
        
        this.lastMousePosition = {
          x: event.clientX,
          y: event.clientY
        };
      }
      
      onMouseUp() {
        this.isDragging = false;
      }
      
      onWheel(event) {
        event.preventDefault();
        
        const zoomSpeed = 0.001;
        this.camera.position.z += event.deltaY * zoomSpeed;
        this.camera.position.z = Math.max(10, Math.min(500, this.camera.position.z));
      }
      
      animate() {
        requestAnimationFrame(() => this.animate());
        
        // 渲染场景
        this.renderer.render(this.scene, this.camera);
        
        // 更新 FPS
        this.updateFPS();
      }
      
      updateFPS() {
        this.frameCount++;
        const now = performance.now();
        
        if (now - this.lastFPSUpdate >= 1000) {
          this.currentFPS = this.frameCount;
          this.frameCount = 0;
          this.lastFPSUpdate = now;
          
          document.getElementById('fps-counter').textContent = `FPS: ${this.currentFPS}`;
          document.getElementById('stat-fps').textContent = this.currentFPS;
        }
      }
      
      updateStats() {
        document.getElementById('stat-total-nodes').textContent = this.nodes.length;
        document.getElementById('stat-visible-nodes').textContent = this.visibleNodes.length;
        document.getElementById('stat-total-links').textContent = this.links.length;
      }
    }
    
    // 初始化图谱
    const graph = new WebGLGraphRenderer('graph-container');
    
    // 暴露给全局以便按钮调用
    window.graph = graph;
    
    console.log('🚀 WebGL Graph Renderer ready');
  </script>
</body>
</html>
