# 自动化研究工作流配置 (6 层次)
workflow:
  # 子工作流 (包含多层次分析)
  sub_workflows:
    - arxiv-collect          # Level 1
    - paper-classification   # Level 2
    - trend-analysis         # Level 3
    - topic-clustering       # Level 4
    - report-gen             # Level 5
    - knowledge-graph        # Level 6 ✨
    - git-commit
    - research-docs
  
  # 执行顺序 (按分析层次)
  execution_order:
    - arxiv-collect          # Level 1: 收集
    - paper-classification   # Level 2: 分类
    - trend-analysis         # Level 3: 趋势
    - topic-clustering       # Level 4: 聚类
    - report-gen             # Level 5: 报告
    - knowledge-graph        # Level 6: 知识图谱 (整合 Level 2+4) ✨
    - research-docs          # 研究文档
    - git-commit             # Git 提交
  
  # 错误处理
  error_handling:
    retry_count: 3
    retry_delay: 60
    fail_fast: false
  
  # 日志配置
  logging:
    level: INFO
    file: logs/workflow.log
    max_size: 10MB
    backup_count: 7
  
  # 统计配置
  stats:
    enabled: true
    file: outputs/workflow-stats.json
