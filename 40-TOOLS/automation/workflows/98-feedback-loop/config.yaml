# 反馈循环配置
feedback_loop:
  # 运行时间
  schedule:
    enabled: true
    cron: "0 23 * * 0"  # 每周日 23:00
  
  # 反馈源
  sources:
    level_6:
      enabled: true
      file: "knowledge-graph/research-network.json"
    level_5:
      enabled: true
      file: "reports/AUTO-RESEARCH-REPORT-{date}.md"
  
  # 反馈目标
  targets:
    level_2:
      enabled: true
      update_keywords: true
      update_relations: true
    level_3:
      enabled: true
      adjust_parameters: true
      update_trends: true
  
  # 反馈类型
  feedback_types:
    - new_keywords
    - new_relations
    - analysis_bias
    - new_trends
  
  # 配置更新
  config_update:
    auto_apply: true
    require_approval: false
    backup_before_update: true
  
  # 反馈记录
  records:
    enabled: true
    dir: "feedback"
    format: "json"
    retention_days: 90
  
  # 日志配置
  logging:
    level: INFO
    file: logs/feedback-loop.log
    max_size: 10MB
    backup_count: 7
