# 质量控制配置 (Level 0)
quality_control:
  # 输入文件
  input_file: "D:\\obsidian\\Vault\\Arxiv\\daily\\{date}\\raw\\papers.json"
  
  # 输出目录
  output_dir: "D:\\obsidian\\Vault\\Arxiv\\daily\\{date}\\quality-controlled\\"
  
  # 验证规则
  validation:
    required_fields:
      - arxiv_id
      - title
      - abstract
    
    arxiv_id_pattern: "^(arXiv:)?\\d{4}\\.\\d{4,5}$"
    min_title_length: 10
    min_abstract_length: 50
  
  # 异常检测
  anomaly_detection:
    enabled: true
    methods:
      - duplicate_check
      - title_length_outlier
      - abstract_length_outlier
    
    outlier_std_threshold: 2.0
  
  # 质量检查点
  quality_gate:
    enabled: true
    min_score: 0.80
    stop_on_failure: true
  
  # 评分配置
  scoring:
    pass_rate_weight: 0.7
    anomaly_rate_weight: 0.3
    
    levels:
      A: 0.95
      B: 0.90
      C: 0.80
      D: 0.70
      F: 0.0
  
  # 元数据
  metadata:
    version: "1.0"
    add_checksum: true
    add_timestamp: true
  
  # 日志配置
  logging:
    level: INFO
    file: logs/quality-control.log
    max_size: 10MB
    backup_count: 7
