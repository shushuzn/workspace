<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片标签树</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 3px solid #4CAF50; padding-bottom: 10px; }
        .tag-tree { margin: 20px 0; }
        .parent-tag { background: #4CAF50; color: white; padding: 10px 15px; margin: 10px 0; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .parent-tag:hover { background: #45a049; }
        .child-tags { margin-left: 30px; display: none; }
        .child-tag { background: #e7f3ff; color: #1976D2; padding: 5px 10px; margin: 5px; border-radius: 3px; display: inline-block; cursor: pointer; }
        .child-tag:hover { background: #bbdefb; }
        .stats { background: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .stat-item { display: inline-block; margin-right: 30px; font-size: 14px; }
        .stat-value { font-weight: bold; color: #4CAF50; font-size: 18px; }
        .search-box { margin: 20px 0; }
        .search-box input { padding: 10px; width: 300px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; }
        .search-box button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        .search-box button:hover { background: #45a049; }
        .image-list { margin-top: 20px; }
        .image-item { background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 3px; border-left: 4px solid #4CAF50; }
        .image-path { font-family: monospace; font-size: 12px; color: #666; }
        .image-desc { margin: 5px 0; color: #333; }
        .image-tags { margin: 5px 0; }
        .tag { background: #e0e0e0; padding: 2px 8px; border-radius: 3px; font-size: 12px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏷️ 图片标签树</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索标签或描述...">
            <button onclick="searchTags()">搜索</button>
            <button onclick="loadTags()" style="background: #2196F3; margin-left: 10px;">刷新</button>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-item">总图片数：<span class="stat-value" id="totalImages">0</span></div>
            <div class="stat-item">父标签数：<span class="stat-value" id="totalParents">0</span></div>
            <div class="stat-item">子标签数：<span class="stat-value" id="totalChildren">0</span></div>
        </div>
        
        <div class="tag-tree" id="tagTree">
            <p style="color: #666; text-align: center;">加载中...</p>
        </div>
        
        <div class="image-list" id="imageList"></div>
    </div>
    
    <script>
        let imageData = [];
        
        async function loadTags() {
            try {
                const response = await fetch('IMAGE_TAGS.csv');
                const text = await response.text();
                const rows = text.trim().split('\n').slice(1);
                
                imageData = rows.map(row => {
                    const cols = row.split(',');
                    return {
                        path: cols[0],
                        tags: cols[1] ? cols[1].split(';') : [],
                        parents: cols[2] ? cols[2].split(';') : [],
                        desc: cols[3] || '',
                        project: cols[4] || '',
                        date: cols[5] || ''
                    };
                });
                
                renderTagTree();
                updateStats();
            } catch (error) {
                document.getElementById('tagTree').innerHTML = '<p style="color: red;">加载失败：' + error.message + '</p>';
            }
        }
        
        function renderTagTree() {
            const parentTags = {};
            const childTags = {};
            
            imageData.forEach(img => {
                img.parents.forEach(parent => {
                    if (parent.trim()) {
                        if (!parentTags[parent]) parentTags[parent] = new Set();
                        img.tags.forEach(tag => parentTags[parent].add(tag));
                    }
                });
                
                img.tags.forEach(tag => {
                    if (tag.trim() && !childTags[tag]) childTags[tag] = [];
                    if (tag.trim()) childTags[tag].push(img);
                });
            });
            
            let html = '';
            for (const [parent, tags] of Object.entries(parentTags)) {
                html += `<div class="parent-tag" onclick="toggleChildren('${parent}')">📁 ${parent}</div>`;
                html += `<div class="child-tags" id="children-${parent}">`;
                for (const tag of tags) {
                    html += `<span class="child-tag" onclick="showImages('${tag}')">🏷️ ${tag}</span>`;
                }
                html += '</div>';
            }
            
            document.getElementById('tagTree').innerHTML = html;
        }
        
        function toggleChildren(parent) {
            const children = document.getElementById(`children-${parent}`);
            children.style.display = children.style.display === 'block' ? 'none' : 'block';
        }
        
        function showImages(tag) {
            const images = imageData.filter(img => img.tags.includes(tag));
            let html = `<h3>🏷️ 标签 "${tag}" 的图片 (${images.length}张)</h3>`;
            
            images.forEach(img => {
                html += `<div class="image-item">
                    <div class="image-path">📄 ${img.path}</div>
                    <div class="image-desc">${img.desc}</div>
                    <div class="image-tags">${img.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                </div>`;
            });
            
            document.getElementById('imageList').innerHTML = html;
        }
        
        function searchTags() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const results = imageData.filter(img => 
                img.tags.some(t => t.toLowerCase().includes(query)) ||
                img.desc.toLowerCase().includes(query) ||
                img.parents.some(p => p.toLowerCase().includes(query))
            );
            
            let html = `<h3>🔍 搜索结果 (${results.length}个)</h3>`;
            results.forEach(img => {
                html += `<div class="image-item">
                    <div class="image-path">📄 ${img.path}</div>
                    <div class="image-desc">${img.desc}</div>
                    <div class="image-tags">${img.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                </div>`;
            });
            
            document.getElementById('imageList').innerHTML = html;
        }
        
        function updateStats() {
            document.getElementById('totalImages').textContent = imageData.length;
            
            const parentTags = new Set();
            const childTags = new Set();
            
            imageData.forEach(img => {
                img.parents.forEach(p => parentTags.add(p));
                img.tags.forEach(t => childTags.add(t));
            });
            
            document.getElementById('totalParents').textContent = parentTags.size;
            document.getElementById('totalChildren').textContent = childTags.size;
        }
        
        // 初始化
        loadTags();
    </script>
</body>
</html>
