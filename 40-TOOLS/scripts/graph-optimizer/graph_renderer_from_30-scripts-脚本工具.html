<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多模态知识图谱 - WebGL 优化版</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }
    
    #container {
      display: flex;
      height: 100vh;
    }
    
    #sidebar {
      width: 300px;
      background: #16213e;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #0f3460;
    }
    
    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    #graph-svg {
      width: 100%;
      height: 100%;
    }
    
    .node {
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .node:hover {
      filter: brightness(1.3);
    }
    
    .node-label {
      font-size: 12px;
      fill: #eee;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    .link {
      stroke-opacity: 0.6;
    }
    
    .control-panel {
      margin-bottom: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
    }
    
    .control-panel h3 {
      margin-bottom: 10px;
      color: #e94560;
    }
    
    .control-group {
      margin-bottom: 10px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    
    .control-group input[type="range"] {
      width: 100%;
    }
    
    .control-group select {
      width: 100%;
      padding: 8px;
      background: #16213e;
      border: 1px solid #0f3460;
      color: #eee;
      border-radius: 4px;
    }
    
    .stats {
      margin-top: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .stats div {
      margin-bottom: 5px;
    }
    
    .stats .value {
      color: #e94560;
      font-weight: bold;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 20px 40px;
      border-radius: 8px;
      display: none;
    }
    
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }
    
    .pagination button {
      padding: 8px 16px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .pagination button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    .pagination span {
      min-width: 100px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <div class="control-panel">
        <h3>🎛️ 控制面板</h3>
        
        <div class="control-group">
          <label>节点大小：<span id="node-size-value">8</span></label>
          <input type="range" id="node-size" min="3" max="20" value="8">
        </div>
        
        <div class="control-group">
          <label>链接粗细：<span id="link-width-value">1</span></label>
          <input type="range" id="link-width" min="0.5" max="5" value="1" step="0.5">
        </div>
        
        <div class="control-group">
          <label>布局算法:</label>
          <select id="layout-algo">
            <option value="force">力导向布局</option>
            <option value="circular">圆形布局</option>
            <option value="hierarchical">层级布局</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>每页节点数:</label>
          <select id="page-size">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </div>
        
        <div class="pagination">
          <button id="prev-page" disabled>上一页</button>
          <span id="page-info">1 / 1</span>
          <button id="next-page" disabled>下一页</button>
        </div>
      </div>
      
      <div class="stats">
        <h3>📊 性能统计</h3>
        <div>总节点数：<span class="value" id="stat-nodes">0</span></div>
        <div>总边数：<span class="value" id="stat-links">0</span></div>
        <div>当前显示：<span class="value" id="stat-visible">0</span></div>
        <div>FPS: <span class="value" id="stat-fps">0</span></div>
        <div>渲染时间：<span class="value" id="stat-render-time">0</span>ms</div>
      </div>
    </div>
    
    <div id="graph-container">
      <svg id="graph-svg"></svg>
      <div id="loading">加载中...</div>
    </div>
  </div>

  <script>
// 图谱数据加载器
class GraphDataLoader {
  constructor() {
    this.fullData = { nodes: [], links: [] };
    this.currentPage = 0;
    this.pageSize = 100;
  }
  
  async loadFromJSON(url) {
    const response = await fetch(url);
    this.fullData = await response.json();
    return this.fullData;
  }
  
  loadFromObject(data) {
    this.fullData = data;
  }
  
  getPage(page) {
    const start = page * this.pageSize;
    const end = Math.min(start + this.pageSize, this.fullData.nodes.length);
    
    const pageNodes = this.fullData.nodes.slice(start, end);
    const nodeIds = new Set(pageNodes.map(n => n.id));
    const pageLinks = this.fullData.links.filter(l => 
      nodeIds.has(l.source) || nodeIds.has(l.target)
    );
    
    return {
      nodes: pageNodes,
      links: pageLinks,
      page: page,
      totalPages: Math.ceil(this.fullData.nodes.length / this.pageSize)
    };
  }
  
  getTotalPages() {
    return Math.ceil(this.fullData.nodes.length / this.pageSize);
  }
}

// 图谱渲染器 (D3.js + 虚拟优化)
class GraphRenderer {
  constructor(containerId) {
    this.container = d3.select(`#${containerId}`);
    this.width = this.container.node().clientWidth;
    this.width = this.container.node().clientWidth;
    this.height = this.container.node().clientHeight;
    
    this.svg = this.container.select('svg')
      .attr('width', this.width)
      .attr('height', this.height);
    
    this.simulation = null;
    this.nodes = [];
    this.links = [];
    
    // 性能统计
    this.fps = 0;
    this.lastFrameTime = performance.now();
    this.frameCount = 0;
    
    this.initZoom();
  }
  
  initZoom() {
    const zoom = d3.zoom()
      .scaleExtent([0.1, 4])
      .on('zoom', (event) => {
        this.g.attr('transform', event.transform);
      });
    
    this.svg.call(zoom);
    
    this.g = this.svg.append('g');
  }
  
  render(data, options = {}) {
    const startTime = performance.now();
    
    this.nodes = data.nodes;
    this.links = data.links;
    
    // 清空
    this.g.selectAll('*').remove();
    
    // 绘制链接
    const link = this.g.selectAll('.link')
      .data(this.links)
      .enter()
      .append('line')
      .attr('class', 'link')
      .attr('stroke', '#666')
      .attr('stroke-width', options.linkWidth || 1);
    
    // 绘制节点
    const node = this.g.selectAll('.node')
      .data(this.nodes)
      .enter()
      .append('g')
      .attr('class', 'node')
      .call(d3.drag()
        .on('start', (event, d) => this.dragStarted(event, d))
        .on('drag', (event, d) => this.dragged(event, d))
        .on('end', (event, d) => this.dragEnded(event, d))
      );
    
    // 节点圆圈
    node.append('circle')
      .attr('r', options.nodeSize || 8)
      .attr('fill', d => this.getNodeColor(d.type));
    
    // 节点标签
    node.append('text')
      .attr('class', 'node-label')
      .attr('dx', 12)
      .attr('dy', 4)
      .text(d => d.label || d.id);
    
    // 初始化力导向模拟
    this.initSimulation(options.layoutAlgo || 'force');
    
    const renderTime = performance.now() - startTime;
    this.updateStats(renderTime);
    
    // FPS 计数器
    this.startFPSCounter();
  }
  
  initSimulation(layoutAlgo) {
    if (this.simulation) {
      this.simulation.stop();
    }
    
    switch(layoutAlgo) {
      case 'circular':
        this.initCircularLayout();
        break;
      case 'hierarchical':
        this.initHierarchicalLayout();
        break;
      default:
        this.initForceLayout();
    }
  }
  
  initForceLayout() {
    this.simulation = d3.forceSimulation(this.nodes)
      .force('link', d3.forceLink(this.links).id(d => d.id).distance(100))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(this.width / 2, this.height / 2))
      .force('collide', d3.forceCollide().radius(20))
      .on('tick', () => this.tick());
  }
  
  initCircularLayout() {
    const radius = Math.min(this.width, this.height) / 3;
    const angleStep = (2 * Math.PI) / this.nodes.length;
    
    this.nodes.forEach((d, i) => {
      d.x = this.width / 2 + radius * Math.cos(i * angleStep);
      d.y = this.height / 2 + radius * Math.sin(i * angleStep);
    });
    
    this.simulation = d3.forceSimulation(this.nodes)
      .force('charge', d3.forceManyBody().strength(-100))
      .alpha(0.1)
      .on('tick', () => this.tick());
  }
  
  initHierarchicalLayout() {
    // 简单层级布局 (按类型分组)
    const types = [...new Set(this.nodes.map(d => d.type))];
    const typeHeight = this.height / (types.length + 1);
    
    this.nodes.forEach((d, i) => {
      const typeIndex = types.indexOf(d.type);
      d.x = (i % 20) * (this.width / 20);
      d.y = (typeIndex + 1) * typeHeight;
    });
    
    this.simulation = null;
    this.tick();
  }
  
  tick() {
    this.g.selectAll('.link')
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    
    this.g.selectAll('.node')
      .attr('transform', d => `translate(${d.x},${d.y})`);
  }
  
  getNodeColor(type) {
    const colors = {
      'paper': '#e94560',
      'author': '#0f3460',
      'concept': '#16213e',
      'institution': '#533483',
      'default': '#0f3460'
    };
    return colors[type] || colors.default;
  }
  
  dragStarted(event, d) {
    if (!event.active) this.simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  
  dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
    this.tick();
  }
  
  dragEnded(event, d) {
    if (!event.active) this.simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
  
  updateStats(renderTime) {
    document.getElementById('stat-nodes').textContent = this.nodes.length;
    document.getElementById('stat-links').textContent = this.links.length;
    document.getElementById('stat-visible').textContent = this.nodes.length;
    document.getElementById('stat-render-time').textContent = renderTime.toFixed(1);
  }
  
  startFPSCounter() {
    const countFrame = () => {
      this.frameCount++;
      const now = performance.now();
      const delta = now - this.lastFrameTime;
      
      if (delta >= 1000) {
        this.fps = Math.round((this.frameCount * 1000) / delta);
        document.getElementById('stat-fps').textContent = this.fps;
        this.frameCount = 0;
        this.lastFrameTime = now;
      }
      
      requestAnimationFrame(countFrame);
    };
    
    requestAnimationFrame(countFrame);
  }
  
  resize() {
    this.width = this.container.node().clientWidth;
    this.height = this.container.node().clientHeight;
    
    this.svg
      .attr('width', this.width)
      .attr('height', this.height);
    
    if (this.simulation) {
      this.simulation.force('center', d3.forceCenter(this.width / 2, this.height / 2));
      this.simulation.alpha(0.3).restart();
    }
  }
}

// 主应用
class GraphApp {
  constructor() {
    this.loader = new GraphDataLoader();
    this.renderer = new GraphRenderer('graph-svg');
    this.currentPage = 0;
    
    this.initControls();
    this.loadDemoData();
    
    window.addEventListener('resize', () => this.renderer.resize());
  }
  
  initControls() {
    // 节点大小
    document.getElementById('node-size').addEventListener('input', (e) => {
      document.getElementById('node-size-value').textContent = e.target.value;
      this.rerender();
    });
    
    // 链接粗细
    document.getElementById('link-width').addEventListener('input', (e) => {
      document.getElementById('link-width-value').textContent = e.target.value;
      this.rerender();
    });
    
    // 布局算法
    document.getElementById('layout-algo').addEventListener('change', (e) => {
      this.rerender(e.target.value);
    });
    
    // 每页节点数
    document.getElementById('page-size').addEventListener('change', (e) => {
      this.loader.pageSize = parseInt(e.target.value);
      this.currentPage = 0;
      this.loadPage(0);
    });
    
    // 分页
    document.getElementById('prev-page').addEventListener('click', () => {
      if (this.currentPage > 0) {
        this.loadPage(this.currentPage - 1);
      }
    });
    
    document.getElementById('next-page').addEventListener('click', () => {
      if (this.currentPage < this.loader.getTotalPages() - 1) {
        this.loadPage(this.currentPage + 1);
      }
    });
  }
  
  async loadDemoData() {
    // 生成测试数据
    const nodeCount = 1000;
    const linkCount = 3000;
    
    const types = ['paper', 'author', 'concept', 'institution'];
    const nodes = [];
    
    for (let i = 0; i < nodeCount; i++) {
      nodes.push({
        id: `node_${i}`,
        label: `Node ${i}`,
        type: types[i % types.length]
      });
    }
    
    const links = [];
    for (let i = 0; i < linkCount; i++) {
      const source = Math.floor(Math.random() * nodeCount);
      const target = Math.floor(Math.random() * nodeCount);
      if (source !== target) {
        links.push({ source: `node_${source}`, target: `node_${target}` });
      }
    }
    
    this.loader.loadFromObject({ nodes, links });
    this.loadPage(0);
    
    console.log(`✅ 加载 ${nodeCount} 节点，${linkCount} 边`);
  }
  
  loadPage(page) {
    this.currentPage = page;
    const pageData = this.loader.getPage(page);
    
    this.renderer.render(pageData, {
      nodeSize: parseInt(document.getElementById('node-size').value),
      linkWidth: parseFloat(document.getElementById('link-width').value),
      layoutAlgo: document.getElementById('layout-algo').value
    });
    
    // 更新分页信息
    document.getElementById('page-info').textContent = 
      `${page + 1} / ${this.loader.getTotalPages()}`;
    document.getElementById('prev-page').disabled = page === 0;
    document.getElementById('next-page').disabled = 
      page >= this.loader.getTotalPages() - 1;
  }
  
  rerender(layoutAlgo) {
    this.loadPage(this.currentPage);
  }
}

// 启动应用
const app = new GraphApp();
  </script>
</body>
</html>
