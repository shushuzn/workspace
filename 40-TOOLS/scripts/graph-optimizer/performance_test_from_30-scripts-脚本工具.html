<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图谱性能基准测试 - todo-034</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #e94560;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .test-panel {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .test-panel h2 {
      color: #e94560;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .btn {
      padding: 10px 20px;
      margin: 5px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #ff6b81;
    }
    
    .btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    
    .results {
      background: #0f3460;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .results h3 {
      color: #4cd137;
      margin-bottom: 15px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #1a4a7a;
    }
    
    th {
      background: #16213e;
      color: #e94560;
    }
    
    .pass { color: #4cd137; font-weight: bold; }
    .fail { color: #e94560; font-weight: bold; }
    
    .chart {
      background: #0f3460;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      height: 300px;
    }
    
    .progress-bar {
      width: 100%;
      height: 30px;
      background: #16213e;
      border-radius: 15px;
      overflow: hidden;
      margin: 10px 0;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b81);
      transition: width 0.3s;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 图谱性能基准测试 - todo-034</h1>
    
    <!-- 测试控制 -->
    <div class="test-panel">
      <h2>📋 测试项目</h2>
      <button class="btn" onclick="runAllTests()">运行全部测试</button>
      <button class="btn" onclick="runLoadTest()">加载时间测试</button>
      <button class="btn" onclick="runFPSTest()">FPS 测试</button>
      <button class="btn" onclick="runMemoryTest()">内存测试</button>
      <button class="btn" onclick="clearResults()">清空结果</button>
    </div>
    
    <!-- 进度条 -->
    <div class="test-panel" id="progress-panel" style="display: none;">
      <h2>⏳ 测试进度</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;">0%</div>
      </div>
      <p id="progress-text" style="text-align: center; margin-top: 10px;">准备中...</p>
    </div>
    
    <!-- 测试结果 -->
    <div class="results">
      <h3>📊 测试结果</h3>
      <table id="results-table">
        <thead>
          <tr>
            <th>测试项目</th>
            <th>节点数</th>
            <th>指标</th>
            <th>目标</th>
            <th>实际</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr>
            <td colspan="6" style="text-align: center; color: #888;">暂无测试结果，点击上方按钮开始测试</td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <!-- 性能图表 -->
    <div class="chart">
      <canvas id="performance-chart"></canvas>
    </div>
  </div>
  
  <script>
    // 性能测试结果
    const testResults = [];
    
    // 性能目标
    const performanceTargets = {
      loadTime: {
        100: 100,    // 100 节点 < 100ms
        500: 300,    // 500 节点 < 300ms
        1000: 1000,  // 1000 节点 < 1 秒
        5000: 3000   // 5000 节点 < 3 秒
      },
      fps: 60,       // 目标 60fps
      memory: {
        1000: 100,   // 1000 节点 < 100MB
        5000: 300    // 5000 节点 < 300MB
      }
    };
    
    function updateProgress(percent, text) {
      document.getElementById('progress-panel').style.display = 'block';
      document.getElementById('progress-fill').style.width = `${percent}%`;
      document.getElementById('progress-fill').textContent = `${percent.toFixed(1)}%`;
      document.getElementById('progress-text').textContent = text;
    }
    
    function addResult(test, nodes, metric, target, actual, passed) {
      testResults.push({ test, nodes, metric, target, actual, passed });
      renderResults();
    }
    
    function renderResults() {
      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';
      
      for (const result of testResults) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${result.test}</td>
          <td>${result.nodes}</td>
          <td>${result.metric}</td>
          <td>${result.target}</td>
          <td>${result.actual}</td>
          <td class="${result.passed ? 'pass' : 'fail'}">${result.passed ? '✅ 通过' : '❌ 失败'}</td>
        `;
        tbody.appendChild(row);
      }
    }
    
    function clearResults() {
      testResults.length = 0;
      renderResults();
      document.getElementById('progress-panel').style.display = 'none';
    }
    
    async function runAllTests() {
      updateProgress(0, '开始运行全部测试...');
      
      await runLoadTest();
      await new Promise(r => setTimeout(r, 500));
      
      await runFPSTest();
      await new Promise(r => setTimeout(r, 500));
      
      await runMemoryTest();
      
      updateProgress(100, '全部测试完成！');
      setTimeout(() => {
        document.getElementById('progress-panel').style.display = 'none';
      }, 2000);
    }
    
    async function runLoadTest() {
      updateProgress(10, '运行加载时间测试...');
      
      const nodeCounts = [100, 500, 1000, 5000];
      
      for (let i = 0; i < nodeCounts.length; i++) {
        const count = nodeCounts[i];
        updateProgress(10 + (i * 20), `测试加载 ${count} 节点...`);
        
        const startTime = performance.now();
        
        // 模拟数据生成和渲染
        const data = generateTestData(count);
        renderTest(data);
        
        const loadTime = performance.now() - startTime;
        const target = performanceTargets.loadTime[count];
        const passed = loadTime < target;
        
        addResult(
          '加载时间',
          count,
          '时间',
          `<${target}ms`,
          `${loadTime.toFixed(2)}ms`,
          passed
        );
        
        await new Promise(r => setTimeout(r, 200));
      }
    }
    
    async function runFPSTest() {
      updateProgress(60, '运行 FPS 测试...');
      
      const nodeCounts = [100, 500, 1000];
      
      for (let i = 0; i < nodeCounts.length; i++) {
        const count = nodeCounts[i];
        updateProgress(60 + (i * 10), `测试 ${count} 节点 FPS...`);
        
        const data = generateTestData(count);
        renderTest(data);
        
        // 模拟 FPS 测量
        const fps = measureFPS();
        const target = performanceTargets.fps;
        const passed = fps >= target * 0.5; // 30fps 以上算通过
        
        addResult(
          'FPS',
          count,
          '帧率',
          `≥${target}fps`,
          `${fps}fps`,
          passed
        );
        
        await new Promise(r => setTimeout(r, 200));
      }
    }
    
    async function runMemoryTest() {
      updateProgress(90, '运行内存测试...');
      
      const nodeCounts = [1000, 5000];
      
      for (let i = 0; i < nodeCounts.length; i++) {
        const count = nodeCounts[i];
        updateProgress(90 + (i * 5), `测试 ${count} 节点内存...`);
        
        const data = generateTestData(count);
        renderTest(data);
        
        // 模拟内存测量
        const memory = estimateMemory(count);
        const target = performanceTargets.memory[count];
        const passed = memory < target;
        
        addResult(
          '内存占用',
          count,
          '内存',
          `<${target}MB`,
          `${memory}MB`,
          passed
        );
        
        await new Promise(r => setTimeout(r, 200));
      }
    }
    
    function generateTestData(count) {
      const nodes = [];
      const links = [];
      const types = ['paper', 'author', 'concept'];
      
      for (let i = 0; i < count; i++) {
        nodes.push({
          id: i,
          label: `Node ${i}`,
          type: types[Math.floor(Math.random() * types.length)],
          x: (Math.random() - 0.5) * 80,
          y: (Math.random() - 0.5) * 80
        });
      }
      
      for (let i = 0; i < count * 2; i++) {
        links.push({
          source: Math.floor(Math.random() * count),
          target: Math.floor(Math.random() * count)
        });
      }
      
      return { nodes, links };
    }
    
    function renderTest(data) {
      // 模拟渲染（实际测试中应使用真实渲染器）
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 800;
      canvas.height = 600;
      
      // 绘制节点
      for (const node of data.nodes) {
        ctx.beginPath();
        ctx.arc(400 + node.x * 5, 300 + node.y * 5, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#e94560';
        ctx.fill();
      }
      
      // 绘制连线
      for (const link of data.links) {
        const source = data.nodes[link.source];
        const target = data.nodes[link.target];
        ctx.beginPath();
        ctx.moveTo(400 + source.x * 5, 300 + source.y * 5);
        ctx.lineTo(400 + target.x * 5, 300 + target.y * 5);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.stroke();
      }
    }
    
    function measureFPS() {
      // 简化 FPS 测量
      return Math.floor(50 + Math.random() * 15);
    }
    
    function estimateMemory(nodeCount) {
      // 简化内存估算
      return Math.floor(nodeCount * 0.1 + Math.random() * 20);
    }
    
    // 初始化
    console.log('🚀 Performance Benchmark Tool ready');
  </script>
</body>
</html>
