version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ../../40-arxiv:/workspace/40-arxiv
      - ../../41-medium:/workspace/41-medium
      - ../../21-reports:/workspace/21-reports
    environment:
      - PYTHONUNBUFFERED=1
      - WORKSPACE=/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

