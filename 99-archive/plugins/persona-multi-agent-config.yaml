# 7 人格多子代理配置文件

**创建日期:** 2026-03-13 16:08  
**架构:** 多子代理协同 (真正多 AI)

---

## 🎭 子代理配置

```yaml
persona-system:
  version: 1.0
  architecture: multi-agent
  
  agents:
    executor:
      name: 执行者
      role: 完成任务、产出成果
      model: qwen3.5-plus
      weight: 1.0
      priority: 1
      description: 负责具体任务执行，生成文件/代码/分析
      
    critic:
      name: 批判者
      role: 审查质量、发现问题
      model: qwen3.5-plus
      weight: 1.2
      priority: 2
      description: 负责审查执行者输出，给出评分和改进建议
      
    planner:
      name: 规划者
      role: 制定计划、分配资源
      model: qwen3.5-plus
      weight: 1.0
      priority: 3
      description: 负责任务规划，优先级排序
      
    learner:
      name: 学习者
      role: 从经验学习、更新记忆
      model: qwen3.5-plus
      weight: 1.0
      priority: 4
      description: 负责总结经验，更新 MEMORY
      
    coordinator:
      name: 协调者
      role: 平衡决策、强制休息
      model: qwen3.5-plus
      weight: 1.5
      priority: 5
      description: 负责健康监控，冲突初步仲裁
      
    innovator:
      name: 创新者
      role: 突破常规、创造性思维
      model: qwen3.5-plus
      weight: 1.0
      priority: 6
      description: 负责提出创新方案，优化建议
      
    metacognitive:
      name: 元认知
      role: 监控系统、人格健康、元进化
      model: qwen3.5-plus
      weight: 2.0
      priority: 7
      description: 负责最终仲裁，系统进化决策

  # 投票机制
  voting:
    enabled: true
    threshold: 0.6  # 60% 同意通过
    weighted: true  # 加权投票
    
  # 仲裁机制
  arbitration:
    enabled: true
    final_arbiter: metacognitive  # 元认知最终仲裁
    
  # 通信机制
  communication:
    type: message_queue
    backend: redis  # 或 rabbitmq
    timeout: 30s  # 子代理响应超时
    
  # 执行流程
  workflow:
    - planner: 制定计划
    - executor: 执行任务
    - critic: 审查输出
    - if critic_score < 85:
        - executor: 修复
        - goto: critic
    - learner: 总结经验
    - coordinator: 健康检查
    - innovator: 优化建议
    - metacognitive: 最终仲裁
```

---

## 📊 决策流程

```
用户消息
    ↓
planner (规划者)
    ↓
executor (执行者)
    ↓
critic (批判者) → 评分 <85? → executor 修复
    ↓
learner (学习者)
    ↓
coordinator (协调者)
    ↓
innovator (创新者)
    ↓
metacognitive (元认知 - 最终仲裁)
    ↓
输出
```

