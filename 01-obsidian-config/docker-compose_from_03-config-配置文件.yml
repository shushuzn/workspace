version: '3.8'

services:
  # API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MP_API_KEY=${MP_API_KEY}
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=materials_db
    depends_on:
      - mongodb
    networks:
      - materials-network
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - materials-network

  # Web 界面 (Nginx)
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
    networks:
      - materials-network

  # Redis (缓存)
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    networks:
      - materials-network

volumes:
  mongodb_data:

networks:
  materials-network:
    driver: bridge
