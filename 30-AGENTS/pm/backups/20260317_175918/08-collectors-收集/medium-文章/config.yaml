# Medium Watcher 配置文件

# 按标签订阅
tags:
  - "artificial-intelligence"
  - "machine-learning"
  - "llm"
  - "agentic-ai"
  - "mcp"
  - "software-architecture"
  - "ai-engineering"
  - "generative-ai"

# 按作者订阅
authors:
  - "Andrej Karpathy"
  - "Simon Willison"
  - "Sebastian Raschka"
  - "Jay Alammar"

# 按出版物订阅
publications:
  - "Towards Data Science"
  - "Better Programming"
  - "The Startup"
  - "Level Up Coding"
  - "Artificial Intelligence in Practice"

# 质量评分阈值
min_score: 3.0

# 输出配置
output:
  dir: Medium/Raw
  format: markdown  # markdown, html, both
  archive_after_days: 30  # 30 天后归档

# 内容提取
extraction:
  extract_full_content: true
  extract_images: true
  extract_code: true

# 定时任务
schedule:
  enabled: true
  time: "08:00"  # 每天早上 8 点执行
  timezone: "Asia/Shanghai"
