<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 知识图谱 - 导出工具</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
        .container{max-width:1400px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        h1{font-size:24px;color:#333;margin-bottom:20px;border-bottom:3px solid #667eea;padding-bottom:10px}
        .intro{font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
        .control-panel{background:#f5f5f5;padding:20px;border-radius:8px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax:200px,1fr);gap:15px}
        .control-group{display:flex;flex-direction:column}
        .control-group label{font-size:13px;margin-bottom:5px;color:#555}
        .control-group input[type="range"],.control-group select,.control-group input[type="text"]{padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
        .control-group input[type="color"]{width:100%;height:40px;border:none;cursor:pointer}
        .control-group input[type="checkbox"]{margin-right:8px}
        button{background:#667eea;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;margin-right:10px;margin-bottom:10px;transition:background 0.3s}
        button:hover{background:#5568d3}button:disabled{background:#ccc;cursor:not-allowed}
        .preview-container{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
        .preview-panel{background:white;border:1px solid #e0e0e0;border-radius:8px;padding:15px}
        .preview-panel h3{font-size:15px;margin-bottom:10px;color:#333}
        #graphPreview{width:100%;height:500px;background:#fafafa;border-radius:4px;overflow:hidden}
        #exportPreview{width:100%;height:500px;background:#fafafa;border-radius:4px;overflow:hidden}
        .status{padding:10px;background:#e3f2fd;border-radius:6px;margin-bottom:15px;font-size:13px;color:#1565c0;display:none}
        .export-options{background:#fff3e0;padding:15px;border-radius:6px;margin-bottom:20px}
        .export-options h3{font-size:14px;margin-bottom:10px;color:#e65100}
        .checkbox-group{display:flex;flex-wrap:wrap;gap:15px}
        .checkbox-group label{display:flex;align-items:center;font-size:13px;color:#555;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ LIG 知识图谱 - 导出工具</h1>
        <p class="intro">将知识图谱导出为高分辨率 PNG 或 SVG 格式，支持自定义样式和分辨率。</p>
        
        <div class="status" id="status"></div>
        
        <div class="control-panel">
            <div class="control-group">
                <label>导出格式</label>
                <select id="exportFormat">
                    <option value="png">PNG (位图)</option>
                    <option value="svg">SVG (矢量图)</option>
                </select>
            </div>
            <div class="control-group">
                <label>分辨率</label>
                <select id="resolution">
                    <option value="1">1x (原始)</option>
                    <option value="2" selected>2x (高清)</option>
                    <option value="3">3x (超高清)</option>
                    <option value="4">4x (极致)</option>
                </select>
            </div>
            <div class="control-group">
                <label>背景</label>
                <select id="background">
                    <option value="white">白色</option>
                    <option value="transparent">透明</option>
                    <option value="gradient">渐变</option>
                </select>
            </div>
            <div class="control-group">
                <label>文件名</label>
                <input type="text" id="filename" value="LIG-Knowledge-Graph" placeholder="文件名">
            </div>
            <div class="control-group">
                <label>宽度 (px)</label>
                <input type="range" id="width" min="800" max="3200" step="100" value="1600">
                <span id="widthDisplay">1600</span>
            </div>
            <div class="control-group">
                <label>包含图例</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="includeLegend" checked> 显示图例</label>
                    <label><input type="checkbox" id="includeTitle" checked> 显示标题</label>
                    <label><input type="checkbox" id="includeStats" checked> 显示统计</label>
                </div>
            </div>
        </div>
        
        <div class="export-options">
            <h3>📤 导出选项</h3>
            <button onclick="exportGraph()" id="exportBtn">🖼️ 导出图谱</button>
            <button onclick="loadSampleGraph()" id="loadBtn">📊 加载示例图谱</button>
            <button onclick="clearPreview()" id="clearBtn">🗑️ 清除预览</button>
        </div>
        
        <div class="preview-container">
            <div class="preview-panel">
                <h3>📊 图谱预览</h3>
                <svg id="graphPreview"></svg>
            </div>
            <div class="preview-panel">
                <h3>🖼️ 导出预览</h3>
                <svg id="exportPreview"></svg>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // 示例数据
        const sampleData = {
            nodes: [
                {id:"LIG",type:"Material",label:"LIG",size:40,x:0,y:0},
                {id:"PI",type:"Material",label:"PI",size:20,x:-100,y:-80},
                {id:"PDMS",type:"Material",label:"PDMS",size:20,x:-100,y:0},
                {id:"CuO",type:"Material",label:"CuO",size:22,x:-100,y:80},
                {id:"Gas_Sensor",type:"Device",label:"气体传感器",size:25,x:100,y:-80},
                {id:"Neural_Probe",type:"Device",label:"神经探针",size:25,x:100,y:0},
                {id:"Tumor_Patch",type:"Device",label:"肿瘤贴片",size:25,x:100,y:80},
                {id:"Cu2+",type:"Signal",label:"Cu²⁺",size:20,x:200,y:-50},
                {id:"ROS",type:"Signal",label:"ROS",size:20,x:200,y:50},
                {id:"Health",type:"Application",label:"健康监控",size:24,x:300,y:0}
            ],
            links: [
                {source:"PI",target:"LIG",value:3},
                {source:"PDMS",target:"LIG",value:2},
                {source:"CuO",target:"LIG",value:2},
                {source:"LIG",target:"Gas_Sensor",value:3},
                {source:"LIG",target:"Neural_Probe",value:3},
                {source:"LIG",target:"Tumor_Patch",value:3},
                {source:"CuO",target:"Cu2+",value:2},
                {source:"Cu2+",target:"ROS",value:2},
                {source:"Tumor_Patch",target:"Health",value:2}
            ]
        };
        
        const colorMap = {
            "Material":"#FF6B6B",
            "Device":"#4ECDC4",
            "Signal":"#45B7D1",
            "Technology":"#FFA07A",
            "Application":"#98D8C8",
            "Challenge":"#F7DC6F",
            "Pathway":"#BB8FCE"
        };
        
        let graphSvg = null;
        
        function loadSampleGraph() {
            const svg = d3.select("#graphPreview");
            svg.selectAll("*").remove();
            
            const width = svg.node().clientWidth;
            const height = svg.node().clientHeight;
            
            // 创建力导向图
            const simulation = d3.forceSimulation(sampleData.nodes)
                .force("link", d3.forceLink(sampleData.links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-500))
                .force("center", d3.forceCenter(width/2, height/2))
                .force("collide", d3.forceCollide().radius(d => d.size + 10));
            
            // 绘制连线
            const links = svg.append("g")
                .selectAll("line")
                .data(sampleData.links)
                .enter().append("line")
                .attr("stroke", "#999")
                .attr("stroke-width", d => Math.sqrt(d.value) * 2)
                .attr("stroke-opacity", 0.6);
            
            // 绘制节点
            const nodes = svg.append("g")
                .selectAll("circle")
                .data(sampleData.nodes)
                .enter().append("circle")
                .attr("r", d => d.size)
                .attr("fill", d => colorMap[d.type] || "#999")
                .attr("stroke", "#fff")
                .attr("stroke-width", 2)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));
            
            // 添加标签
            const labels = svg.append("g")
                .selectAll("text")
                .data(sampleData.nodes)
                .enter().append("text")
                .attr("dy", d => d.size + 15)
                .attr("text-anchor", "middle")
                .attr("fill", "#333")
                .attr("font-size", "12px")
                .text(d => d.label);
            
            simulation.on("tick", () => {
                links
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                
                nodes
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);
                
                labels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });
            
            graphSvg = svg.node();
            showStatus('✅ 示例图谱已加载');
        }
        
        function dragstarted(event, d) {
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            d.fx = null;
            d.fy = null;
        }
        
        function exportGraph() {
            if (!graphSvg) {
                showStatus('❌ 请先加载图谱!');
                return;
            }
            
            const format = document.getElementById('exportFormat').value;
            const resolution = parseInt(document.getElementById('resolution').value);
            const bgType = document.getElementById('background').value;
            const filename = document.getElementById('filename').value || 'LIG-Knowledge-Graph';
            const includeLegend = document.getElementById('includeLegend').checked;
            const includeTitle = document.getElementById('includeTitle').checked;
            const includeStats = document.getElementById('includeStats').checked;
            
            showStatus('🔄 正在生成导出文件...');
            
            // 创建导出 SVG
            const exportSvg = document.getElementById('exportPreview');
            exportSvg.innerHTML = '';
            
            const width = parseInt(document.getElementById('width').value);
            const height = Math.round(width * 0.75);
            
            exportSvg.setAttribute('width', width * resolution);
            exportSvg.setAttribute('height', height * resolution);
            exportSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            
            // 背景
            if (bgType === 'white') {
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', '#ffffff');
                exportSvg.insertBefore(bg, exportSvg.firstChild);
            } else if (bgType === 'gradient') {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradient.setAttribute('id', 'bgGradient');
                gradient.setAttribute('x1', '0%');
                gradient.setAttribute('y1', '0%');
                gradient.setAttribute('x2', '100%');
                gradient.setAttribute('y2', '100%');
                
                const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop1.setAttribute('offset', '0%');
                stop1.setAttribute('stop-color', '#667eea');
                const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop2.setAttribute('offset', '100%');
                stop2.setAttribute('stop-color', '#764ba2');
                
                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                defs.appendChild(gradient);
                exportSvg.appendChild(defs);
                
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                bg.setAttribute('width', '100%');
                bg.setAttribute('height', '100%');
                bg.setAttribute('fill', 'url(#bgGradient)');
                exportSvg.insertBefore(bg, exportSvg.firstChild);
            }
            
            // 复制图谱内容
            const graphContent = graphSvg.innerHTML;
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', `translate(50, 50)`);
            g.innerHTML = graphContent;
            exportSvg.appendChild(g);
            
            // 添加标题
            if (includeTitle) {
                const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                title.setAttribute('x', width / 2);
                title.setAttribute('y', 40);
                title.setAttribute('text-anchor', 'middle');
                title.setAttribute('fill', bgType === 'gradient' ? '#ffffff' : '#333333');
                title.setAttribute('font-size', '24');
                title.setAttribute('font-weight', 'bold');
                title.textContent = 'LIG 知识图谱';
                exportSvg.appendChild(title);
            }
            
            // 添加图例
            if (includeLegend) {
                const legendY = height - 120;
                const legendX = 50;
                
                Object.entries(colorMap).forEach(([type, color], i) => {
                    const y = legendY + i * 25;
                    
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', legendX);
                    rect.setAttribute('y', y);
                    rect.setAttribute('width', 16);
                    rect.setAttribute('height', 16);
                    rect.setAttribute('fill', color);
                    rect.setAttribute('rx', 8);
                    exportSvg.appendChild(rect);
                    
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', legendX + 22);
                    text.setAttribute('y', y + 13);
                    text.setAttribute('fill', bgType === 'gradient' ? '#ffffff' : '#333333');
                    text.setAttribute('font-size', '12');
                    text.textContent = type;
                    exportSvg.appendChild(text);
                });
            }
            
            // 添加统计
            if (includeStats) {
                const statsY = height - 40;
                const statsX = width - 200;
                
                const stats = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                stats.setAttribute('x', statsX);
                stats.setAttribute('y', statsY);
                stats.setAttribute('text-anchor', 'end');
                stats.setAttribute('fill', bgType === 'gradient' ? '#ffffff' : '#666666');
                stats.setAttribute('font-size', '12');
                stats.textContent = `${sampleData.nodes.length} 节点 · ${sampleData.links.length} 关系`;
                exportSvg.appendChild(stats);
            }
            
            showStatus('🔄 正在下载文件...');
            
            // 延迟一下让用户看到预览
            setTimeout(() => {
                if (format === 'svg') {
                    downloadSVG(exportSvg, `${filename}.svg`);
                } else {
                    downloadPNG(exportSvg, `${filename}.png`, resolution);
                }
                showStatus('✅ 导出完成!');
            }, 500);
        }
        
        function downloadSVG(svgElement, filename) {
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function downloadPNG(svgElement, filename, resolution) {
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const width = parseInt(svgElement.getAttribute('width'));
            const height = parseInt(svgElement.getAttribute('height'));
            
            canvas.width = width;
            canvas.height = height;
            
            const img = new Image();
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);
                
                canvas.toBlob(function(blob) {
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(downloadUrl);
                }, 'image/png');
            };
            
            img.src = url;
        }
        
        function clearPreview() {
            document.getElementById('graphPreview').innerHTML = '';
            document.getElementById('exportPreview').innerHTML = '';
            graphSvg = null;
            showStatus('🗑️ 已清除预览');
        }
        
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        // 更新宽度显示
        document.getElementById('width').addEventListener('input', function() {
            document.getElementById('widthDisplay').textContent = this.value;
        });
        
        // 自动加载示例
        window.addEventListener('load', () => {
            setTimeout(loadSampleGraph, 500);
        });
    </script>
</body>
</html>
