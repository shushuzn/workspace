# API 服务配置
api_service:
  # 服务器配置
  server:
    host: "0.0.0.0"
    port: 5000
    debug: false
  
  # API 版本
  version: "1.0"
  
  # 端点配置
  endpoints:
    /api/v1/health:
      methods: [GET]
      description: "Health check"
    /api/v1/papers:
      methods: [GET]
      description: "Get papers data"
      params:
        - name: date
          type: string
          required: false
    /api/v1/trends:
      methods: [GET]
      description: "Get trends data"
      params:
        - name: date
          type: string
          required: false
    /api/v1/clusters:
      methods: [GET]
      description: "Get clusters data"
      params:
        - name: date
          type: string
          required: false
    /api/v1/graph:
      methods: [GET]
      description: "Get knowledge graph"
    /api/v1/metrics:
      methods: [GET]
      description: "Get monitoring metrics"
    /api/v1/alerts:
      methods: [GET]
      description: "Get alerts"
  
  # 安全配置
  security:
    enabled: false
    api_key_required: false
    rate_limiting:
      enabled: false
      requests_per_minute: 60
  
  # CORS 配置
  cors:
    enabled: false
    allowed_origins:
      - "http://localhost:3000"
  
  # 日志配置
  logging:
    level: INFO
    file: logs/api-gateway.log
    max_size: 10MB
    backup_count: 7
