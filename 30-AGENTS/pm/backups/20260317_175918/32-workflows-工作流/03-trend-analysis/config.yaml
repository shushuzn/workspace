# 趋势分析配置 (Level 3)
analysis:
  # 输入来自 Level 2
  input_from_level2: true
  
  # 关键词文件
  keywords_file: keywords.txt
  
  # 热门主题数量
  hot_topics_count: 10
  
  # 新兴领域阈值
  emerging_threshold: 5
  
  # 输出配置
  output:
    format: json
    file: outputs/trends.json
    include_markdown: true
    markdown_file: outputs/hot-topics.md
  
  # 日志配置
  logging:
    level: INFO
    file: logs/analysis.log
    max_size: 10MB
    backup_count: 7
