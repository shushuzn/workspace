# PDF Extractor 配置文件

# 输入配置
input:
  dirs:
    - Arxiv/papers
    - AI-Research/02-Models/_assets
  pattern: "*.pdf"
  recursive: true

# 输出配置
output:
  dir: Medium/Raw
  format: markdown  # markdown, json, both
  include_figures: true
  figures_dir: figures
  extract_formulas: true
  formula_format: latex  # latex, unicode

# 解析配置
parsing:
  multi_column: true  # 多栏布局处理
  extract_references: true  # 提取参考文献
  extract_tables: true  # 提取表格
  extract_figures: true  # 提取图表标题
  ocr_fallback: false  # OCR 兜底 (需要 Tesseract)

# 公式提取
formulas:
  inline: true  # 行内公式 $...$
  block: true  # 块级公式 $$...$$
  convert_to_latex: true

# 图表处理
figures:
  extract_captions: true
  save_images: false  # 保存图表图片
  image_format: png

# 参考文献处理
references:
  extract: true
  link_to_arxiv: true  # 尝试链接 arXiv
  link_to_doi: true  # 尝试链接 DOI
  output_format: bibtex  # bibtex, markdown

# 性能配置
performance:
  max_pages: 50  # 最大处理页数 (0=全部)
  parallel: true  # 并行处理
  max_workers: 4  # 最大工作线程

# 缓存配置
cache:
  enabled: true
  dir: .cache/pdf-extractor
  ttl_days: 30

# 与 AI Research OS 集成
ai_research_os:
  auto_trigger: true  # 解析后自动触发 ai-research-os
  pass_extracted_text: true  # 传递提取的文本给 AI
