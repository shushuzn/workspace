# arXiv Daily 配置文件

# 监听类别
categories:
  - cs.AI        # 人工智能
  - cs.LG        # 机器学习
  - cs.CL        # 计算语言学
  - cs.NE        # 神经网络
  - cs.AR        # 多智能体系统
  - cs.SE        # 软件工程 (MCP/工具)

# 关键词过滤
keywords:
  include:
    - "agent"
    - "reasoning"
    - "efficient"
    - "adaptive"
    - "routing"
    - "planning"
    - "MCP"
    - "tool use"
    - "autonomous"
    - "cognitive"
  exclude:
    - "survey"
    - "review"
    - "benchmark"

# 优先级评分阈值
min_score: 3.0

# 输出配置
output:
  dir: Arxiv/collected
  format: json  # json, markdown, both

# 定时任务
schedule:
  enabled: true
  time: "02:00"  # 每天凌晨 2 点执行
  timezone: "Asia/Shanghai"
