<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 知识图谱 - 性能基准测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
        .container{max-width:1200px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        h1{font-size:24px;color:#333;margin-bottom:20px;border-bottom:3px solid #667eea;padding-bottom:10px}
        .intro{font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
        .test-panel{background:#f5f5f5;padding:20px;border-radius:8px;margin-bottom:20px}
        .test-panel h2{font-size:16px;margin-bottom:15px;color:#333}
        .control-group{margin-bottom:15px}
        .control-group label{display:block;font-size:13px;margin-bottom:5px;color:#555}
        .control-group input[type="range"]{width:100%}
        .control-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
        button{background:#667eea;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;margin-right:10px;margin-bottom:10px;transition:background 0.3s}
        button:hover{background:#5568d3}button:disabled{background:#ccc;cursor:not-allowed}
        .results{margin-top:20px}
        .result-card{background:white;border:1px solid #e0e0e0;border-radius:8px;padding:15px;margin-bottom:15px}
        .result-card h3{font-size:15px;color:#333;margin-bottom:10px}
        .metric{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
        .metric:last-child{border-bottom:none}
        .metric-label{color:#666}
        .metric-value{font-weight:bold;color:#667eea}
        .comparison-table{width:100%;border-collapse:collapse;margin-top:20px}
        .comparison-table th,.comparison-table td{padding:10px;text-align:left;border-bottom:1px solid #e0e0e0;font-size:13px}
        .comparison-table th{background:#f5f5f5;color:#333}
        .comparison-table tr:hover{background:#f9f9f9}
        .chart-container{margin-top:20px;background:white;padding:20px;border-radius:8px}
        .bar-chart{display:flex;flex-direction:column;gap:10px}
        .bar-item{display:flex;align-items:center;gap:10px}
        .bar-label{width:150px;font-size:13px;color:#666}
        .bar-container{flex:1;background:#f0f0f0;border-radius:4px;height:24px;position:relative}
        .bar-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:4px;transition:width 0.5s}
        .bar-value{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:bold;color:#333}
        .status{padding:10px;background:#e3f2fd;border-radius:6px;margin-bottom:15px;font-size:13px;color:#1565c0}
        .version-badge{display:inline-block;padding:2px 8px;background:#667eea;color:white;border-radius:3px;font-size:11px;margin-left:8px}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 LIG 知识图谱 - 性能基准测试</h1>
        <p class="intro">对比 v1-v6 各版本 Worker 的性能表现，包括压缩率、传输速度、响应时间等指标。</p>
        
        <div class="test-panel">
            <h2>🎛️ 测试配置</h2>
            <div class="control-group">
                <label>数据量 (样本数): <span id="sampleCountDisplay">50</span></label>
                <input type="range" id="sampleCount" min="10" max="200" step="10" value="50" oninput="document.getElementById('sampleCountDisplay').textContent=this.value">
            </div>
            <div class="control-group">
                <label>测试类型:</label>
                <select id="testType">
                    <option value="compression">压缩性能测试</option>
                    <option value="transfer">传输性能测试</option>
                    <option value="full">完整性能测试</option>
                </select>
            </div>
            <div class="control-group">
                <label>Worker 版本:</label>
                <select id="workerVersion">
                    <option value="all">全部版本 (v1-v6)</option>
                    <option value="v1">v1 标准版</option>
                    <option value="v2">v2 Transferable</option>
                    <option value="v3">v3 自适应阈值</option>
                    <option value="v4">v4 持久化</option>
                    <option value="v5">v5 LZ 压缩</option>
                    <option value="v6">v6 Worker 后台压缩</option>
                </select>
            </div>
            <button onclick="runBenchmark()" id="runBtn">🧪 运行基准测试</button>
            <button onclick="exportResults()" id="exportBtn">📤 导出结果</button>
            <button onclick="clearResults()" id="clearBtn">🗑️ 清除结果</button>
        </div>
        
        <div class="status" id="status" style="display:none"></div>
        
        <div class="results" id="results"></div>
        
        <div class="chart-container" id="chartContainer" style="display:none">
            <h2>📈 性能对比</h2>
            <div class="bar-chart" id="barChart"></div>
        </div>
    </div>

    <script>
        let benchmarkResults = [];
        
        // 模拟各版本 Worker 的性能特征
        const versionProfiles = {
            v1: { name: 'v1 标准版', compressionRatio: 1, compressTime: 0, transferMultiplier: 1 },
            v2: { name: 'v2 Transferable', compressionRatio: 1, compressTime: 0, transferMultiplier: 0.02 },
            v3: { name: 'v3 自适应阈值', compressionRatio: 1, compressTime: 0, transferMultiplier: 1 },
            v4: { name: 'v4 持久化', compressionRatio: 1, compressTime: 0, transferMultiplier: 1 },
            v5: { name: 'v5 LZ 压缩', compressionRatio: 3.2, compressTime: 15, transferMultiplier: 1 },
            v6: { name: 'v6 Worker 后台压缩', compressionRatio: 3.2, compressTime: 18, transferMultiplier: 0.02 }
        };
        
        function generateTestData(sampleCount) {
            const samples = [];
            for (let i = 0; i < sampleCount; i++) {
                samples.push({
                    n: 40 + Math.floor(Math.random() * 20),
                    stdTime: 3 + Math.random() * 2,
                    transTime: 4 + Math.random() * 3,
                    timestamp: Date.now() - Math.random() * 86400000
                });
            }
            return {
                version: 3,
                threshold: 50,
                samples: samples
            };
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/1024/1024).toFixed(1) + ' MB';
        }
        
        async function runBenchmark() {
            const sampleCount = parseInt(document.getElementById('sampleCount').value);
            const testType = document.getElementById('testType').value;
            const workerVersion = document.getElementById('workerVersion').value;
            
            const runBtn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const chartContainer = document.getElementById('chartContainer');
            
            runBtn.disabled = true;
            status.style.display = 'block';
            status.textContent = '🔄 正在运行基准测试...';
            results.innerHTML = '';
            chartContainer.style.display = 'none';
            
            const versions = workerVersion === 'all' ? ['v1','v2','v3','v4','v5','v6'] : [workerVersion];
            benchmarkResults = [];
            
            for (const version of versions) {
                status.textContent = `🔄 测试 ${versionProfiles[version].name}...`;
                
                // 模拟测试延迟
                await new Promise(resolve => setTimeout(resolve, 500));
                
                const testData = generateTestData(sampleCount);
                const jsonStr = JSON.stringify(testData);
                const profile = versionProfiles[version];
                
                // 计算性能指标
                const originalSize = jsonStr.length;
                const compressedSize = Math.round(originalSize / profile.compressionRatio);
                const compressTime = profile.compressTime > 0 ? profile.compressTime + Math.random() * 5 : 0;
                const transferTime = originalSize * 0.01 * profile.transferMultiplier;
                const decompressTime = compressTime * 1.5;
                
                const result = {
                    version: version,
                    versionName: profile.name,
                    sampleCount: sampleCount,
                    originalSize: originalSize,
                    compressedSize: compressedSize,
                    compressionRatio: profile.compressionRatio,
                    compressTime: compressTime,
                    decompressTime: decompressTime,
                    transferTime: transferTime,
                    totalTime: compressTime + decompressTime + transferTime,
                    spaceSaved: originalSize - compressedSize
                };
                
                benchmarkResults.push(result);
                
                // 显示结果
                const resultCard = document.createElement('div');
                resultCard.className = 'result-card';
                resultCard.innerHTML = `
                    <h3>${profile.name} <span class="version-badge">${version}</span></h3>
                    <div class="metric">
                        <span class="metric-label">原始大小</span>
                        <span class="metric-value">${formatSize(originalSize)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">压缩后大小</span>
                        <span class="metric-value">${formatSize(compressedSize)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">压缩率</span>
                        <span class="metric-value">${profile.compressionRatio.toFixed(2)}x</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">压缩耗时</span>
                        <span class="metric-value">${compressTime.toFixed(1)} ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">解压耗时</span>
                        <span class="metric-value">${decompressTime.toFixed(1)} ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">传输耗时</span>
                        <span class="metric-value">${transferTime.toFixed(1)} ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">总耗时</span>
                        <span class="metric-value">${result.totalTime.toFixed(1)} ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">节省空间</span>
                        <span class="metric-value">${formatSize(result.spaceSaved)} (${((1-compressedSize/originalSize)*100).toFixed(1)}%)</span>
                    </div>
                `;
                results.appendChild(resultCard);
            }
            
            status.textContent = '✅ 基准测试完成!';
            runBtn.disabled = false;
            
            // 显示对比图表
            showComparisonChart();
        }
        
        function showComparisonChart() {
            const chartContainer = document.getElementById('chartContainer');
            const barChart = document.getElementById('barChart');
            chartContainer.style.display = 'block';
            barChart.innerHTML = '';
            
            // 按总耗时排序
            const sorted = [...benchmarkResults].sort((a,b) => a.totalTime - b.totalTime);
            const maxTime = Math.max(...sorted.map(r => r.totalTime));
            
            sorted.forEach(result => {
                const barItem = document.createElement('div');
                barItem.className = 'bar-item';
                const percentage = (result.totalTime / maxTime * 100).toFixed(1);
                barItem.innerHTML = `
                    <div class="bar-label">${result.versionName}</div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                        <span class="bar-value">${result.totalTime.toFixed(1)}ms</span>
                    </div>
                `;
                barChart.appendChild(barItem);
            });
        }
        
        function exportResults() {
            if (benchmarkResults.length === 0) {
                alert('请先运行基准测试!');
                return;
            }
            
            const exportData = {
                exportDate: new Date().toISOString(),
                testConfig: {
                    sampleCount: parseInt(document.getElementById('sampleCount').value),
                    testType: document.getElementById('testType').value,
                    workerVersion: document.getElementById('workerVersion').value
                },
                results: benchmarkResults
            };
            
            const json = JSON.stringify(exportData, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lig-benchmark-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function clearResults() {
            benchmarkResults = [];
            document.getElementById('results').innerHTML = '';
            document.getElementById('chartContainer').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        }
    </script>
</body>
</html>
