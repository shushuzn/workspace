<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 知识图谱 - 模板库</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:20px}
        .container{max-width:1400px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
        h1{font-size:24px;color:#333;margin-bottom:20px;border-bottom:3px solid #667eea;padding-bottom:10px}
        .intro{font-size:14px;color:#666;margin-bottom:20px;line-height:1.6}
        .tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:2px solid #e0e0e0;padding-bottom:10px}
        .tab{padding:10px 20px;background:#f5f5f5;border:none;border-radius:6px 6px 0 0;cursor:pointer;font-size:14px;transition:background 0.3s}
        .tab:hover{background:#e0e0e0}
        .tab.active{background:#667eea;color:white}
        .tab-content{display:none}
        .tab-content.active{display:block}
        .template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
        .template-card{background:white;border:2px solid #e0e0e0;border-radius:8px;padding:15px;cursor:pointer;transition:border-color 0.3s,box-shadow 0.3s}
        .template-card:hover{border-color:#667eea;box-shadow:0 4px 12px rgba(102,126,234,0.2)}
        .template-card h3{font-size:15px;margin-bottom:8px;color:#333}
        .template-card p{font-size:12px;color:#666;margin-bottom:10px;line-height:1.5}
        .template-card .meta{display:flex;justify-content:space-between;font-size:11px;color:#999}
        .template-card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
        .tag{background:#e8f0fe;color:#667eea;padding:2px 8px;border-radius:3px;font-size:10px}
        .action-bar{background:#f5f5f5;padding:15px;border-radius:8px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap}
        button{background:#667eea;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;transition:background 0.3s}
        button:hover{background:#5568d3}button:disabled{background:#ccc;cursor:not-allowed}
        .status{padding:10px;background:#e3f2fd;border-radius:6px;margin-bottom:15px;font-size:13px;color:#1565c0;display:none}
        .preview-panel{background:#fafafa;border:1px solid #e0e0e0;border-radius:8px;padding:15px;margin-top:20px;min-height:200px}
        .preview-panel h3{font-size:15px;margin-bottom:10px;color:#333}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;font-size:13px;margin-bottom:5px;color:#555}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
        .form-group textarea{min-height:100px;resize:vertical}
        .checkbox-group{display:flex;flex-wrap:wrap;gap:15px;margin-top:10px}
        .checkbox-group label{display:flex;align-items:center;font-size:13px;color:#555;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 LIG 知识图谱 - 模板库</h1>
        <p class="intro">预设常用图谱模板，支持保存、导入和分享自定义模板。</p>
        
        <div class="status" id="status"></div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('preset')">📋 预设模板</div>
            <div class="tab" onclick="switchTab('custom')">⭐ 我的模板</div>
            <div class="tab" onclick="switchTab('create')">➕ 创建模板</div>
            <div class="tab" onclick="switchTab('import')">📥 导入模板</div>
        </div>
        
        <!-- 预设模板 -->
        <div class="tab-content active" id="preset-tab">
            <div class="action-bar">
                <button onclick="filterTemplates('all')">全部</button>
                <button onclick="filterTemplates('material')">材料科学</button>
                <button onclick="filterTemplates('biomedical')">生物医学</button>
                <button onclick="filterTemplates('sensor')">传感器</button>
            </div>
            <div class="template-grid" id="presetGrid"></div>
        </div>
        
        <!-- 我的模板 -->
        <div class="tab-content" id="custom-tab">
            <div class="action-bar">
                <button onclick="loadCustomTemplates()">🔄 刷新</button>
                <button onclick="exportAllTemplates()">📤 导出全部</button>
            </div>
            <div class="template-grid" id="customGrid"></div>
        </div>
        
        <!-- 创建模板 -->
        <div class="tab-content" id="create-tab">
            <div class="form-group">
                <label>模板名称 *</label>
                <input type="text" id="templateName" placeholder="例如：LIG 生物传感器图谱">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="templateDesc" placeholder="模板用途说明..."></textarea>
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="templateCategory">
                    <option value="material">材料科学</option>
                    <option value="biomedical">生物医学</option>
                    <option value="sensor">传感器</option>
                    <option value="energy">能源</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>标签 (逗号分隔)</label>
                <input type="text" id="templateTags" placeholder="LIG, 石墨烯，生物传感器">
            </div>
            <div class="form-group">
                <label>图谱数据</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="includeNodes" checked> 包含节点</label>
                    <label><input type="checkbox" id="includeLinks" checked> 包含关系</label>
                    <label><input type="checkbox" id="includeStyles" checked> 包含样式</label>
                </div>
            </div>
            <div class="action-bar">
                <button onclick="saveTemplate()">💾 保存模板</button>
                <button onclick="loadCurrentGraph()">📊 加载当前图谱</button>
                <button onclick="clearForm()">🗑️ 清除表单</button>
            </div>
        </div>
        
        <!-- 导入模板 -->
        <div class="tab-content" id="import-tab">
            <div class="form-group">
                <label>选择模板文件</label>
                <input type="file" id="templateFile" accept=".json">
            </div>
            <div class="action-bar">
                <button onclick="importTemplate()">📥 导入</button>
            </div>
            <div class="preview-panel">
                <h3>📝 预览</h3>
                <pre id="importPreview">暂无预览</pre>
            </div>
        </div>
        
        <div class="preview-panel" id="previewPanel" style="display:none">
            <h3>👁️ 模板预览</h3>
            <pre id="templatePreview"></pre>
        </div>
    </div>

    <script>
        // 预设模板
        const presetTemplates = [
            {
                id: 'lig-basic',
                name: 'LIG 基础图谱',
                desc: '激光诱导石墨烯基础知识图谱，包含材料、设备和应用。',
                category: 'material',
                tags: ['LIG', '石墨烯', '基础'],
                nodes: 10,
                links: 9,
                data: {
                    nodes: [
                        {id:"LIG",label:"LIG",type:"Material",size:40},
                        {id:"PI",label:"PI",type:"Material",size:20},
                        {id:"PDMS",label:"PDMS",type:"Material",size:20},
                        {id:"Gas_Sensor",label:"气体传感器",type:"Device",size:25},
                        {id:"Neural_Probe",label:"神经探针",type:"Device",size:25}
                    ],
                    links: [
                        {source:"PI",target:"LIG",value:3},
                        {source:"PDMS",target:"LIG",value:2},
                        {source:"LIG",target:"Gas_Sensor",value:3},
                        {source:"LIG",target:"Neural_Probe",value:3}
                    ]
                }
            },
            {
                id: 'lig-biomedical',
                name: 'LIG 生物医学应用',
                desc: 'LIG 在生物医学领域的应用，包括传感器、探针和贴片。',
                category: 'biomedical',
                tags: ['LIG', '生物医学', '医疗'],
                nodes: 10,
                links: 9,
                data: {
                    nodes: [
                        {id:"LIG",label:"LIG",type:"Material",size:40},
                        {id:"CuO",label:"CuO",type:"Material",size:22},
                        {id:"Tumor_Patch",label:"肿瘤贴片",type:"Device",size:25},
                        {id:"Cu2+",label:"Cu²⁺",type:"Signal",size:20},
                        {id:"ROS",label:"ROS",type:"Signal",size:20},
                        {id:"Health",label:"健康监控",type:"Application",size:24}
                    ],
                    links: [
                        {source:"CuO",target:"LIG",value:2},
                        {source:"LIG",target:"Tumor_Patch",value:3},
                        {source:"CuO",target:"Cu2+",value:2},
                        {source:"Cu2+",target:"ROS",value:2},
                        {source:"Tumor_Patch",target:"Health",value:2}
                    ]
                }
            },
            {
                id: 'lig-sensor',
                name: 'LIG 传感器网络',
                desc: '基于 LIG 的各种传感器类型和应用场景。',
                category: 'sensor',
                tags: ['LIG', '传感器', '检测'],
                nodes: 8,
                links: 7,
                data: {
                    nodes: [
                        {id:"LIG",label:"LIG",type:"Material",size:40},
                        {id:"Gas_Sensor",label:"气体传感器",type:"Device",size:25},
                        {id:"Biosensor",label:"生物传感器",type:"Device",size:25},
                        {id:"Wearable",label:"可穿戴",type:"Device",size:22}
                    ],
                    links: [
                        {source:"LIG",target:"Gas_Sensor",value:3},
                        {source:"LIG",target:"Biosensor",value:3},
                        {source:"LIG",target:"Wearable",value:2}
                    ]
                }
            },
            {
                id: 'lig-neural',
                name: '神经接口图谱',
                desc: 'LIG 在神经科学和脑机接口的应用。',
                category: 'biomedical',
                tags: ['LIG', '神经', '脑机接口'],
                nodes: 6,
                links: 5,
                data: {
                    nodes: [
                        {id:"LIG",label:"LIG",type:"Material",size:40},
                        {id:"Neural_Probe",label:"神经探针",type:"Device",size:25},
                        {id:"Neural_Spike",label:"神经尖峰",type:"Signal",size:20},
                        {id:"BCI",label:"脑机接口",type:"Application",size:24}
                    ],
                    links: [
                        {source:"LIG",target:"Neural_Probe",value:3},
                        {source:"Neural_Probe",target:"Neural_Spike",value:2},
                        {source:"Neural_Probe",target:"BCI",value:2}
                    ]
                }
            }
        ];
        
        let currentGraphData = null;
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabId}-tab`).classList.add('active');
            
            if (tabId === 'preset') {
                renderPresetTemplates();
            } else if (tabId === 'custom') {
                loadCustomTemplates();
            }
        }
        
        function renderPresetTemplates(filter = 'all') {
            const grid = document.getElementById('presetGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' 
                ? presetTemplates 
                : presetTemplates.filter(t => t.category === filter);
            
            filtered.forEach(template => {
                const card = createTemplateCard(template, 'preset');
                grid.appendChild(card);
            });
        }
        
        function createTemplateCard(template, type) {
            const card = document.createElement('div');
            card.className = 'template-card';
            card.onclick = () => previewTemplate(template, type);
            
            const tags = template.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
            
            card.innerHTML = `
                <h3>${template.name}</h3>
                <p>${template.desc}</p>
                <div class="meta">
                    <span>📊 ${template.nodes} 节点</span>
                    <span>🔗 ${template.links} 关系</span>
                </div>
                <div class="tags">${tags}</div>
            `;
            
            return card;
        }
        
        function filterTemplates(category) {
            renderPresetTemplates(category);
        }
        
        function previewTemplate(template, type) {
            const preview = document.getElementById('templatePreview');
            const panel = document.getElementById('previewPanel');
            
            preview.textContent = JSON.stringify(template.data, null, 2);
            panel.style.display = 'block';
            
            if (confirm(`应用模板 "${template.name}"？\n\n这将替换当前图谱数据。`)) {
                applyTemplate(template);
            }
        }
        
        function applyTemplate(template) {
            // 存储到 localStorage 供主程序使用
            localStorage.setItem('lig-template-data', JSON.stringify(template.data));
            showStatus(`✅ 模板 "${template.name}" 已应用！请打开主程序查看。`);
        }
        
        function loadCustomTemplates() {
            const grid = document.getElementById('customGrid');
            grid.innerHTML = '';
            
            const custom = JSON.parse(localStorage.getItem('lig-custom-templates') || '[]');
            
            if (custom.length === 0) {
                grid.innerHTML = '<p style="color:#999;text-align:center;padding:40px">暂无自定义模板</p>';
                return;
            }
            
            custom.forEach((template, index) => {
                const card = createTemplateCard(template, 'custom');
                
                // 添加删除按钮
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '🗑️ 删除';
                deleteBtn.style.marginTop = '10px';
                deleteBtn.style.background = '#f44336';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteCustomTemplate(index);
                };
                card.appendChild(deleteBtn);
                
                grid.appendChild(card);
            });
        }
        
        function saveTemplate() {
            const name = document.getElementById('templateName').value;
            const desc = document.getElementById('templateDesc').value;
            const category = document.getElementById('templateCategory').value;
            const tags = document.getElementById('templateTags').value.split(',').map(t => t.trim()).filter(t => t);
            
            if (!name) {
                showStatus('❌ 请填写模板名称!');
                return;
            }
            
            if (!currentGraphData) {
                showStatus('❌ 请先加载图谱数据!');
                return;
            }
            
            const template = {
                id: 'custom-' + Date.now(),
                name,
                desc,
                category,
                tags,
                nodes: currentGraphData.nodes?.length || 0,
                links: currentGraphData.links?.length || 0,
                data: currentGraphData
            };
            
            const custom = JSON.parse(localStorage.getItem('lig-custom-templates') || '[]');
            custom.push(template);
            localStorage.setItem('lig-custom-templates', JSON.stringify(custom));
            
            showStatus('✅ 模板已保存!');
            clearForm();
            switchTab('custom');
            document.querySelector('.tab:nth-child(2)').click();
        }
        
        function loadCurrentGraph() {
            // 从主程序加载数据
            const data = localStorage.getItem('lig-current-graph');
            if (data) {
                currentGraphData = JSON.parse(data);
                showStatus(`✅ 已加载当前图谱：${currentGraphData.nodes?.length || 0} 节点，${currentGraphData.links?.length || 0} 关系`);
            } else {
                showStatus('⚠️ 未找到当前图谱数据，请先打开主程序');
            }
        }
        
        function clearForm() {
            document.getElementById('templateName').value = '';
            document.getElementById('templateDesc').value = '';
            document.getElementById('templateTags').value = '';
            currentGraphData = null;
        }
        
        function deleteCustomTemplate(index) {
            if (!confirm('确定要删除此模板吗？')) return;
            
            const custom = JSON.parse(localStorage.getItem('lig-custom-templates') || '[]');
            custom.splice(index, 1);
            localStorage.setItem('lig-custom-templates', JSON.stringify(custom));
            
            loadCustomTemplates();
            showStatus('✅ 模板已删除');
        }
        
        function importTemplate() {
            const file = document.getElementById('templateFile').files[0];
            if (!file) {
                showStatus('❌ 请选择文件!');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const template = JSON.parse(e.target.result);
                    
                    // 验证格式
                    if (!template.data || !template.data.nodes) {
                        throw new Error('无效的模板格式');
                    }
                    
                    const custom = JSON.parse(localStorage.getItem('lig-custom-templates') || '[]');
                    template.id = 'import-' + Date.now();
                    custom.push(template);
                    localStorage.setItem('lig-custom-templates', JSON.stringify(custom));
                    
                    showStatus('✅ 模板导入成功!');
                    document.getElementById('importPreview').textContent = JSON.stringify(template, null, 2);
                } catch (error) {
                    showStatus(`❌ 导入失败：${error.message}`);
                }
            };
            reader.readAsText(file);
        }
        
        function exportAllTemplates() {
            const custom = JSON.parse(localStorage.getItem('lig-custom-templates') || '[]');
            const all = [...presetTemplates, ...custom];
            
            const json = JSON.stringify(all, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'LIG-Templates.json';
            a.click();
            URL.revokeObjectURL(url);
            
            showStatus('✅ 模板已导出!');
        }
        
        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        // 初始化
        window.addEventListener('load', () => {
            renderPresetTemplates();
        });
    </script>
</body>
</html>
