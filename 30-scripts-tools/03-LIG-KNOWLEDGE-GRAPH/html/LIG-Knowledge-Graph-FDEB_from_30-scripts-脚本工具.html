<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIG 生物医学应用知识图谱 (FDEB)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        .container { width: 100vw; height: 100vh; position: relative; }
        #graph { width: 100%; height: 100%; }
        .header {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255,255,255,0.95); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100; max-width: 350px;
        }
        .header h1 { font-size: 20px; color: #333; margin-bottom: 10px; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
        .header p { font-size: 13px; color: #666; line-height: 1.6; }
        .legend {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255,255,255,0.95); padding: 15px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100; max-height: 400px; overflow-y: auto;
        }
        .legend h3 { font-size: 14px; color: #333; margin-bottom: 10px; }
        .legend-item { display: flex; align-items: center; margin: 8px 0; font-size: 12px; cursor: pointer; }
        .legend-color { width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; }
        .controls {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.95); padding: 15px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .controls button {
            display: block; width: 100%; padding: 8px 15px; margin: 5px 0;
            background: #667eea; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 13px;
            transition: background 0.3s;
        }
        .controls button:hover { background: #5568d3; }
        .tooltip {
            position: absolute; background: rgba(0,0,0,0.9); color: white;
            padding: 12px 16px; border-radius: 8px; font-size: 13px;
            pointer-events: none; opacity: 0; transition: opacity 0.3s;
            z-index: 1000; max-width: 300px; line-height: 1.5;
        }
        .node { cursor: pointer; transition: opacity 0.3s; }
        .label {
            font-size: 11px; font-weight: 500; pointer-events: none;
            text-anchor: middle; fill: white;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .stats { margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd; }
        .stat-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 12px; }
        .stat-value { font-weight: bold; color: #667eea; }
        .slider-control { margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; }
        .slider-control label { font-size: 12px; display: block; margin-bottom: 5px; }
        .slider-control input[type="range"] { width: 100%; }
        .slider-value { font-size: 11px; color: #667eea; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 LIG 知识图谱 (FDEB)</h1>
            <p><strong>Force-Directed Edge Bundling</strong></p>
            <p style="margin-top:10px;font-size:12px;color:#888;">
                基于 3 篇综述 + 3 篇原创论文<br>
                FDEB 算法：平行边自动汇聚
            </p>
            <div class="stats">
                <div class="stat-item"><span>节点数:</span><span class="stat-value" id="nodeCount">0</span></div>
                <div class="stat-item"><span>边数:</span><span class="stat-value" id="linkCount">0</span></div>
                <div class="stat-item"><span>类型:</span><span class="stat-value" id="typeCount">0</span></div>
            </div>
        </div>
        
        <div class="legend">
            <h3>📍 节点类型 (点击筛选)</h3>
            <div class="legend-item" onclick="toggleType('Material')"><div class="legend-color" style="background:#FF6B6B" id="legend-Material"></div><span>Material (材料)</span></div>
            <div class="legend-item" onclick="toggleType('Device')"><div class="legend-color" style="background:#4ECDC4" id="legend-Device"></div><span>Device (设备)</span></div>
            <div class="legend-item" onclick="toggleType('Signal')"><div class="legend-color" style="background:#45B7D1" id="legend-Signal"></div><span>Signal (信号)</span></div>
            <div class="legend-item" onclick="toggleType('Technology')"><div class="legend-color" style="background:#FFA07A" id="legend-Technology"></div><span>Technology (技术)</span></div>
            <div class="legend-item" onclick="toggleType('Application')"><div class="legend-color" style="background:#98D8C8" id="legend-Application"></div><span>Application (应用)</span></div>
            <div class="legend-item" onclick="toggleType('Challenge')"><div class="legend-color" style="background:#F7DC6F" id="legend-Challenge"></div><span>Challenge (挑战)</span></div>
            <div class="legend-item" onclick="toggleType('Pathway')"><div class="legend-color" style="background:#BB8FCE" id="legend-Pathway"></div><span>Pathway (通路)</span></div>
            <div style="margin-top:10px;text-align:center"><button onclick="showAllTypes()" style="padding:5px 10px;font-size:12px;cursor:pointer">显示全部</button></div>
        </div>
        
        <div class="controls">
            <button onclick="zoomIn()">🔍 放大</button>
            <button onclick="zoomOut()">🔎 缩小</button>
            <button onclick="resetZoom()">🔄 重置</button>
            <button onclick="toggleLabels()">🏷️ 标签</button>
            <button onclick="highlightLIG()">✨ 聚焦 LIG</button>
            <button onclick="runFDEB()">📦 运行 FDEB</button>
            <div class="slider-control">
                <label>📦 Bundling 强度</label>
                <input type="range" min="0" max="1" step="0.1" value="0.6" oninput="updateBundling(this.value)">
                <div class="slider-value" id="bundlingValue">0.6</div>
            </div>
            <div class="slider-control">
                <label>✂️ 分割段数</label>
                <input type="range" min="3" max="10" step="1" value="5" oninput="updateDivisions(this.value)">
                <div class="slider-value" id="divisionsValue">5</div>
            </div>
        </div>
        
        <div id="graph"></div>
        <div class="tooltip" id="tooltip"></div>
    </div>
    
    <script>
        // 图谱数据
        const graphData = {
            nodes: [
                {id:"LIG",type:"Material",label:"LIG",desc:"3D 多孔石墨烯，激光直写制备",size:40},
                {id:"PI",type:"Material",label:"PI",desc:"聚酰亚胺，LIG 前驱体",size:20},
                {id:"PDMS",type:"Material",label:"PDMS",desc:"柔性基底/封装",size:20},
                {id:"CuO",type:"Material",label:"CuO",desc:"氧化铜，光热治疗",size:22},
                {id:"TMD",type:"Material",label:"TMD",desc:"过渡金属二硫化物",size:20},
                {id:"GOx",type:"Material",label:"GOx",desc:"葡萄糖氧化酶",size:18},
                {id:"Pt_Black",type:"Material",label:"黑铂",desc:"低阻抗涂层",size:18},
                {id:"Gas_Sensor",type:"Device",label:"气体传感器",desc:"呼出气检测",size:25},
                {id:"Neural_Probe",type:"Device",label:"神经探针",desc:"多模态记录",size:25},
                {id:"Tumor_Patch",type:"Device",label:"肿瘤贴片",desc:"光热治疗",size:25},
                {id:"Biosensor",type:"Device",label:"生物传感器",desc:"酶基传感",size:25},
                {id:"Wearable",type:"Device",label:"可穿戴",desc:"健康监控",size:24},
                {id:"Cu2+",type:"Signal",label:"Cu²⁺",desc:"铜离子",size:20},
                {id:"ROS",type:"Signal",label:"ROS",desc:"活性氧",size:20},
                {id:"Glucose",type:"Signal",label:"葡萄糖",desc:"代谢标志物",size:20},
                {id:"Neural_Spike",type:"Signal",label:"神经尖峰",desc:"动作电位",size:18},
                {id:"ECG",type:"Signal",label:"ECG",desc:"心电图",size:18},
                {id:"EMG",type:"Signal",label:"EMG",desc:"肌电",size:18},
                {id:"Gas_Biomarker",type:"Signal",label:"气体标志物",desc:"呼出气标志物",size:20},
                {id:"Laser_Writing",type:"Technology",label:"激光直写",desc:"CO₂/UV 激光",size:24},
                {id:"Nano_Composite",type:"Technology",label:"纳米复合",desc:"掺杂改性",size:20},
                {id:"Encapsulation",type:"Technology",label:"封装",desc:"半透膜保护",size:20},
                {id:"Wireless",type:"Technology",label:"无线",desc:"BLE/NFC",size:20},
                {id:"Three_Phase",type:"Technology",label:"三相界面",desc:"大气氧 + 液体",size:20},
                {id:"R2R",type:"Technology",label:"卷对卷",desc:"大规模制造",size:18},
                {id:"Health_Monitoring",type:"Application",label:"健康监控",desc:"实时监测",size:24},
                {id:"Disease_Diagnosis",type:"Application",label:"疾病诊断",desc:"早期检测",size:22},
                {id:"Photothermal",type:"Application",label:"光热治疗",desc:"低温光疗",size:22},
                {id:"Neural_Recording",type:"Application",label:"神经记录",desc:"脑内信号",size:22},
                {id:"Environmental",type:"Application",label:"环境传感",desc:"空气质量",size:20},
                {id:"Melanoma",type:"Application",label:"黑色素瘤",desc:"皮肤癌",size:20},
                {id:"Neuro_Disorder",type:"Application",label:"神经疾病",desc:"癫痫/帕金森",size:20},
                {id:"Stability",type:"Challenge",label:"稳定性",desc:">30 天数据缺失",size:22},
                {id:"Scalability",type:"Challenge",label:"量产",desc:"直写速度慢",size:20},
                {id:"Humidity",type:"Challenge",label:"湿度",desc:"需封装",size:20},
                {id:"Selectivity",type:"Challenge",label:"选择性",desc:"多信号区分",size:20},
                {id:"Standardization",type:"Challenge",label:"标准化",desc:"统一标准",size:18},
                {id:"Cuproptosis",type:"Pathway",label:"铜死亡",desc:"铜诱导死亡",size:22},
                {id:"Apoptosis",type:"Pathway",label:"凋亡",desc:"程序性死亡",size:20},
                {id:"Ferroptosis",type:"Pathway",label:"铁死亡",desc:"铁依赖死亡",size:20},
                {id:"Gas_Adsorption",type:"Pathway",label:"气体吸附",desc:"表面吸附",size:20},
                {id:"Enzyme_Reaction",type:"Pathway",label:"酶反应",desc:"催化反应",size:20}
            ],
            links: [
                {source:"PI",target:"LIG",value:3},{source:"Laser_Writing",target:"LIG",value:3},
                {source:"TMD",target:"LIG",value:2},{source:"Nano_Composite",target:"LIG",value:2},
                {source:"PDMS",target:"LIG",value:2},{source:"LIG",target:"Gas_Sensor",value:3},
                {source:"LIG",target:"Neural_Probe",value:3},{source:"LIG",target:"Tumor_Patch",value:3},
                {source:"LIG",target:"Biosensor",value:3},{source:"LIG",target:"Wearable",value:2},
                {source:"GOx",target:"Neural_Probe",value:2},{source:"Pt_Black",target:"Neural_Probe",value:2},
                {source:"Neural_Probe",target:"Glucose",value:2},{source:"Neural_Probe",target:"Neural_Spike",value:2},
                {source:"CuO",target:"Tumor_Patch",value:3},{source:"Tumor_Patch",target:"Cu2+",value:3},
                {source:"Cu2+",target:"ROS",value:2},{source:"ROS",target:"Cuproptosis",value:2},
                {source:"ROS",target:"Apoptosis",value:2},{source:"ROS",target:"Ferroptosis",value:2},
                {source:"Tumor_Patch",target:"Melanoma",value:3},{source:"Tumor_Patch",target:"Photothermal",value:2},
                {source:"Gas_Sensor",target:"Gas_Biomarker",value:2},{source:"Gas_Adsorption",target:"Gas_Sensor",value:2},
                {source:"Encapsulation",target:"Gas_Sensor",value:2},{source:"Three_Phase",target:"Biosensor",value:2},
                {source:"Enzyme_Reaction",target:"Biosensor",value:2},{source:"Wearable",target:"ECG",value:2},
                {source:"Wearable",target:"EMG",value:2},{source:"Wireless",target:"Wearable",value:2},
                {source:"Gas_Sensor",target:"Health_Monitoring",value:2},{source:"Gas_Sensor",target:"Disease_Diagnosis",value:2},
                {source:"Neural_Probe",target:"Neural_Recording",value:2},{source:"Neural_Probe",target:"Neuro_Disorder",value:2},
                {source:"Wearable",target:"Health_Monitoring",value:2},{source:"Gas_Sensor",target:"Environmental",value:1},
                {source:"Stability",target:"LIG",value:2},{source:"Scalability",target:"Laser_Writing",value:2},
                {source:"Humidity",target:"Gas_Sensor",value:2},{source:"Selectivity",target:"Gas_Sensor",value:2},
                {source:"Standardization",target:"Wearable",value:1},{source:"R2R",target:"Scalability",value:2},
                {source:"Encapsulation",target:"Humidity",value:2},{source:"Nano_Composite",target:"Selectivity",value:2}
            ]
        };
        
        const colorMap = {"Material":"#FF6B6B","Device":"#4ECDC4","Signal":"#45B7D1","Technology":"#FFA07A","Application":"#98D8C8","Challenge":"#F7DC6F","Pathway":"#BB8FCE"};
        const clusterConfig = {
            "Material":{x:-200,y:-150,label:"材料"},"Device":{x:200,y:-150,label:"设备"},
            "Signal":{x:-200,y:150,label:"信号"},"Technology":{x:200,y:150,label:"技术"},
            "Application":{x:0,y:-250,label:"应用"},"Challenge":{x:0,y:250,label:"挑战"},"Pathway":{x:300,y:0,label:"通路"}
        };
        
        const width = window.innerWidth, height = window.innerHeight;
        const svg = d3.select("#graph").append("svg").attr("width",width).attr("height",height).attr("viewBox",[-width/2,-height/2,width,height]);
        svg.append("defs").selectAll("marker").data(["end"]).enter().append("marker")
            .attr("id","arrowhead").attr("viewBox","0 -5 10 10").attr("refX",28).attr("refY",0)
            .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
            .append("path").attr("fill","#999").attr("d","M0,-5L10,0L0,5");
        
        const g = svg.append("g");
        
        // 聚类背景
        const clusterBg = g.append("g");
        Object.entries(clusterConfig).forEach(([type,config]) => {
            clusterBg.append("ellipse").attr("cx",config.x).attr("cy",config.y).attr("rx",140).attr("ry",100)
                .attr("fill",colorMap[type]).attr("opacity",0.08).attr("stroke",colorMap[type]).attr("stroke-width",1).attr("stroke-dasharray","5,5");
            clusterBg.append("text").attr("x",config.x).attr("y",config.y-60).attr("text-anchor","middle")
                .attr("fill",colorMap[type]).attr("font-size","14px").attr("font-weight","bold").attr("opacity",0.6).text(config.label);
        });
        
        // FDEB 配置
        let bundlingStrength = 0.6;
        let divisions = 5;
        const edges = graphData.links.map((link,idx) => ({id:idx,source:link.source,target:link.target,value:link.value,controlPoints:[]}));
        
        function initControlPoints() {
            edges.forEach(edge => {
                edge.controlPoints = [];
                const sx = graphData.nodes.find(n=>n.id===edge.source)?.x || 0;
                const sy = graphData.nodes.find(n=>n.id===edge.source)?.y || 0;
                const tx = graphData.nodes.find(n=>n.id===edge.target)?.x || 0;
                const ty = graphData.nodes.find(n=>n.id===edge.target)?.y || 0;
                for(let i=1;i<divisions;i++){const t=i/divisions;edge.controlPoints.push({x:sx+(tx-sx)*t,y:sy+(ty-sy)*t});}
            });
        }
        
        function edgeCompatibility(e1,e2) {
            if(!e1.controlPoints.length||!e2.controlPoints.length)return 0;
            const angle1=Math.atan2(e1.controlPoints[0].y,e1.controlPoints[0].x);
            const angle2=Math.atan2(e2.controlPoints[0].y,e2.controlPoints[0].x);
            const angleComp=1-(Math.abs(angle1-angle2)/Math.PI);
            const len1=Math.hypot(graphData.nodes.find(n=>n.id===e1.target)?.x||0,graphData.nodes.find(n=>n.id===e1.target)?.y||0);
            const len2=Math.hypot(graphData.nodes.find(n=>n.id===e2.target)?.x||0,graphData.nodes.find(n=>n.id===e2.target)?.y||0);
            const lenComp=1-Math.abs(len1-len2)/Math.max(len1,len2,1);
            const dist=Math.hypot((graphData.nodes.find(n=>n.id===e1.source)?.x||0)-(graphData.nodes.find(n=>n.id===e2.source)?.x||0),
                                  (graphData.nodes.find(n=>n.id===e1.source)?.y||0)-(graphData.nodes.find(n=>n.id===e2.source)?.y||0));
            const posComp=1/(1+dist/200);
            return(angleComp+lenComp+posComp)/3;
        }
        
        function applyFDEB() {
            const springStrength=0.05,attractionStrength=bundlingStrength*0.02,iterations=15;
            for(let iter=0;iter<iterations;iter++){
                edges.forEach(edge=>{
                    for(let i=0;i<edge.controlPoints.length;i++){
                        const cp=edge.controlPoints[i];let fx=0,fy=0;
                        if(i>0){const prev=edge.controlPoints[i-1];fx+=(prev.x-cp.x)*springStrength;fy+=(prev.y-cp.y)*springStrength;}
                        if(i<edge.controlPoints.length-1){const next=edge.controlPoints[i+1];fx+=(next.x-cp.x)*springStrength;fy+=(next.y-cp.y)*springStrength;}
                        edges.forEach(other=>{
                            if(edge===other||other.controlPoints.length<=i)return;
                            const compat=edgeCompatibility(edge,other);
                            if(compat<0.5)return;
                            const ocp=other.controlPoints[i];const dx=ocp.x-cp.x,dy=ocp.y-cp.y;const dist=Math.hypot(dx,dy);
                            if(dist>0&&dist<150){fx+=dx*attractionStrength*compat/dist;fy+=dy*attractionStrength*compat/dist;}
                        });
                        cp.x+=fx;cp.y+=fy;
                    }
                });
            }
        }
        
        function generateBSplinePath(edge){
            const src=graphData.nodes.find(n=>n.id===edge.source)||{x:0,y:0};
            const tgt=graphData.nodes.find(n=>n.id===edge.target)||{x:0,y:0};
            const points=[src,...edge.controlPoints,tgt];
            if(points.length<3)return`M${src.x},${src.y}L${tgt.x},${tgt.y}`;
            let path=`M${points[0].x},${points[0].y}`;
            for(let i=1;i<points.length-1;i++){const xc=(points[i].x+points[i+1].x)/2,yc=(points[i].y+points[i+1].y)/2;path+=` Q${points[i].x},${points[i].y} ${xc},${yc}`;}
            path+=`L${tgt.x},${tgt.y}`;return path;
        }
        
        const linkPath=g.append("g").selectAll("path").data(edges).enter().append("path")
            .attr("class","link").attr("fill","none").attr("stroke","#999")
            .attr("stroke-width",d=>Math.sqrt(d.value)*2).attr("stroke-opacity",0.6).attr("marker-end","url(#arrowhead)");
        
        const node=g.append("g").selectAll("circle").data(graphData.nodes).enter().append("circle")
            .attr("class","node").attr("r",d=>d.size).attr("fill",d=>colorMap[d.type])
            .attr("stroke","#fff").attr("stroke-width",2)
            .call(d3.drag().on("start",dragstarted).on("drag",dragged).on("end",dragended));
        
        const labels=g.append("g").selectAll("text").data(graphData.nodes).enter().append("text")
            .attr("class","label").attr("dy",d=>d.size+15).text(d=>d.label).style("display","none");
        
        const tooltip=d3.select("#tooltip");
        node.on("mouseover",function(event,d){tooltip.style("opacity",1).html(`<strong>${d.label}</strong><br/>${d.desc}<br/><em>类型:</em>${d.type}`);})
            .on("mousemove",function(event){tooltip.style("left",(event.pageX+15)+"px").style("top",(event.pageY-10)+"px");})
            .on("mouseout",function(){tooltip.style("opacity",0);});
        
        const simulation=d3.forceSimulation(graphData.nodes)
            .force("link",d3.forceLink(graphData.links).id(d=>d.id).distance(100))
            .force("charge",d3.forceManyBody().strength(-600))
            .force("center",d3.forceCenter(0,0).strength(0.05))
            .force("collide",d3.forceCollide().radius(d=>d.size+8).strength(0.5))
            .force("x",d3.forceX(d=>clusterConfig[d.type].x).strength(2))
            .force("y",d3.forceY(d=>clusterConfig[d.type].y).strength(2));
        
        simulation.on("tick",()=>{
            initControlPoints();
            applyFDEB();
            linkPath.attr("d",d=>generateBSplinePath(d));
            node.attr("cx",d=>d.x).attr("cy",d=>d.y);
            labels.attr("x",d=>d.x).attr("y",d=>d.y+d.size+15);
        });
        
        function dragstarted(e,d){if(!e.active)simulation.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;}
        function dragged(e,d){d.fx=e.x;d.fy=e.y;}
        function dragended(e,d){if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null;}
        
        let currentScale=1;
        function zoomIn(){currentScale*=1.3;g.transition().duration(300).attr("transform",`scale(${currentScale})`);}
        function zoomOut(){currentScale/=1.3;g.transition().duration(300).attr("transform",`scale(${currentScale})`);}
        function resetZoom(){currentScale=1;g.transition().duration(300).attr("transform","scale(1)");simulation.alpha(0.3).restart();}
        let labelsVisible=false;
        function toggleLabels(){labelsVisible=!labelsVisible;labels.style("display",labelsVisible?"block":"none");}
        function highlightLIG(){node.transition().duration(300).attr("opacity",d=>d.id==="LIG"?1:0.3);linkPath.transition().duration(300).attr("opacity",d=>d.source.id==="LIG"||d.target.id==="LIG"?1:0.1);}
        function runFDEB(){applyFDEB();linkPath.transition().duration(300).attr("d",d=>generateBSplinePath(d));}
        
        let activeTypes=new Set(Object.keys(colorMap));
        function toggleType(type){if(activeTypes.has(type)){activeTypes.delete(type);document.getElementById(`legend-${type}`).style.opacity="0.3";}else{activeTypes.add(type);document.getElementById(`legend-${type}`).style.opacity="1";}updateVisibility();}
        function showAllTypes(){activeTypes=new Set(Object.keys(colorMap));Object.keys(colorMap).forEach(t=>document.getElementById(`legend-${t}`).style.opacity="1");updateVisibility();}
        function updateVisibility(){node.transition().duration(300).attr("opacity",d=>activeTypes.has(d.type)?1:0.1);linkPath.transition().duration(300).attr("opacity",d=>activeTypes.has(d.source.type)&&activeTypes.has(d.target.type)?0.6:0.1);labels.transition().duration(300).attr("opacity",d=>activeTypes.has(d.type)?1:0.1);}
        function updateBundling(v){bundlingStrength=parseFloat(v);document.getElementById("bundlingValue").textContent=v;applyFDEB();linkPath.attr("d",d=>generateBSplinePath(d));}
        function updateDivisions(v){divisions=parseInt(v);document.getElementById("divisionsValue").textContent=v;initControlPoints();applyFDEB();linkPath.attr("d",d=>generateBSplinePath(d));}
        
        svg.on("wheel",function(e){e.preventDefault();const delta=e.deltaY>0?0.9:1.1;currentScale*=delta;currentScale=Math.max(0.3,Math.min(3,currentScale));g.transition().duration(100).attr("transform",`scale(${currentScale})`);});
        
        document.getElementById("nodeCount").textContent=graphData.nodes.length;
        document.getElementById("linkCount").textContent=graphData.links.length;
        document.getElementById("typeCount").textContent=Object.keys(colorMap).length;
    </script>
</body>
</html>
