<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            margin-top: 5px;
            font-size: 0.9em;
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .deployment-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f9f9f9;
            margin: 10px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .deployment-item.success { border-left-color: #4CAF50; }
        .deployment-item.failed { border-left-color: #f44336; }
        .deployment-item.pending { border-left-color: #ff9800; }
        .deployment-info {
            flex: 1;
        }
        .deployment-service {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        .deployment-version {
            color: #666;
            font-size: 0.9em;
        }
        .deployment-meta {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            color: white;
        }
        .status-success { background: #4CAF50; }
        .status-failed { background: #f44336; }
        .status-pending { background: #ff9800; }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .service-card {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e1e5eb;
        }
        .service-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .service-info {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0;
        }
        .service-info strong {
            color: #333;
        }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
        .refresh-info {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deployment Dashboard</h1>
        
        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-deployments">0</div>
                <div class="stat-label">Total Deployments</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="success-rate">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-duration">0s</div>
                <div class="stat-label">Avg Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-services">0</div>
                <div class="stat-label">Active Services</div>
            </div>
        </div>
        
        <!-- Services -->
        <div class="section">
            <h2>📦 Services</h2>
            <div class="service-grid" id="services-list">
                <!-- Services will be loaded here -->
            </div>
        </div>
        
        <!-- Recent Deployments -->
        <div class="section">
            <h2>📜 Recent Deployments</h2>
            <div id="deployments-list">
                <!-- Deployments will be loaded here -->
            </div>
        </div>
        
        <!-- Refresh Info -->
        <div class="refresh-info">
            <span class="live-indicator"></span>
            Live Dashboard | Auto-refresh every 10 seconds
            <br>
            Last updated: <span id="last-update">Never</span>
        </div>
    </div>
    
    <script>
        // Sample data (in production, this would be fetched from API)
        const deploymentData = {
            stats: {
                total_deployments: 0,
                successful: 0,
                failed: 0,
                success_rate: 0,
                avg_duration_seconds: 0,
                by_service: {}
            },
            services: {
                'website': {
                    source: '40-collectors-数据收集器/website',
                    deploy_path: '/var/www/felixxii.xyz',
                    status: 'active'
                },
                'stock-analyzer': {
                    source: '40-collectors-数据收集器/stock-analyzer',
                    deploy_path: '/var/www/felixxii.xyz/stock',
                    status: 'active'
                },
                'workflow-visualizer': {
                    source: '30-scripts-tools/workflow_visualizer.py',
                    deploy_path: '/opt/workflow-visualizer',
                    port: 8445,
                    status: 'active'
                },
                'innovator-dashboard': {
                    source: '00-人格系统/innovator-dashboard',
                    deploy_path: '/opt/innovator-dashboard',
                    port: 8444,
                    status: 'active'
                }
            },
            recent_deployments: []
        };
        
        function updateDashboard() {
            // Fetch data from API (or use sample data)
            fetch('data/deploy/deployment_history.json')
                .then(response => response.json())
                .then(data => {
                    deploymentData.recent_deployments = data;
                    deploymentData.stats.total_deployments = data.length;
                    deploymentData.stats.successful = data.filter(d => d.status === 'success').length;
                    deploymentData.stats.failed = data.filter(d => d.status === 'failed').length;
                    deploymentData.stats.success_rate = deploymentData.stats.total_deployments > 0 
                        ? (deploymentData.stats.successful / deploymentData.stats.total_deployments * 100).toFixed(1)
                        : 0;
                    
                    const durations = data
                        .filter(d => d.status === 'success' && d.duration_seconds > 0)
                        .map(d => d.duration_seconds);
                    deploymentData.stats.avg_duration_seconds = durations.length > 0
                        ? (durations.reduce((a, b) => a + b, 0) / durations.length).toFixed(2)
                        : 0;
                    
                    renderDashboard();
                })
                .catch(err => {
                    console.log('Using sample data (no deployment history yet)');
                    renderDashboard();
                });
            
            document.getElementById('last-update').textContent = new Date().toLocaleString();
        }
        
        function renderDashboard() {
            // Update stats
            document.getElementById('total-deployments').textContent = deploymentData.stats.total_deployments;
            document.getElementById('success-rate').textContent = deploymentData.stats.success_rate + '%';
            document.getElementById('avg-duration').textContent = deploymentData.stats.avg_duration_seconds + 's';
            document.getElementById('active-services').textContent = Object.keys(deploymentData.services).length;
            
            // Render services
            const servicesList = document.getElementById('services-list');
            servicesList.innerHTML = '';
            
            for (const [name, info] of Object.entries(deploymentData.services)) {
                const serviceCard = document.createElement('div');
                serviceCard.className = 'service-card';
                serviceCard.innerHTML = `
                    <div class="service-name">📦 ${name}</div>
                    <div class="service-info"><strong>Source:</strong> ${info.source}</div>
                    <div class="service-info"><strong>Deploy:</strong> ${info.deploy_path}</div>
                    ${info.port ? `<div class="service-info"><strong>Port:</strong> ${info.port}</div>` : ''}
                    <div class="service-info"><strong>Status:</strong> <span style="color: #4CAF50;">${info.status}</span></div>
                `;
                servicesList.appendChild(serviceCard);
            }
            
            // Render recent deployments
            const deploymentsList = document.getElementById('deployments-list');
            deploymentsList.innerHTML = '';
            
            const recent = deploymentData.recent_deployments.slice(0, 10);
            
            if (recent.length === 0) {
                deploymentsList.innerHTML = '<p style="color: #666; text-align: center; padding: 20px;">No deployments yet</p>';
                return;
            }
            
            recent.forEach(dep => {
                const depItem = document.createElement('div');
                depItem.className = `deployment-item ${dep.status}`;
                depItem.innerHTML = `
                    <div class="deployment-info">
                        <div class="deployment-service">${dep.service} v${dep.version}</div>
                        <div class="deployment-version">Environment: ${dep.environment}</div>
                        <div class="deployment-meta">
                            ${new Date(dep.timestamp).toLocaleString()} | 
                            Duration: ${dep.duration_seconds.toFixed(2)}s | 
                            Hash: ${dep.deploy_hash}
                        </div>
                    </div>
                    <div class="status-badge status-${dep.status}">${dep.status.toUpperCase()}</div>
                `;
                deploymentsList.appendChild(depItem);
            });
        }
        
        // Initial load
        updateDashboard();
        
        // Auto-refresh every 10 seconds
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>
