name: OpenClaw API CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - '30-scripts/api-server/**'
  pull_request:
    branches: [ master ]
    paths:
      - '30-scripts/api-server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd 30-scripts/api-server
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
    
    - name: Run tests
      run: |
        cd 30-scripts/api-server
        pytest tests/ -v || echo "No tests yet"
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 30-scripts/api-server --count --select=E9,F63,F7,F82 --show-source --statistics

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        cd 30-scripts/api-server
        docker build -t openclaw-api:latest .
    
    - name: Test Docker image
      run: |
        docker run -d --name test-api -p 8000:8000 openclaw-api:latest
        sleep 10
        curl -f http://localhost:8000/api/v1/health || exit 1
        docker stop test-api
        docker rm test-api
    
    # - name: Push to Registry (可选)
