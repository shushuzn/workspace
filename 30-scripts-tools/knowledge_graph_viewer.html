<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph - OpenClaw</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; }
        #container { width: 100vw; height: 100vh; }
        #sidebar {
            position: fixed; top: 0; right: 0; width: 350px; height: 100vh;
            background: #16213e; padding: 20px; overflow-y: auto;
            box-shadow: -2px 0 10px rgba(0,0,0,0.3);
            transform: translateX(100%); transition: transform 0.3s ease;
        }
        #sidebar.active { transform: translateX(0); }
        #controls {
            position: fixed; top: 20px; left: 20px; z-index: 1000;
            background: rgba(22, 33, 62, 0.9); padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button {
            background: #e94560; color: white; border: none; padding: 10px 20px;
            margin: 5px; border-radius: 5px; cursor: pointer; font-size: 14px;
            transition: background 0.3s;
        }
        button:hover { background: #ff6b6b; }
        input, select {
            background: #0f3460; color: white; border: 1px solid #e94560;
            padding: 8px; border-radius: 5px; margin: 5px; width: 100%;
        }
        .stat-card {
            background: #0f3460; padding: 15px; border-radius: 8px;
            margin: 10px 0; border-left: 4px solid #e94560;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 12px; color: #aaa; }
        .entity-detail { margin-top: 20px; }
        .entity-detail h3 { color: #e94560; margin-bottom: 10px; }
        .entity-detail p { margin: 5px 0; color: #ccc; }
        .entity-detail .tag {
            display: inline-block; background: #e94560; color: white;
            padding: 3px 8px; border-radius: 3px; font-size: 12px; margin: 2px;
        }
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(22, 33, 62, 0.95); padding: 40px; border-radius: 10px;
            text-align: center; z-index: 2000;
        }
        .spinner {
            border: 4px solid #0f3460; border-top: 4px solid #e94560;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #close-sidebar {
            position: absolute; top: 10px; right: 10px;
            background: transparent; border: none; color: #aaa;
            font-size: 24px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>Loading Knowledge Graph...</h2>
        <p id="loading-text">Fetching data...</p>
    </div>

    <div id="controls">
        <h3 style="margin-bottom: 10px; color: #e94560;">🔍 Knowledge Graph</h3>
        <input type="text" id="search" placeholder="Search entities...">
        <select id="filter-type">
            <option value="">All Types</option>
            <option value="lesson">Lessons</option>
            <option value="tool">Tools</option>
            <option value="model">Models</option>
            <option value="url">URLs</option>
            <option value="commit">Commits</option>
        </select>
        <div>
            <button onclick="resetZoom()">Reset Zoom</button>
            <button onclick="toggleSidebar()">Stats</button>
        </div>
    </div>

    <div id="container"></div>

    <div id="sidebar">
        <button id="close-sidebar" onclick="toggleSidebar()">&times;</button>
        <h2 style="color: #e94560; margin-bottom: 20px;">📊 Statistics</h2>
        <div id="stats-content"></div>
        <div id="entity-detail" class="entity-detail"></div>
    </div>

    <script>
        let cy;
        let graphData = null;

        // Load graph data
        async function loadGraph() {
            try {
                const response = await fetch('knowledge-graph.json');
                graphData = await response.json();
                document.getElementById('loading-text').textContent = 
                    `Loaded ${graphData.statistics.entities} entities, ${graphData.statistics.relations} relations`;
                initGraph();
            } catch (error) {
                document.getElementById('loading-text').textContent = 
                    `Error: ${error.message}. Run builder first.`;
            }
        }

        function initGraph() {
            // Prepare data
            const elements = [];
            
            // Add nodes
            graphData.entities.forEach(entity => {
                elements.push({
                    data: {
                        id: entity.id,
                        label: entity.id.length > 30 ? entity.id.substring(0, 27) + '...' : entity.id,
                        type: entity.type,
                        sources: entity.sources || [entity.source],
                        metadata: entity.metadata || {}
                    }
                });
            });

            // Add edges
            graphData.relations.forEach(rel => {
                elements.push({
                    data: {
                        source: rel.source,
                        target: rel.target,
                        label: rel.type,
                        type: 'relation'
                    }
                });
            });

            // Initialize Cytoscape
            cy = cytoscape({
                container: document.getElementById('container'),
                elements: elements,
                style: [
                    {
                        selector: 'node[type="lesson"]',
                        style: {
                            'background-color': '#e94560',
                            'label': 'data(label)',
                            'color': '#fff',
                            'font-size': '12px',
                            'text-valign': 'bottom',
                            'text-halign': 'center',
                            'width': '40px',
                            'height': '40px'
                        }
                    },
                    {
                        selector: 'node[type="tool"]',
                        style: {
                            'background-color': '#4ecdc4',
                            'label': 'data(label)',
                            'color': '#fff',
                            'font-size': '11px',
                            'text-valign': 'bottom',
                            'text-halign': 'center',
                            'width': '50px',
                            'height': '50px',
                            'shape': 'rectangle'
                        }
                    },
                    {
                        selector: 'node[type="model"]',
                        style: {
                            'background-color': '#ffe66d',
                            'label': 'data(label)',
                            'color': '#333',
                            'font-size': '11px',
                            'text-valign': 'bottom',
                            'text-halign': 'center',
                            'width': '45px',
                            'height': '45px',
                            'shape': 'ellipse'
                        }
                    },
                    {
                        selector: 'node[type="url"]',
                        style: {
                            'background-color': '#95a5a6',
                            'label': 'data(label)',
                            'color': '#fff',
                            'font-size': '10px',
                            'text-valign': 'bottom',
                            'text-halign': 'center',
                            'width': '35px',
                            'height': '35px'
                        }
                    },
                    {
                        selector: 'node[type="commit"]',
                        style: {
                            'background-color': '#9b59b6',
                            'label': 'data(label)',
                            'color': '#fff',
                            'font-size': '10px',
                            'text-valign': 'bottom',
                            'text-halign': 'center',
                            'width': '35px',
                            'height': '35px'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#6c757d',
                            'target-arrow-color': '#6c757d',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'label': 'data(label)',
                            'font-size': '10px',
                            'text-rotation': 'autorotate'
                        }
                    },
                    {
                        selector: ':selected',
                        style: {
                            'border-width': 3,
                            'border-color': '#fff',
                            'line-width': 4
                        }
                    }
                ],
                layout: {
                    name: 'cose',
                    animate: true,
                    animationDuration: 1000,
                    nodeRepulsion: 4500,
                    edgeElasticity: 100,
                    padding: 30
                },
                wheelSensitivity: 0.3,
            });

            // Event listeners
            cy.on('tap', 'node', function(evt) {
                showEntityDetails(evt.target.data());
            });

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                showStats();
            }, 500);
        }

        function showStats() {
            const stats = graphData.statistics;
            const html = `
                <div class="stat-card">
                    <div class="stat-value">${stats.entities}</div>
                    <div class="stat-label">Total Entities</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.relations}</div>
                    <div class="stat-label">Total Relations</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.sources}</div>
                    <div class="stat-label">Source Files</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${stats.build_time_seconds}s</div>
                    <div class="stat-label">Build Time</div>
                </div>
                <h3 style="margin-top: 20px; color: #4ecdc4;">Entity Types</h3>
                ${Object.entries(stats.entity_types || {}).map(([type, count]) => `
                    <div class="stat-card">
                        <div class="stat-value">${count}</div>
                        <div class="stat-label">${type}</div>
                    </div>
                `).join('')}
            `;
            document.getElementById('stats-content').innerHTML = html;
        }

        function showEntityDetails(data) {
            const html = `
                <h3>${data.label}</h3>
                <p><strong>Type:</strong> <span class="tag">${data.type}</span></p>
                <p><strong>ID:</strong> ${data.id}</p>
                ${data.sources ? `
                    <p><strong>Sources:</strong></p>
                    <div style="max-height: 200px; overflow-y: auto;">
                        ${data.sources.map(s => `<span class="tag">${s}</span>`).join('')}
                    </div>
                ` : ''}
                ${data.metadata && Object.keys(data.metadata).length > 0 ? `
                    <p><strong>Metadata:</strong></p>
                    <pre style="background: #0f3460; padding: 10px; border-radius: 5px; font-size: 11px;">${JSON.stringify(data.metadata, null, 2)}</pre>
                ` : ''}
            `;
            document.getElementById('entity-detail').innerHTML = html;
            toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function resetZoom() {
            cy.fit(null, 50);
        }

        // Search functionality
        document.getElementById('search').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            if (!query) {
                cy.elements().select();
                return;
            }
            
            const matches = cy.nodes().filter(node => 
                node.data('label').toLowerCase().includes(query)
            );
            
            cy.elements().unselect();
            matches.select();
            
            if (matches.length > 0) {
                cy.animate({
                    fit: {
                        eles: matches,
                        padding: 50
                    }
                }, { duration: 500 });
            }
        });

        // Filter by type
        document.getElementById('filter-type').addEventListener('change', function(e) {
            const type = e.target.value;
            if (!type) {
                cy.elements().show();
            } else {
                cy.elements().hide();
                cy.nodes(`[type="${type}"]`).show();
                cy.edges().show();
            }
        });

        // Load on start
        loadGraph();
    </script>
</body>
</html>
