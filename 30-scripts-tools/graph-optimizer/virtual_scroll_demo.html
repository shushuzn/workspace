<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图谱虚拟滚动演示 - todo-034</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      color: #e94560;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .demo-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .demo-box {
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .demo-header {
      background: #0f3460;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .demo-header h2 {
      color: #e94560;
      font-size: 16px;
    }
    
    .demo-stats {
      font-size: 12px;
      color: #aaa;
    }
    
    .demo-stats span {
      color: #4cd137;
      font-weight: bold;
    }
    
    .scroll-container {
      height: 500px;
      overflow-y: auto;
      position: relative;
    }
    
    .scroll-content {
      position: relative;
    }
    
    .node-item {
      position: absolute;
      left: 0;
      right: 0;
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid #0f3460;
      transition: background 0.2s;
      cursor: pointer;
    }
    
    .node-item:hover {
      background: #0f3460;
    }
    
    .node-item.selected {
      background: #e94560;
    }
    
    .node-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 10px;
    }
    
    .node-label {
      flex: 1;
      font-size: 13px;
    }
    
    .node-type {
      font-size: 11px;
      color: #aaa;
      padding: 2px 8px;
      background: #0f3460;
      border-radius: 10px;
    }
    
    .control-panel {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .control-panel h3 {
      color: #e94560;
      margin-bottom: 15px;
      font-size: 16px;
    }
    
    .btn {
      padding: 10px 20px;
      margin: 5px;
      background: #e94560;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #ff6b81;
    }
    
    .btn-secondary {
      background: #0f3460;
    }
    
    .btn-secondary:hover {
      background: #1a4a7a;
    }
    
    .control-group {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 10px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #aaa;
    }
    
    .control-group select,
    .control-group input[type="number"] {
      padding: 8px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      color: #eee;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .comparison {
      background: #16213e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .comparison h3 {
      color: #e94560;
      margin-bottom: 15px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #0f3460;
    }
    
    th {
      background: #0f3460;
      color: #e94560;
      font-size: 13px;
    }
    
    td {
      font-size: 13px;
    }
    
    .highlight {
      color: #4cd137;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📜 图谱虚拟滚动演示 - todo-034</h1>
    
    <!-- 控制面板 -->
    <div class="control-panel">
      <h3>🎛️ 控制选项</h3>
      
      <div class="control-group">
        <label>数据量</label>
        <select id="data-size">
          <option value="100">100 节点</option>
          <option value="500">500 节点</option>
          <option value="1000" selected>1000 节点</option>
          <option value="5000">5000 节点</option>
          <option value="10000">10000 节点</option>
        </select>
      </div>
      
      <div class="control-group">
        <label>项目高度 (px)</label>
        <input type="number" id="item-height" value="50" min="30" max="100">
      </div>
      
      <div class="control-group">
        <label>缓冲区 (项)</label>
        <input type="number" id="buffer-size" value="5" min="0" max="20">
      </div>
      
      <button class="btn" onclick="demo.loadData()">加载数据</button>
      <button class="btn btn-secondary" onclick="demo.toggleVirtualScroll()">切换虚拟滚动</button>
      <button class="btn btn-secondary" onclick="demo.showComparison()">性能对比</button>
    </div>
    
    <!-- 性能对比 -->
    <div class="comparison" id="comparison-panel" style="display: none;">
      <h3>📊 性能对比</h3>
      <table>
        <thead>
          <tr>
            <th>指标</th>
            <th>传统渲染</th>
            <th>虚拟滚动</th>
            <th>提升</th>
          </tr>
        </thead>
        <tbody id="comparison-body">
          <!-- 动态填充 -->
        </tbody>
      </table>
    </div>
    
    <!-- 演示区域 -->
    <div class="demo-panel">
      <!-- 传统渲染 -->
      <div class="demo-box">
        <div class="demo-header">
          <h2>🐌 传统渲染 (全部 DOM)</h2>
          <div class="demo-stats">
            DOM 节点：<span id="traditional-count">0</span> | 
            渲染时间：<span id="traditional-time">0</span>ms
          </div>
        </div>
        <div class="scroll-container" id="traditional-container">
          <div class="scroll-content" id="traditional-content"></div>
        </div>
      </div>
      
      <!-- 虚拟滚动 -->
      <div class="demo-box">
        <div class="demo-header">
          <h2>🚀 虚拟滚动 (可见区域)</h2>
          <div class="demo-stats">
            DOM 节点：<span id="virtual-count">0</span> | 
            渲染时间：<span id="virtual-time">0</span>ms
          </div>
        </div>
        <div class="scroll-container" id="virtual-container">
          <div class="scroll-content" id="virtual-content"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    /**
     * 虚拟滚动演示
     * todo-034: 多模态图谱性能优化 - 虚拟滚动组件
     */
    class VirtualScrollDemo {
      constructor() {
        this.data = [];
        this.itemHeight = 50;
        this.bufferSize = 5;
        this.useVirtualScroll = true;
        this.scrollTop = 0;
        
        this.traditionalContainer = document.getElementById('traditional-content');
        this.virtualContainer = document.getElementById('virtual-content');
        this.virtualScrollEl = document.getElementById('virtual-container');
        
        this.setupEventListeners();
      }
      
      setupEventListeners() {
        document.getElementById('item-height').addEventListener('change', (e) => {
          this.itemHeight = parseInt(e.target.value);
          this.render();
        });
        
        document.getElementById('buffer-size').addEventListener('change', (e) => {
          this.bufferSize = parseInt(e.target.value);
          this.render();
        });
        
        this.virtualScrollEl.addEventListener('scroll', () => {
          this.scrollTop = this.virtualScrollEl.scrollTop;
          if (this.useVirtualScroll) {
            this.renderVirtual();
          }
        });
      }
      
      loadData() {
        const size = parseInt(document.getElementById('data-size').value);
        this.data = this.generateData(size);
        
        console.log(`✅ Loaded ${size} items`);
        
        this.render();
        this.showComparison();
      }
      
      generateData(count) {
        const data = [];
        const types = ['paper', 'author', 'concept'];
        const colors = {
          paper: '#e94560',
          author: '#4cd137',
          concept: '#00a8ff'
        };
        
        for (let i = 0; i < count; i++) {
          const type = types[Math.floor(Math.random() * types.length)];
          data.push({
            id: i,
            label: `Node ${i} - ${this.generateRandomName()}`,
            type: type,
            color: colors[type]
          });
        }
        
        return data;
      }
      
      generateRandomName() {
        const names = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Theta'];
        return names[Math.floor(Math.random() * names.length)];
      }
      
      render() {
        // 传统渲染 (全部 DOM)
        const traditionalStart = performance.now();
        this.renderTraditional();
        const traditionalTime = performance.now() - traditionalStart;
        
        // 虚拟滚动
        const virtualStart = performance.now();
        if (this.useVirtualScroll) {
          this.renderVirtual();
        } else {
          this.renderTraditional(this.virtualContainer, this.virtualContent);
        }
        const virtualTime = performance.now() - virtualStart;
        
        // 更新统计
        document.getElementById('traditional-count').textContent = this.data.length;
        document.getElementById('traditional-time').textContent = traditionalTime.toFixed(2);
        
        if (this.useVirtualScroll) {
          const visibleCount = Math.ceil(this.virtualScrollEl.clientHeight / this.itemHeight) + this.bufferSize * 2;
          document.getElementById('virtual-count').textContent = `${visibleCount} / ${this.data.length}`;
        } else {
          document.getElementById('virtual-count').textContent = this.data.length;
        }
        document.getElementById('virtual-time').textContent = virtualTime.toFixed(2);
      }
      
      renderTraditional(container = this.traditionalContainer) {
        container.innerHTML = '';
        container.style.height = `${this.data.length * this.itemHeight}px`;
        
        for (let i = 0; i < this.data.length; i++) {
          const item = this.data[i];
          const el = document.createElement('div');
          el.className = 'node-item';
          el.style.top = `${i * this.itemHeight}px`;
          el.innerHTML = `
            <div class="node-color" style="background: ${item.color}"></div>
            <span class="node-label">${item.label}</span>
            <span class="node-type">${item.type}</span>
          `;
          container.appendChild(el);
        }
      }
      
      renderVirtual() {
        this.virtualContainer.innerHTML = '';
        
        const containerHeight = this.virtualScrollEl.clientHeight;
        const totalHeight = this.data.length * this.itemHeight;
        this.virtualContainer.style.height = `${totalHeight}px`;
        
        // 计算可见范围
        const startIndex = Math.max(0, Math.floor(this.scrollTop / this.itemHeight) - this.bufferSize);
        const visibleCount = Math.ceil(containerHeight / this.itemHeight);
        const endIndex = Math.min(this.data.length, startIndex + visibleCount + this.bufferSize * 2);
        
        // 仅渲染可见项
        for (let i = startIndex; i < endIndex; i++) {
          const item = this.data[i];
          const el = document.createElement('div');
          el.className = 'node-item';
          el.style.top = `${i * this.itemHeight}px`;
          el.innerHTML = `
            <div class="node-color" style="background: ${item.color}"></div>
            <span class="node-label">${item.label}</span>
            <span class="node-type">${item.type}</span>
          `;
          this.virtualContainer.appendChild(el);
        }
      }
      
      toggleVirtualScroll() {
        this.useVirtualScroll = !this.useVirtualScroll;
        console.log(`Virtual scroll: ${this.useVirtualScroll ? 'ON' : 'OFF'}`);
        this.render();
      }
      
      showComparison() {
        const panel = document.getElementById('comparison-panel');
        panel.style.display = 'block';
        
        const traditionalTime = parseFloat(document.getElementById('traditional-time').textContent);
        const virtualTime = parseFloat(document.getElementById('virtual-time').textContent);
        
        const domReduction = this.useVirtualScroll 
          ? ((this.data.length - Math.ceil(this.virtualScrollEl.clientHeight / this.itemHeight)) / this.data.length * 100).toFixed(1)
          : 0;
        
        const speedup = traditionalTime / virtualTime;
        
        const tbody = document.getElementById('comparison-body');
        tbody.innerHTML = `
          <tr>
            <td>DOM 节点数</td>
            <td>${this.data.length}</td>
            <td class="highlight">${this.useVirtualScroll ? Math.ceil(this.virtualScrollEl.clientHeight / this.itemHeight) + this.bufferSize * 2 : this.data.length}</td>
            <td class="highlight">-${domReduction}%</td>
          </tr>
          <tr>
            <td>渲染时间</td>
            <td>${traditionalTime.toFixed(2)}ms</td>
            <td class="highlight">${virtualTime.toFixed(2)}ms</td>
            <td class="highlight">${speedup.toFixed(1)}x 更快</td>
          </tr>
          <tr>
            <td>内存占用</td>
            <td>高</td>
            <td class="highlight">低</td>
            <td class="highlight">~${domReduction}% 减少</td>
          </tr>
          <tr>
            <td>滚动性能</td>
            <td>${this.data.length > 1000 ? '卡顿' : '流畅'}</td>
            <td class="highlight">流畅</td>
            <td class="highlight">60fps</td>
          </tr>
        `;
      }
    }
    
    // 初始化演示
    const demo = new VirtualScrollDemo();
    
    // 自动加载测试数据
    demo.loadData();
    
    console.log('🚀 Virtual Scroll Demo ready');
  </script>
</body>
</html>
