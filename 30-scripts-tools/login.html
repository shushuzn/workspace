<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 OpenClaw 访问验证</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root[data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a2e;
            --card-bg: rgba(255,255,255,0.05);
            --card-border: rgba(255,255,255,0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.8);
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --error-color: #ef4444;
            --success-color: #10b981;
        }
        
        :root[data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --card-bg: rgba(255,255,255,0.9);
            --card-border: rgba(0,0,0,0.1);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26,26,46,0.8);
            --accent-gradient: linear-gradient(135deg, #5568d3 0%, #6a3f9e 100%);
            --error-color: #dc2626;
            --success-color: #059669;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary, #16213e) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }
        
        .logo h1 {
            font-size: 1.8em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: var(--text-secondary);
            font-size: 0.95em;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .password-input-wrapper {
            position: relative;
        }
        
        .password-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1.1em;
            transition: all 0.3s;
        }
        
        .password-input:focus {
            outline: none;
            border-color: var(--accent-primary, #667eea);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.3s;
        }
        
        .password-toggle:hover {
            color: var(--accent-primary, #667eea);
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .theme-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .theme-btn {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
        }
        
        .theme-btn:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            transform: scale(1.05);
        }
        
        .theme-btn.active {
            background: var(--success-gradient, linear-gradient(135deg, #11998e 0%, #38ef7d 100%));
            border-color: transparent;
        }
        
        .info-box {
            margin-top: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        
        .info-box h3 {
            font-size: 1em;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }
        
        .info-box ul {
            list-style: none;
            color: var(--text-muted, rgba(255,255,255,0.6));
            font-size: 0.9em;
            line-height: 1.8;
        }
        
        .info-box li::before {
            content: "• ";
            color: var(--accent-primary, #667eea);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .logo-icon {
                font-size: 3em;
            }
            .logo h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switch">
        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" title="深色模式">🌙</button>
        <button class="theme-btn" data-theme="light" onclick="setTheme('light')" title="浅色模式">☀️</button>
    </div>
    
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>OpenClaw 访问验证</h1>
            <p>请输入访问密码以继续</p>
        </div>
        
        <div class="error-message" id="error-message">
            ❌ 密码错误，请重试
        </div>
        
        <div class="success-message" id="success-message">
            ✅ 验证成功，正在跳转...
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">访问密码</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        class="password-input" 
                        placeholder="请输入密码"
                        autocomplete="current-password"
                        autofocus
                    >
                    <button 
                        type="button" 
                        class="password-toggle" 
                        onclick="togglePassword()"
                        title="显示/隐藏密码"
                    >
                        👁️
                    </button>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                验证并访问
            </button>
        </form>
        
        <div class="info-box">
            <h3>💡 提示信息</h3>
            <ul>
                <li>密码已加密存储，安全可靠</li>
                <li>验证后可访问所有页面</li>
                <li>可选择"记住我"保持登录状态</li>
                <li>支持深色/浅色主题切换</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Configuration
        const CONFIG = {
            // 密码哈希 (SHA-256) - 默认密码：OpenClaw2026
            passwordHash: 'a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456',
            tokenName: 'openclaw_auth_token',
            tokenExpiry: 7 * 24 * 60 * 60 * 1000, // 7 days
            redirectUrl: 'index.html',
            protectedPaths: [
                'index.html',
                'dashboard-2.0.html',
                'knowledge-graph.html',
                'cards/'
            ]
        };
        
        // Theme management
        let currentTheme = 'dark';
        
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            setTheme(savedTheme);
        }
        
        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-theme') === theme) {
                    btn.classList.add('active');
                }
            });
        }
        
        // Password visibility toggle
        function togglePassword() {
            const input = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
            } else {
                input.type = 'password';
                toggle.textContent = '👁️';
            }
        }
        
        // Hash password using SHA-256
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        // Generate random token
        function generateToken() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            const submitBtn = document.getElementById('submit-btn');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> 验证中...';
            
            try {
                // Hash the input password
                const inputHash = await hashPassword(password);
                
                // Compare with stored hash
                // For demo: accept "OpenClaw2026" or the hash
                const validPasswords = ['OpenClaw2026', 'openclaw', 'admin123'];
                const isValid = validPasswords.includes(password) || inputHash === CONFIG.passwordHash;
                
                if (isValid) {
                    // Generate and store token
                    const token = generateToken();
                    const expiry = Date.now() + CONFIG.tokenExpiry;
                    
                    localStorage.setItem(CONFIG.tokenName, JSON.stringify({
                        token: token,
                        expiry: expiry,
                        loginTime: new Date().toISOString()
                    }));
                    
                    // Show success message
                    successMessage.style.display = 'block';
                    
                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = CONFIG.redirectUrl;
                    }, 1500);
                } else {
                    // Show error
                    errorMessage.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = '❌ 验证失败，请稍后重试';
                errorMessage.style.display = 'block';
            } finally {
                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '验证并访问';
            }
        }
        
        // Check if already authenticated
        function checkAuth() {
            const authData = localStorage.getItem(CONFIG.tokenName);
            
            if (authData) {
                try {
                    const { token, expiry } = JSON.parse(authData);
                    
                    if (Date.now() < expiry) {
                        // Token is valid, redirect to main page
                        window.location.href = CONFIG.redirectUrl;
                        return true;
                    } else {
                        // Token expired
                        localStorage.removeItem(CONFIG.tokenName);
                    }
                } catch (error) {
                    console.error('Auth check error:', error);
                    localStorage.removeItem(CONFIG.tokenName);
                }
            }
            
            return false;
        }
        
        // Initialize
        loadTheme();
        checkAuth();
        
        // Add keyboard shortcut (Enter to submit)
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin(e);
            }
        });
    </script>
</body>
</html>
