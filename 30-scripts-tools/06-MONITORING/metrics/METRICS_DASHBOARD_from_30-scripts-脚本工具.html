<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标驱动仪表板</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; color: #333; }
        .mode-badge { display: inline-block; padding: 10px 20px; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .mode-Acceleration { background: #f44336; color: white; }
        .mode-Optimization { background: #ff9800; color: white; }
        .mode-Hardening { background: #4CAF50; color: white; }
        .mode-Recovery { background: #9c27b0; color: white; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .metric-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .metric-card h3 { margin: 0 0 10px 0; color: #666; font-size: 14px; }
        .metric-value { font-size: 36px; font-weight: bold; color: #333; }
        .metric-value.high { color: #f44336; }
        .metric-value.medium { color: #ff9800; }
        .metric-value.low { color: #4CAF50; }
        .metric-detail { margin-top: 10px; font-size: 12px; color: #999; }
        .risk-badge { display: inline-block; padding: 5px 10px; border-radius: 3px; font-size: 12px; font-weight: bold; }
        .risk-高 { background: #f44336; color: white; }
        .risk-中 { background: #ff9800; color: white; }
        .risk-低 { background: #4CAF50; color: white; }
        .chart-container { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .refresh-btn { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #1976D2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 指标驱动仪表板</h1>
            <div id="modeBadge" class="mode-badge">加载中...</div>
            <button class="refresh-btn" onclick="loadMetrics()" style="margin-left: 20px;">刷新</button>
            <p style="margin-top: 10px; color: #666;">最后更新：<span id="lastUpdate">-</span></p>
        </div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>🎯 北极星指标</h3>
                <div id="northStar" class="metric-value">-</div>
                <div class="metric-detail">核心成功指标</div>
            </div>
            
            <div class="metric-card">
                <h3>⚠️ 风险等级</h3>
                <div id="riskLevel" class="metric-value">-</div>
                <div class="metric-detail">综合风险评估</div>
            </div>
            
            <div class="metric-card">
                <h3>📈 增长动力</h3>
                <div id="growthMomentum" class="metric-value">-</div>
                <div class="metric-detail">增长动量指标</div>
            </div>
            
            <div class="metric-card">
                <h3>💎 返回质量</h3>
                <div id="returnQuality" class="metric-value">-</div>
                <div class="metric-detail">返回质量评分</div>
            </div>
            
            <div class="metric-card">
                <h3>😊 升级满意度</h3>
                <div id="upgradeSatisfaction" class="metric-value">-</div>
                <div class="metric-detail">升级满意度</div>
            </div>
            
            <div class="metric-card">
                <h3>📊 进度清晰度</h3>
                <div id="progressClarity" class="metric-value">-</div>
                <div class="metric-detail">进度清晰度评分</div>
            </div>
            
            <div class="metric-card">
                <h3>🛡 稳定性评分</h3>
                <div id="stabilityScore" class="metric-value">-</div>
                <div class="metric-detail">系统稳定性</div>
            </div>
            
            <div class="metric-card">
                <h3>❌ 失败率</h3>
                <div id="failRate" class="metric-value">-</div>
                <div class="metric-detail">任务失败率</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2>📊 指标详情</h2>
            <table id="metricsTable" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #f5f5f5;">
                        <th style="padding: 10px; text-align: left;">指标</th>
                        <th style="padding: 10px;">值</th>
                        <th style="padding: 10px;">状态</th>
                    </tr>
                </thead>
                <tbody id="metricsBody"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadMetrics() {
            try {
                const response = await fetch('metrics_history.csv');
                const text = await response.text();
                const rows = text.trim().split('\n').slice(-1)[0];
                const cols = rows.split(',');
                
                const metrics = {
                    NorthStar: parseFloat(cols[1]),
                    RiskLevel: cols[11],
                    Mode: cols[12],
                    GrowthMomentum: parseFloat(cols[2]),
                    ReturnQuality: parseFloat(cols[3]),
                    UpgradeSatisfaction: parseFloat(cols[4]),
                    ProgressClarity: parseFloat(cols[5]),
                    StabilityScore: parseFloat(cols[6]),
                    FailRate: parseFloat(cols[7])
                };
                
                updateDisplay(metrics);
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('modeBadge').textContent = '加载失败';
            }
        }
        
        function updateDisplay(metrics) {
            // 模式徽章
            const modeBadge = document.getElementById('modeBadge');
            modeBadge.textContent = metrics.Mode + ' Mode';
            modeBadge.className = 'mode-badge mode-' + metrics.Mode;
            
            // 北极星指标
            const northStar = document.getElementById('northStar');
            northStar.textContent = metrics.NorthStar + '%';
            northStar.className = 'metric-value ' + (metrics.NorthStar >= 85 ? 'low' : metrics.NorthStar >= 50 ? 'medium' : 'high');
            
            // 风险等级
            const riskLevel = document.getElementById('riskLevel');
            riskLevel.textContent = metrics.RiskLevel;
            riskLevel.className = 'metric-value risk-' + metrics.RiskLevel;
            
            // 支撑指标
            document.getElementById('growthMomentum').textContent = metrics.GrowthMomentum + '%';
            document.getElementById('returnQuality').textContent = metrics.ReturnQuality + '%';
            document.getElementById('upgradeSatisfaction').textContent = metrics.UpgradeSatisfaction + '%';
            document.getElementById('progressClarity').textContent = metrics.ProgressClarity + '%';
            document.getElementById('stabilityScore').textContent = metrics.StabilityScore + '%';
            document.getElementById('failRate').textContent = metrics.FailRate + '%';
            
            // 详情表格
            const tbody = document.getElementById('metricsBody');
            tbody.innerHTML = `
                <tr><td>北极星指标</td><td>${metrics.NorthStar}%</td><td>${getStatus(metrics.NorthStar, 85, 50)}</td></tr>
                <tr><td>增长动力</td><td>${metrics.GrowthMomentum}%</td><td>${getStatus(metrics.GrowthMomentum, 80, 60)}</td></tr>
                <tr><td>返回质量</td><td>${metrics.ReturnQuality}%</td><td>${getStatus(metrics.ReturnQuality, 80, 60)}</td></tr>
                <tr><td>升级满意度</td><td>${metrics.UpgradeSatisfaction}%</td><td>${getStatus(metrics.UpgradeSatisfaction, 80, 60)}</td></tr>
                <tr><td>进度清晰度</td><td>${metrics.ProgressClarity}%</td><td>${getStatus(metrics.ProgressClarity, 80, 60)}</td></tr>
                <tr><td>稳定性评分</td><td>${metrics.StabilityScore}%</td><td>${getStatus(metrics.StabilityScore, 80, 60)}</td></tr>
                <tr><td>失败率</td><td>${metrics.FailRate}%</td><td>${metrics.FailRate < 1 ? '✅' : '⚠️'}</td></tr>
                <tr><td>风险等级</td><td>${metrics.RiskLevel}</td><td>${metrics.RiskLevel === '低' ? '✅' : metrics.RiskLevel === '中' ? '⚠️' : '❌'}</td></tr>
            `;
        }
        
        function getStatus(value, good, bad) {
            if (value >= good) return '✅';
            if (value >= bad) return '⚠️';
            return '❌';
        }
        
        // 初始化
        loadMetrics();
        setInterval(loadMetrics, 30000); // 30 秒自动刷新
    </script>
</body>
</html>
