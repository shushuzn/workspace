# ArXiv 收集配置
arxiv:
  # 输出格式 (支持 Level 2 分析)
  output_format: json
  save_raw: true
  
  # 收集类别
  categories:
    - cond-mat.mtrl-sci
    - cond-mat.soft
    - cond-mat.mes-hall
    - cond-mat.stat-mech
    - cond-mat.supr-con
    - cond-mat.dis-nn
    - cond-mat.str-el
    - physics.chem-ph
    - physics.comp-ph
  
  # 每类别论文数
  max_papers_per_category: 15
  
  # 保存路径
  save_dir: "D:\\obsidian\\Vault\\Arxiv\\daily"
  
  # 去重配置
  deduplication:
    enabled: true
    check_field: arxiv_id
  
  # 日志配置
  logging:
    level: INFO
    file: logs/collect.log
    max_size: 10MB
    backup_count: 7
