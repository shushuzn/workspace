# 报告生成配置
report:
  # 模板文件
  template: templates/daily-report.md
  
  # 输出目录
  output_dir: outputs/
  
  # 自动命名
  auto_naming: true
  naming_pattern: "AUTO-REPORT-{date}.md"
  
  # 包含内容
  include:
    - hot_topics
    - emerging_fields
    - recommendations
    - statistics
  
  # 日志配置
  logging:
    level: INFO
    file: logs/report.log
    max_size: 10MB
    backup_count: 7
