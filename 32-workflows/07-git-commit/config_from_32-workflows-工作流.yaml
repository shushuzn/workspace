# Git 提交配置
git:
  # 仓库路径
  repo_path: "D:\\OpenClaw\\workspace"
  
  # 提交信息前缀
  commit_prefix: "🤖 Automated"
  
  # 自动推送
  auto_push: true
  
  # 远程仓库
  remote: origin
  branch: master
  
  # 包含的文件模式
  include_patterns:
    - "reports/AUTO-*.md"
    - "knowledge-graph/*.json"
    - "workflows/*/logs/*.log"
  
  # 日志配置
  logging:
    level: INFO
    file: logs/git.log
    max_size: 10MB
    backup_count: 7
