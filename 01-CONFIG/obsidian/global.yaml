# 全局配置
global:
  # 系统版本
  version: "2.0"
  
  # 日期格式
  date_format: "%Y-%m-%d"
  datetime_format: "%Y-%m-%dT%H:%M:%S"
  
  # 路径配置
  paths:
    workspace: "D:\\OpenClaw\\workspace"
    obsidian_vault: "D:\\obsidian\\Vault"
  
  # 日志配置
  logging:
    level: INFO
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 重试配置
  retry:
    max_attempts: 3
    delay_seconds: 60
  
  # 超时配置
  timeout:
    http_request: 30
    file_operation: 10
  
  # 质量检查点
  quality_gates:
    enabled: true
    min_score: 0.80
    stop_on_failure: true
  
  # 监控配置
  monitoring:
    enabled: true
    interval_minutes: 30
    alert_on_failure: true
