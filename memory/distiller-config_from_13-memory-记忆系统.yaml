# Memory Distiller 配置文件

# 输入配置
input:
  daily_notes_dir: memory/
  include_patterns:
    - "*.md"
  exclude_patterns:
    - "README.md"
    - "SYNC-STATUS-*.md"

# 输出配置
output:
  memory_file: MEMORY.md
  backup_before_update: true
  max_backups: 5

# 蒸馏配置
distillation:
  # 观点提取
  extract_viewpoints: true
  min_confidence: 0.7  # 最小置信度
  
  # 去重配置
  deduplication:
    enabled: true
    similarity_threshold: 0.85  # 语义相似度阈值
  
  # 分类配置
  categories:
    - "Agentic AI 架构"
    - "MCP 生态系统"
    - "LLM 推理优化"
    - "研究自动化"
    - "AI 安全与对齐"
  
  # 置信度评估
  confidence_levels:
    high: "高"    # ≥3 独立来源
    medium: "中"  # 1-2 来源
    low: "低"     # 待验证
  
  # 状态标记
  status_labels:
    verified: "✅ 已验证"
    tracking: "🔄 追踪中"
    refuted: "❌ 已证伪"
    paused: "⏸️ 搁置"

# 更新策略
update:
  # 增量更新
  incremental: true
  # 保留历史记录
  keep_history: true
  # 自动生成编号
  auto_numbering: true
  # 编号前缀
  numbering_prefix: "{CATEGORY}-{NUMBER:03d}"

# 定时任务
schedule:
  enabled: true
  frequency: weekly  # daily, weekly, monthly
  day_of_week: "Sunday"  # 每周日执行
  time: "23:00"
  timezone: "Asia/Shanghai"

# 质量检查
quality:
  # 最小观点数
  min_viewpoints_per_distill: 1
  # 最大观点数 (避免过载)
  max_viewpoints_per_distill: 20
  # 自动合并相似观点
  auto_merge_similar: true
